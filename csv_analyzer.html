  }

  function renderFocus() {
    // 값 입력란에 치는 중이었으면 다시 그린 뒤에도 그 자리에 (계산 결과·화면 크기 변화로 다시 그린다)
    const ae = document.activeElement;
    const typing = ae && ae.classList && ae.classList.contains('graph__markin') && focusBox.contains(ae) ? { a: ae.selectionStart, b: ae.selectionEnd } : null;
    clear(focusBox);
    focusBox.dataset.ready = focusPending ? 'false' : 'true';
    focusBox.classList.toggle('is-hidden', focusCol == null);
    for (const c of grid.children) c.classList.toggle('is-active', Number(c.dataset.col) === focusCol);
    if (focusCol == null) return;
    const name = ds ? ds.header[focusCol] : '';
    const btnClose = h('button', { class: 'btn btn--sm', type: 'button', text: '닫기' });
    btnClose.addEventListener('click', () => { resetFocus(); renderFocus(); });
    // 그릴 수 없는 열 (예: X 로 바꾼 열, 값 종류가 많은 글자 열) — 끝없는 「계산 중」 대신 이유를. 값이 있는 열이면 「나온 때」는 볼 수 있다
    const canDraw = drawable(focusCol), markable = canMark(focusCol);
    const skip = overview && !canDraw ? overview.skipped.find((x) => x.col === focusCol) : null;
    const skipText = `그래프로 그리지 않은 열 — ${skip ? skip.reason : '그릴 값이 없음'}`;
    if (!canDraw && !markable) {
      focusBox.append(h('div', { class: 'graph__fhead' }, h('div', { class: 'graph__ftitle' }, h('h2', { class: 'mono', text: name })), h('div', { class: 'row' }, btnClose)),
        h('div', { class: 'detail__empty', text: skipText }));
      return;
    }
    const fs = focusSeries();
    const titleBox = h('div', { class: 'graph__ftitle' }, h('h2', { class: 'mono', text: name }));
    if (fs) {
      const res = (fs.r.x1 - fs.r.x0) / 1000;
      if (fs.s) titleBox.append(h('span', { class: 'badge' + (fs.s.hex ? ' badge--hex' : ''), text: KIND_LABEL[kindOf(fs.s)] }));
      titleBox.append(h('span', { class: 'muted graph__frange', text: `${fs.r.xName} ${formatX(fs.r.x0, res)} ~ ${formatX(fs.r.x1, res)}${zoom ? ' (확대)' : ''}${fs.stale ? ' · 계산 중…' : ''}` }));
    }
    const btnReset = h('button', { class: 'btn btn--sm', type: 'button', text: '전체 범위', disabled: !zoom, title: '확대 전으로 (그래프를 두 번 눌러도 됩니다)' });
    btnReset.addEventListener('click', resetZoom);
    const btnTable = h('button', { class: 'btn btn--sm' + (tableOpen ? ' is-active' : ''), type: 'button', text: tableOpen ? '표 닫기' : '표로 보기', disabled: !fs });
    btnTable.addEventListener('click', () => { tableOpen = !tableOpen; renderFocus(); });
    focusBox.appendChild(h('div', { class: 'graph__fhead' }, titleBox, h('div', { class: 'row' }, btnReset, btnTable, btnClose)));
    if (markable) {
      const bar = markBarEl(fs ? fs.s : null);
      focusBox.appendChild(bar);
      if (typing) { const i = bar.querySelector('.graph__markin'); i.focus(); i.setSelectionRange(typing.a, typing.b); }
    }
    if (!canDraw) focusBox.appendChild(h('div', { class: 'faint graph__hint', text: `${skipText} — 값을 넣으면 그 값이 나온 때를 막대로 그립니다.` }));
    if (!fs || (!fs.s && !markValues.length)) {
      if (canDraw || markValues.length) focusBox.appendChild(h('div', { class: 'detail__empty', text: overviewError || '계산 중…' }));
      return;
    }
    if (!fs.stale) lastShown = { r: fs.r, s: fs.s };

    const marked = markOf(fs.r);
    const canvas = h('canvas', { class: 'graph__fcanvas', tabindex: '0', role: 'img', 'aria-label': `${name} — ${fs.r.xName}에 따른 변화. 끌어서 확대, 두 번 눌러 전체 범위, ← → 로 구간 이동` });
    const cross = h('div', { class: 'graph__cross is-hidden' });
    const sel = h('div', { class: 'graph__sel is-hidden' });
    const tip = h('div', { class: 'graph__tip is-hidden', role: 'status' });
    focusBox.appendChild(h('div', { class: 'graph__fwrap' + (fs.stale ? ' is-stale' : '') }, canvas, cross, sel, tip));
    const sum = markSumEl(fs.r, fs.s, fs.stale);
    if (sum) focusBox.appendChild(sum);
    focusBox.appendChild(legendFor(fs));
    focusBox.appendChild(h('div', { class: 'faint graph__hint', text: `끌어서 확대 · 두 번 눌러 전체 범위 · 그래프를 누른 뒤 ← → 로 ${marked && marked.items.some((it) => it.total) ? '넣은 값이 나온 구간' : '구간'} 이동` }));
    if (tableOpen) focusBox.appendChild(tableEl(fs.r, fs.s));
    requestAnimationFrame(() => { if (canvas.isConnected) drawFocus(canvas, fs, { cross, sel, tip }); });
  }

  /** 넣은 값의 색: 범주 열이면 그 값의 범주 색(색은 값을 따른다 — 범주 그림과 같은 색), 범주 밖의 값은 무채색 두 가지를 번갈아
   *  (범주 색을 빌리면 다른 값으로 읽힌다 — 이름 글자가 늘 함께 있다), 아니면 선(--viz-1) 다음 색들 중 그 값의 자리 */
  function markColor(s, v) {
    if (s && s.kind === 'cat') {
      const k = s.labels.indexOf(v);
      return k >= 0 && k !== s.other ? catColor(s, k) : cssVar((markSlots.get(v) || 0) % 2 ? '--fg-muted' : '--fg');
    }
    return cssVar(MARK_COLORS[(markSlots.get(v) || 0) % MARK_COLORS.length]);
  }
  const dotEl = (s, v) => { const d = h('span', { class: 'graph__dot' }); d.style.background = markColor(s, v); return d; };

  /** 「값이 나온 때」 입력 — 쉼표로 여럿 · Enter·표시, 지우기, 자주 나온 값 (눌러서 넣기/빼기) */
  function markBarEl(s) {
    const st = prof.stats[focusCol];
    const input = h('input', { class: 'input graph__markin', type: 'text', placeholder: st.hexLike ? '예: 0x5C5C, 0x000C' : '값, 값 …', spellcheck: 'false', autocomplete: 'off', value: markDraft, 'aria-label': `${st.name} 에서 나온 때를 볼 값 — 쉼표로 ${MARK_MAX}개까지` });
    input.addEventListener('input', () => { markDraft = input.value; });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); setMarks(splitValues(input.value), true); } else if (e.key === 'Escape' && markValues.length) { e.preventDefault(); setMarks([], true); }
    });
    const show = h('button', { class: 'btn btn--sm btn--accent', type: 'button', text: '표시' });
    show.addEventListener('click', () => setMarks(splitValues(input.value), true));
    const clr = h('button', { class: 'btn btn--sm', type: 'button', text: '지우기', disabled: !markValues.length });
    clr.addEventListener('click', () => setMarks([], true));
    const bar = h('div', { class: 'graph__markbar' }, h('label', { class: 'graph__marklabel' }, h('span', { text: '값이 나온 때' }), input), show, clr,
      h('span', { class: markNote ? 'muted graph__marknote' : 'faint', text: markNote || `쉼표로 ${MARK_MAX}개까지 비교 · 쉼표가 든 값은 "…"` }));
    const top = (st.top || []).filter(([v]) => v !== '').slice(0, 6);
    if (top.length) {
      bar.appendChild(h('div', { class: 'chips graph__markchips' }, h('span', { class: 'faint', text: '자주 나온 값' }), ...top.map(([v, n]) => {
        const q = normMarks(focusCol, [v])[0];
        const on = markValues.includes(q), full = !on && markValues.length >= MARK_MAX;
        const c = h('button', { class: 'chip' + (on ? ' is-active' : ''), type: 'button', disabled: full, 'aria-pressed': on ? 'true' : 'false',
          title: full ? `${MARK_MAX}개까지 — 하나를 빼고 넣으세요` : `${fmtInt(n)}회 — 눌러서 ${on ? '빼기' : '넣기'}` }, ...(on ? [dotEl(s, q)] : []), v);
        c.addEventListener('click', () => toggleMark(v));
        return c;
      })));
    }
    return bar;
  }

  /** 「값이 나온 때」 요약 표 — 값마다 횟수, 값 있는 행·(필터 통과/전체) 행 중 비율, 처음·마지막으로 나온 행(눌러서 표로), 합계 */
  function markSumEl(r, s, stale) {
    if (!markValues.length) return null;
    const m = stale ? null : markOf(r); // 확대 계산 중의 직전 그림은 다른 범위의 수 — 섞어 보이지 않게
    const el = h('div', { class: 'graph__marksum', role: 'status' });
    if (!m) { el.appendChild(h('span', { class: 'muted', text: `「${markValues.join(', ')}」 세는 중…` })); return el; }
    const base = sumOf(r.rows);
    // 비율의 범위: 확대 범위 · 필터 통과 · X(시간) 값이 있는 행 (X 가 없는 행은 그래프에 놓을 자리가 없어 빠진다)
    const scope = `${zoom ? '확대 범위의 ' : ''}${filterConds ? '필터 통과' : '전체'}`;
    // 「이 값인 행만」 뒤처럼 필터에 이 열 조건이 있으면 다른 값은 이미 걸러져 없음으로 나온다 — 알려 준다
    const colFiltered = !!(filterConds && filterConds.some((c) => c.col === focusCol));
    el.appendChild(h('div', { class: 'muted graph__markbase', text: `비율 기준 — 값 있는 ${fmtInt(m.haveTotal)}행 · ${scope} ${fmtInt(base)}행${r.noX ? ` (${r.xName} 값 없는 ${fmtInt(r.noX)}행 제외)` : ''}${colFiltered ? ' · 필터에 이 열의 조건이 있어 그 값들만 남아 있습니다' : ''}` }));
    const pct = (n, d) => (d ? fmtShare(n / d) : '-');
    const at = (row, x) => (r.xCol < 0 ? `행 ${fmtInt(row + 1)}` : `${formatX(x, 1e-6)} (행 ${fmtInt(row + 1)})`);
    const jump = (row, x) => {
      const b = h('button', { class: 'btn btn--sm', type: 'button', text: at(row, x), title: '표에서 이 행으로' });
      b.addEventListener('click', () => onGotoRow && onGotoRow(row, focusCol));
      return b;
    };
    const body = h('tbody');
    for (const it of m.items) {
      const none = !it.total;
      body.appendChild(h('tr', { dataset: { value: it.value } },
        h('td', {}, h('span', { class: 'graph__markval' }, dotEl(s, it.value), h('strong', { class: 'mono', text: it.value }))),
        h('td', { class: 'num', text: none ? '없음' : `${fmtInt(it.total)}회` }),
        h('td', { class: 'num', text: none ? '-' : pct(it.total, m.haveTotal) }),
        h('td', { class: 'num', text: none ? '-' : pct(it.total, base) }),
        h('td', {}, ...(none ? [] : [jump(it.firstRow, it.firstX)])),
        h('td', {}, ...(it.total > 1 ? [jump(it.lastRow, it.lastX)] : []))));
    }
    // 합계는 값 중 하나라도 나온 행 — 5 와 05 처럼 같은 행을 두 값이 세어도 한 번 (「이 값들인 행만」 필터의 행 수와 같다)
    const hits = m.anyTotal;
    if (m.items.length > 1) {
      body.appendChild(h('tr', { class: 'graph__marktotal' }, h('td', { text: '합계' }), h('td', { class: 'num', text: `${fmtInt(hits)}회` }),
        h('td', { class: 'num', text: pct(hits, m.haveTotal) }), h('td', { class: 'num', text: pct(hits, base) }), h('td'), h('td')));
    }
    const head = ['값', '횟수', '값 있는 행 중', `${scope} 중`, '처음', '마지막'];
    el.appendChild(h('div', { class: 'graph__marktablewrap' }, h('table', { class: 'kv graph__marktable' }, h('thead', {}, h('tr', {}, ...head.map((x) => h('th', { text: x })))), body)));
    if (hits) {
      const many = m.items.length > 1;
      const only = h('button', { class: 'btn btn--sm btn--accent', type: 'button', text: many ? '이 값들인 행만 표에서' : '이 값인 행만 표에서',
        title: `필터에 ${many ? '「여럿 중 하나」' : '「=」'} 조건을 더해, 표에서 그 값이 나온 행(과 시각)을 차례로 봅니다` });
      only.addEventListener('click', () => onFilterValue && onFilterValue(focusCol, markValues.slice()));
      el.appendChild(h('div', { class: 'row graph__markacts' }, only));
    }
    return el;
  }

  function legendFor(fs) {
    const lg = fs.s ? legendEl(fs.s) : h('div', { class: 'legend graph__legend' });
    const m = markOf(fs.r);
    if (m && m.items.some((it) => it.total)) {
      for (const it of m.items) if (it.total) lg.appendChild(h('span', { class: 'legend__item' }, dotEl(fs.s, it.value), h('span', { class: 'mono', text: it.value })));
      const dots = !!fs.s && fs.s.kind === 'num' && m.items.some((it) => it.num != null);
      lg.appendChild(h('span', { class: 'legend__item faint', text: dots ? '점선 위 점: 그 값이 나온 때 · 아래 칸: 값마다 구간별 나온 횟수' : '아래 칸: 값마다 구간별 나온 횟수' }));
    }
    return lg;
  }

  function drawFocus(canvas, fs, ui) {
    const { r, s } = fs;
    const m = markOf(r);
    // 값을 넣었으면 아래에 값마다 구간별 횟수 칸 (0회인 값도 — 비교하려고 넣은 값이니). 칸마다 축 하나, 눈금은 같은 높이로 맞춘다
    const items = m ? m.items : [];
    const stripH = items.length > 1 ? STRIP_H_MULTI : STRIP_H;
    const ys = s ? yScaleOf(s, 4) : null;
    const main = !!ys; // 위 칸(값) — 범위 안에 숫자로 읽히는 값이 하나도 없으면 아래 칸만
    if (!main && !items.length) return;
    const H = (main ? FOCUS_PLOT_H : 8) + items.length * (STRIP_GAP + stripH) + 26;
    canvas.style.height = `${H}px`;
    const W = canvas.clientWidth || 800;
    const ctx = setupCanvas(canvas, W, H);
    ctx.font = `11px ${cssVar('--sans')}`;
    const tickText = (v) => (s.kind === 'cat' ? `${Math.round(v * 100)}%` : formatTick(v, { hex: s.hex, step: ys.step }));
    let maxHit = 0;
    for (const it of items) for (let b = 0; b < it.hits.length; b++) if (it.hits[b] > maxHit) maxHit = it.hits[b];
    const labels = [...(ys ? ys.ticks.map(tickText) : []), ...(items.length ? [`${fmtInt(maxHit)}회`] : [])];
    const gut = Math.ceil(Math.max(0, ...labels.map((t) => ctx.measureText(t).width))) + 10;
    const plot = { l: gut, t: 8, w: W - gut - 4, h: main ? FOCUS_PLOT_H - 8 : 0 };
    if (main) {
      // 가로 격자(실선 머리카락, 뒤로 물러난 색)와 Y 눈금
      ctx.strokeStyle = cssVar('--viz-grid'); ctx.lineWidth = 1;
      ctx.fillStyle = cssVar('--fg-muted'); ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
      for (const v of ys.ticks) {
        const y = Math.round(plot.t + plot.h - ((v - ys.lo) / (ys.hi - ys.lo)) * plot.h) + 0.5;
        ctx.beginPath(); ctx.moveTo(plot.l, y); ctx.lineTo(plot.l + plot.w, y); ctx.stroke();
        ctx.fillText(tickText(v), plot.l - 6, y);
      }
      drawSeries(ctx, s, plot, ys);
      if (s.kind === 'num') for (const it of items) if (it.total && it.num != null && it.num >= ys.lo && it.num <= ys.hi) drawMarkLine(ctx, it, plot, ys, markColor(s, it.value));
    }
    let bottom = plot.t + plot.h;
    for (const it of items) bottom = drawStrip(ctx, it, maxHit, { l: plot.l, t: bottom + STRIP_GAP, w: plot.w, h: stripH }, markColor(s, it.value));
    plot.bottom = bottom; // 기준선·끌기 선택은 아래 칸까지
    // X 축 (맨 아래 칸 밑에 한 번) — 범위는 데이터 그대로, 눈금만 깔끔하게
    const xsc = niceScale(r.x0, r.x1, Math.max(2, Math.floor(plot.w / 110)));
    ctx.strokeStyle = cssVar('--viz-axis'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(plot.l, bottom + 0.5); ctx.lineTo(plot.l + plot.w, bottom + 0.5); ctx.stroke();
    ctx.fillStyle = cssVar('--fg-muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const v of xsc.ticks) {
      if (v < r.x0 || v > r.x1) continue;
      const x = plot.l + ((v - r.x0) / (r.x1 - r.x0 || 1)) * plot.w;
      ctx.fillText(formatTick(v, { step: xsc.step }), Math.min(Math.max(x, plot.l + 18), plot.l + plot.w - 18), bottom + 6);
    }
    if (!fs.stale) wireFocus(canvas, fs, plot, ui); // 계산 중인 흐린 그림은 조작하지 않는다
  }

  /** 넣은 값의 높이에 가는 점선, 그 값이 나온 구간마다 8px 점(표면색 테두리 — 선과 겹쳐도 보이게) */
  function drawMarkLine(ctx, it, plot, ys, color) {
    const B = it.hits.length;
    const y = Math.round(plot.t + plot.h - ((it.num - ys.lo) / (ys.hi - ys.lo)) * plot.h) + 0.5;
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(plot.l, y); ctx.lineTo(plot.l + plot.w, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.strokeStyle = cssVar('--bg-panel'); ctx.lineWidth = 2;
    for (let b = 0; b < B; b++) {
      if (!it.hits[b]) continue;
      ctx.beginPath(); ctx.arc(plot.l + ((b + 0.5) / B) * plot.w, y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  /** 아래 칸 하나: 그 값이 구간마다 나온 횟수 막대 (축 하나 — 0 ~ 최대 횟수, 칸끼리 같은 높이). 칸 이름은 위 간격에 색 점 + 글자색 글자 */
  function drawStrip(ctx, it, maxHit, st, color) {
    const B = it.hits.length;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(st.l + 4, st.t - 10, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cssVar('--fg-muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(`${it.value} — ${it.total ? `${fmtInt(it.total)}회` : '없음'}`, st.l + 12, st.t - 4);
    ctx.strokeStyle = cssVar('--viz-grid'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(st.l, Math.round(st.t) + 0.5); ctx.lineTo(st.l + st.w, Math.round(st.t) + 0.5); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${fmtInt(maxHit)}회`, st.l - 6, st.t);
    ctx.fillText('0', st.l - 6, st.t + st.h);
    if (!maxHit) return st.t + st.h;
    ctx.fillStyle = color;
    const bw = st.w / B;
    const wpx = Math.max(2, bw > 4 ? bw - 1 : bw); // 막대 사이 1px 간격 (구간이 넓을 때), 아무리 좁아도 2px — 한 번 나온 것도 보이게
    for (let b = 0; b < B; b++) {
      const n = it.hits[b];
      if (!n) continue;
      const hh = Math.max(2, (n / maxHit) * st.h);
      ctx.fillRect(st.l + b * bw + (bw - wpx) / 2, st.t + st.h - hh, wpx, hh);
    }
    return st.t + st.h;
  }

  function wireFocus(canvas, fs, plot, { cross, sel, tip }) {
    const { r, s } = fs;
    const B = r.buckets;
    const m = markOf(r);
    const items = m ? m.items : [];
    const panelH = plot.bottom - plot.t;
    const hitAt = (b) => items.some((it) => it.hits[b] > 0);
    // 기준선은 가장 가까운 값 있는 구간에 붙는다 (듬성듬성한 데이터에서 빈 구간을 가리키지 않게)
    const hasData = (b) => (!s ? hitAt(b) : s.kind === 'cat' ? s.labels.some((_, k) => s.counts[b * s.labels.length + k]) : s.cnt[b] > 0);
    const navHas = items.some((it) => it.total) ? hitAt : hasData; // 값을 넣었으면 ←→ 는 넣은 값 중 하나라도 나온 구간으로
    const snap = (b) => { for (let d = 0; d < B; d++) { if (b - d >= 0 && hasData(b - d)) return b - d; if (b + d < B && hasData(b + d)) return b + d; } return b; };
    const pxToB = (px) => snap(Math.max(0, Math.min(B - 1, Math.floor(((px - plot.l) / plot.w) * B))));
    const show = (b) => {
      hoverB = b;
      const cx = plot.l + ((b + 0.5) / B) * plot.w;
      cross.style.left = `${Math.round(cx)}px`; cross.style.top = `${plot.t}px`; cross.style.height = `${panelH}px`;
      cross.classList.remove('is-hidden');
      fillTip(tip, r, s, b);
      tip.classList.remove('is-hidden');
      const tw = tip.offsetWidth;
      tip.style.left = `${Math.round(cx + 12 + tw > plot.l + plot.w ? Math.max(0, cx - 12 - tw) : cx + 12)}px`;
      tip.style.top = `${plot.t + 4}px`;
    };
    const hide = () => { cross.classList.add('is-hidden'); tip.classList.add('is-hidden'); };
    let dragFrom = null;
    const endDrag = () => { dragFrom = null; sel.classList.add('is-hidden'); };
    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return; // 왼쪽 버튼으로만 확대
      if (e.offsetX < plot.l || e.offsetX > plot.l + plot.w) return;
      dragFrom = e.offsetX;
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      const x = Math.max(plot.l, Math.min(plot.l + plot.w, e.offsetX));
      if (dragFrom != null && Math.abs(x - dragFrom) > 3) {
        sel.classList.remove('is-hidden');
        sel.style.left = `${Math.min(x, dragFrom)}px`; sel.style.width = `${Math.abs(x - dragFrom)}px`;
        sel.style.top = `${plot.t}px`; sel.style.height = `${panelH}px`;
      }
      show(pxToB(x));
    });
    canvas.addEventListener('pointerleave', () => { if (dragFrom == null) hide(); });
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', () => { if (dragFrom != null) endDrag(); });
    canvas.addEventListener('pointerup', (e) => {
      if (dragFrom == null) return;
      const a = Math.min(dragFrom, e.offsetX), b = Math.max(dragFrom, e.offsetX);
      endDrag();
      if (b - a < 6) return;
      const toX = (px) => r.x0 + ((Math.max(plot.l, Math.min(plot.l + plot.w, px)) - plot.l) / plot.w) * (r.x1 - r.x0);
      zoom = [toX(a), toX(b)];
      focusData = null;
      renderFocus();
      refineFocus();
    });
    canvas.addEventListener('dblclick', resetZoom);
    canvas.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        // ←→ 는 값 있는 다음 구간으로 (값을 넣었으면 그 값이 나온 다음 구간으로)
        const dir = e.key === 'ArrowRight' ? 1 : -1;
        let nb = hoverB < 0 ? (dir > 0 ? 0 : B - 1) : hoverB + dir;
        while (nb >= 0 && nb < B && !navHas(nb)) nb += dir;
        if (nb >= 0 && nb < B) show(nb);

  /** 툴팁 — 값이 먼저(굵게), 이름은 뒤. 글자는 textContent 로만 (열 이름·값은 파일에서 온 글자) */
  function fillTip(tip, r, s, b) {
    clear(tip);
    const [from, to] = bucketRange(b, r.x0, r.x1, r.buckets);
    const res = (r.x1 - r.x0) / r.buckets;
    tip.appendChild(h('div', { class: 'graph__tiphead', text: `${r.xName} ${formatX(from, res)} ~ ${formatX(to, res)}` }));
    const rowEl = (key, label, value) => h('div', { class: 'graph__tiprow' }, key, h('strong', { text: value }), h('span', { class: 'muted', text: label }));
    // 넣은 값마다: 이 구간에서 몇 번, 이 구간 값 중 몇 %
    const m = markOf(r);
    const markRow = () => {
      if (m) for (const it of m.items) tip.appendChild(rowEl(dotEl(s, it.value), m.have[b] ? `${it.value} · 구간 값의 ${fmtShare(it.hits[b] / m.have[b])}` : it.value, `${fmtInt(it.hits[b])}회`));
    };
    const noValue = () => { if (m && m.items.some((it) => it.hits[b])) markRow(); else tip.appendChild(h('div', { class: 'muted', text: '이 구간에 값 없음' })); };
    if (!s) { markRow(); return; }
    if (s.kind === 'cat') {
      const K = s.labels.length;
      let tot = 0;
      for (let k = 0; k < K; k++) tot += s.counts[b * K + k];
      if (!tot) { noValue(); return; }
      for (let k = 0; k < K; k++) {
        const key = h('span', { class: 'graph__key' });
        key.style.background = catColor(s, k);
        const n = s.counts[b * K + k];
        tip.appendChild(rowEl(key, s.labels[k], `${((n / tot) * 100).toFixed(1)}% · ${fmtInt(n)}`));
      }
      markRow();
      return;
    }
    if (!s.cnt[b]) { noValue(); return; }
    const line = h('span', { class: 'graph__key' });
    line.style.background = cssVar('--viz-1');
    const band = h('span', { class: 'graph__key graph__key--band' });
    band.style.background = rgba(cssVar('--viz-1'), 0.3);
    const fmt = (v) => formatValue(v, { hex: s.hex, width: s.width });
    tip.append(rowEl(line, '평균', fmt(s.mean[b])), rowEl(band, '최소 ~ 최대', `${fmt(s.min[b])} ~ ${fmt(s.max[b])}`));
    markRow();
    tip.appendChild(h('div', { class: 'muted graph__tipfoot', text: `값 ${fmtInt(s.cnt[b])}개` }));
  }

  /** 표로 보기 — 툴팁 없이도 모든 구간 값을 읽을 수 있게 (값이 없는 구간은 뺀다) */
  function tableEl(r, s) {
    const m = markOf(r);
    const head = !s ? ['구간'] : s.kind === 'cat' ? ['구간', '행 수', ...s.labels] : ['구간', '값 개수', '최소', '평균', '최대'];
    if (m) for (const it of m.items) head.push(`${it.value} 횟수`);
    const body = h('tbody');
    const fmt = (v) => formatValue(v, { hex: s.hex, width: s.width });
    const res = (r.x1 - r.x0) / r.buckets;
    for (let b = 0; b < r.buckets; b++) {
      const [from, to] = bucketRange(b, r.x0, r.x1, r.buckets);
      const range = `${formatX(from, res)} ~ ${formatX(to, res)}`;
      let cells;
      if (!s) {
        if (!m || !m.items.some((it) => it.hits[b])) continue; // 그리지 않는 열: 넣은 값이 나온 구간만 (값을 바꾼 직후 세기 전이면 빈 표)
        cells = [range];
      } else if (s.kind === 'cat') {
        const K = s.labels.length;
        const counts = Array.from({ length: K }, (_, k) => s.counts[b * K + k]);

        cells = [range, fmtInt(counts.reduce((a, c) => a + c, 0)), ...counts.map(fmtInt)];
      } else {
        if (!s.cnt[b]) continue;

      }
      if (m) for (const it of m.items) cells.push(fmtInt(it.hits[b]));
      body.appendChild(h('tr', {}, ...cells.map((c) => h('td', { text: c }))));
    }
    return h('div', { class: 'graph__tablewrap' }, h('table', { class: 'kv graph__table' }, h('thead', {}, h('tr', {}, ...head.map((x) => h('th', { text: x })))), body));

  function focus(col, value) {

  // 화면 크기·테마가 바뀌면 다시 그린다

  };

  return {
    /** 프로파일이 끝나면: X축 후보·기본(시간 열, 없으면 행 번호)과 지금의 필터로 시작한다 */
    setDataset(dataset, profile, conds) {
      ds = dataset; prof = profile;

      clear(xSel);

      if (visible()) ensureOverview();
    },
    show() { if (overview) redraw(); else ensureOverview(); },
    /** 표에서 고른 보이는 열만 작은 그래프로 (null = 모두) */
    setVisibleCols(cols) { visibleSet = cols ? new Set(cols) : null; autoFocused = false; if (overview) renderAll(); },
    focus,
    /** 필터가 바뀌면 그래프도 그 행들로 다시 */
    setFilter(conds) {
      const next = conds && conds.length ? conds : null;
      const k = next ? JSON.stringify(next) : '';

      filterConds = next; filterKey = k;

    },
    setProgress(msg) {

    },
    /** 열 상세 패널에 넣을 작은 그래프 + 「그래프 탭에서 크게 보기」 (패널은 한 번에 하나라 떨어진 것은 버린다) */

      const valBtn = h('button', { class: 'btn btn--sm', type: 'button', text: '이 값이 나온 때' });

      el.redraw = () => {
        if (!el.isConnected && !minis.has(el)) return;
        const s = overview && overview.series.find((x) => x.col === col);
        // 그릴 데이터가 있을 때만 그래프와 「크게 보기」 — 없으면 이유(계산 중·실패·그리지 않는 열)를
        canvas.classList.toggle('is-hidden', !s);
        btn.classList.toggle('is-hidden', !s);

        titleEl.textContent = `${overview.xName}에 따른 변화`;

        canvas.setAttribute('aria-label', `${ds ? ds.header[col] : ''} — ${overview.xName}에 따른 변화`);
        note.textContent = s ? '' : `그래프로 그리지 않음 — ${skip ? skip.reason : '그릴 값이 없음'}`;
        if (s) requestAnimationFrame(() => { if (canvas.isConnected) drawCard(canvas, s); });
      };
      minis.add(el);
      if (!overview) ensureOverview();
      el.redraw();
      return el;
    },
    clear() {
      // 필터는 비우지 않는다 — 필터 막대는 파일을 다시 열어도 조건을 그대로 두므로 그쪽과 같게 (다음 setDataset 이 다시 맞춘다)
      invalidate();
      resetFocus();
      ds = null; prof = null; visibleSet = null; autoFocused = false;
      clear(xSel); setBusy(false, '');

      renderAll();
    },
  };

const M_main_view_cols = (() => {
// 표 보기 계산: 필터를 통과한 행(원래 행 번호의 오름차순 목록) ↔ 표의 순번, 보이는 열 정리. DOM 을 쓰지 않는다.

/** 원래 행 r 이 걸러진 표의 몇 번째인지 — 필터에 가려진 행이면 -1 */
function indexOfRow(rows, r) {
  const i = lowerBound(rows, r);
  return i < rows.length && rows[i] === r ? i : -1;
}

/** 원래 행 r 이상인 첫 통과 행의 순번 (미니맵에서 그 근처로 갈 때). 끝을 넘으면 마지막. */
function lowerBound(rows, r) {
  let lo = 0, hi = rows.length;
  while (lo < hi) { const mid = (lo + hi) >>> 1; if (rows[mid] < r) lo = mid + 1; else hi = mid; }
  return Math.min(lo, Math.max(0, rows.length - 1));
}

/** 「이 열만 함께 보기」: 시간 열 + 필터에 쓴 열(RT·송수신 등) + 고른 열, 원래 순서로 한 번씩 */
function focusColumns({ col, timeCol, filter }) {
  const set = new Set([col]);
  if (timeCol >= 0) set.add(timeCol);
  for (const c of filter || []) set.add(c.col);
  return [...set].sort((a, b) => a - b);
}

/** 보이는 열 정리: 범위 밖·중복 제거, 정렬. 모두 보이거나 하나도 없으면 null (= 숨긴 열 없음) */
function normalizeVisible(cols, columnCount) {
  if (!cols) return null;
  const out = [...new Set(cols)].filter((c) => Number.isInteger(c) && c >= 0 && c < columnCount).sort((a, b) => a - b);
  return out.length === 0 || out.length === columnCount ? null : out;
}
return { indexOfRow, lowerBound, focusColumns, normalizeVisible };
})();

const M_main_ui_column_picker = (() => {
const { h, clear } = M_main_ui_dom;
const { normalizeVisible } = M_main_view_cols;
// 「보이는 열」 고르기: 표·그래프 탭에 보일 열을 고른다 (바꾸면 바로 적용). 열 이름은 파일에서 온 글자라 textContent 로만.



function createColumnPicker({ button, host, onChange }) {
  let header = [], visible = null, open = false, query = '';
  let headText = null, allBtn = null; // 열려 있을 때 체크만으로 바뀌는 부분

  button.addEventListener('click', () => { if (open) close(); else show(); });
  document.addEventListener('keydown', (e) => { if (open && e.key === 'Escape') close(); });
  document.addEventListener('mousedown', (e) => { if (open && !host.contains(e.target) && !button.contains(e.target)) close(); });

  function show() { open = true; host.classList.remove('is-hidden'); button.setAttribute('aria-expanded', 'true'); render(); }
  function close() { open = false; host.classList.add('is-hidden'); button.setAttribute('aria-expanded', 'false'); }
  const isOn = (c) => !visible || visible.includes(c);

  function label() {
    const n = visible ? visible.length : header.length;
    button.textContent = visible ? `열 ${n}/${header.length} ▾` : '열 ▾';
    button.classList.toggle('has-filter', !!visible);
    button.title = visible ? `${header.length}개 열 중 ${n}개만 보입니다` : '표·그래프에 보일 열 고르기';
  }

  const countText = () => `${header.length}개 중 ${visible ? visible.length : header.length}개 — 표와 그래프 탭에 적용됩니다. 열 상세의 「이 열만 함께 보기」로도 고를 수 있습니다.`;

  /** 체크박스로 바꿀 때: 목록은 그대로 두고(스크롤·포커스 유지) 개수와 「모두 보기」만 */
  function set(next) {
    visible = normalizeVisible(next, header.length);
    label();
    if (headText) headText.textContent = countText();
    if (allBtn) allBtn.disabled = !visible;
    onChange(visible);
  }

  function render() {
    clear(host);
    const search = h('input', { class: 'input', type: 'text', placeholder: '열 이름 찾기', spellcheck: 'false', autocomplete: 'off', value: query });
    search.addEventListener('input', () => { query = search.value; renderList(); });
    const all = h('button', { class: 'btn btn--sm', type: 'button', text: '모두 보기', disabled: !visible });
    all.addEventListener('click', () => { set(null); render(); });
    allBtn = all;
    const list = h('div', { class: 'colpick__list', role: 'group', 'aria-label': '보이는 열' });
    function renderList() {
      clear(list);
      const q = query.trim().toLowerCase();
      header.forEach((name, c) => {
        if (q && !name.toLowerCase().includes(q)) return;
        const box = h('input', { type: 'checkbox', checked: isOn(c) });
        box.addEventListener('change', () => {
          const cur = visible ? [...visible] : header.map((_, i) => i);
          const next = box.checked ? [...cur, c] : cur.filter((i) => i !== c);
          if (!next.length) { box.checked = true; return; } // 마지막 한 열은 숨길 수 없다
          set(next);
        });
        list.appendChild(h('label', { class: 'check colpick__item' }, box, h('span', { class: 'mono', text: name })));
      });
      if (!list.childElementCount) list.appendChild(h('div', { class: 'faint', text: '맞는 열이 없습니다' }));
    }
    renderList();
    host.append(
      h('div', { class: 'export__head' }, h('strong', { text: '보이는 열' }), headText = h('span', { class: 'muted', text: countText() })),
      h('div', { class: 'row' }, search, all), list);
    if (open) search.focus();
  }

  return {
    setColumns(names) { header = names || []; visible = null; query = ''; label(); if (open) render(); },
    /** 밖(열 상세 바로가기 등)에서 고른 열 — onChange 를 다시 부르지 않는다 */
    setVisible(cols) { visible = normalizeVisible(cols, header.length); label(); if (open) render(); },
    get visible() { return visible; },
    reset() { header = []; visible = null; query = ''; close(); label(); },
  };
}
return { createColumnPicker };
})();

// 표 보기: 필터를 통과한 원래 행 번호(오름차순, null = 필터 없음)와 보이는 열(null = 모두).

let viewRows = null, viewFilterId = null, filterSeq = 0, visibleCols = null, appliedFilterKey = '';
let prevHeader = null; // 다시 열기 전 파일의 머리글 — 열 구성이 같은 파일이면 필터를 이어 쓰고, 다르면 지운다
const toRow = (i) => (viewRows ? viewRows[i] : i);
const toIdx = (r) => (viewRows ? indexOfRow(viewRows, r) : r);

// ---------- 뷰 구성 ----------
const statusBar = createStatusBar($('#status-bar'));
const tableHost = $('#view-table');
const table = createTable({ container: tableHost, onCellClick: (i, col) => selectCell(toRow(i), col), onHeaderClick, onRangeChange: (a, b) => minimap.setViewport(toRow(a), toRow(b)) });
const minimapHost = h('div');
tableHost.appendChild(minimapHost);
const minimap = createMinimap({ container: minimapHost, onJump: (row) => { table.scrollToRow(viewRows ? lowerBound(viewRows, row) : row, 'start'); } });
const inputPanel = createInputPanel({ container: $('#input-panel'), onOpen, onReopen });
let groupBy = null;
let groupSeq = 0;
const profileView = createProfileView({
  container: $('#view-profile'), onColumnClick: showColumnDetail, onWordClick: (w) => actions.searchHex(w), onRowClick: (r) => gotoRow(r),
  renderGroupBy: (host) => {
    groupBy = createGroupByView({ host, onRun: runGroupBy, onPick: (conds) => { filterBar.setConditions(conds); searchBar.filterHost.classList.remove('is-hidden'); statusBar.setMessage('그룹 조건을 필터에 적용했습니다. 표·검색·그래프에 반영됩니다.'); } });
    const ds = store.get().ds;
    if (ds) { groupBy.setColumns(ds.header); if (ds.schemaCount >= 4 && /RT_Address/i.test(ds.header[1] || '')) groupBy.preset([1, 2, 3]); }
  },
});
const detailPanel = $('#detail-panel');
const searchBar = createSearchBar({ container: $('#search-bar'), onSearch: runSearch, onClear: clearSearch });
const filterBar = createFilterBar({ container: searchBar.filterHost, onChange: () => { searchBar.rerun(); updateFilterBadge(); exportPanel.refresh(); graphView.setFilter(filterBar.getConditions()); applyTableFilter(); refreshColumnActions(); } });
searchBar.setFilterGetter(() => { const c = filterBar.getConditions(); return c.length ? c : null; });
function updateFilterBadge() {
  const n = filterBar.count;
  const btn = Array.from($('#search-bar').querySelectorAll('button')).find((b) => b.textContent.startsWith('필터'));
  if (btn) { btn.textContent = n ? `필터 ${n} ▾` : '필터 ▾'; btn.classList.toggle('has-filter', n > 0); }
}
function runGroupBy({ cols, useFilter }) {
  const ds = store.get().ds;
  if (!ds || !groupBy) return;
  const id = ++groupSeq;
  const filter = useFilter ? filterBar.getConditions() : [];
  client.request(MSG.GROUP_BY, { id, cols, filter: filter.length ? filter : null }).then((msg) => {
    if (id !== groupSeq) return;
    groupBy.setResult(msg);
    if (!msg.cancelled) { lastGroup = msg; exportPanel.refresh(); }
  }).catch((e) => groupBy.setError(e.message));
}
const results = createResultsView({
  container: $('#results'),
  onPick: (r) => {
    if (r.kind === 'bytes') { showTab('hex'); hexView.showRange(r.offset, r.offset + r.length, 'hit'); const i = r.row >= 0 ? toIdx(r.row) : -1; if (i >= 0) { table.scrollToRow(i); if (r.col >= 0) table.select(i, r.col); } return; }
    gotoRow(r.row, r.colStart); selectCell(r.row, r.colStart);
  },
  requestCells: async (items) => (await client.request(MSG.CELLS, { items })).texts,
  requestLocate: async (offsets) => (await client.request(MSG.LOCATE_MANY, { offsets })).items,
  onColumnPick: (col) => searchBar.setScopeColumn(col),
});
const hexView = createHexView({
  container: $('#view-hex'),
  requestBytes: async (offset, length) => client.request(MSG.BYTES, { offset, length }),
  onGotoCell: (row, col) => { gotoRow(row, col); selectCell(row, col); },
});
const engineMode = $('#engine-mode');
const graphView = createGraphView({
  container: $('#view-graph'),
  // 필터는 그래프 뷰가 들고 있다가 실어 보낸다 (setDataset·setFilter 로 필터 막대와 맞춘다)
  request: (payload) => client.request(MSG.SERIES, payload),
  cancel: (id) => { if (client) client.send(MSG.CANCEL, { id }); },
  onOpenColumn: (col, value) => { showTab('graph'); graphView.focus(col, value); },
  onGotoRow: (row, col) => { gotoRow(row, col); selectCell(row, col); },
  // 「이 값(들)인 행만 표에서」: 필터에 「=」(여럿이면 「여럿 중 하나」) 조건을 더하고 표로 — 그 값이 나온 행과 시각을 차례로 본다
  onFilterValue: (col, values) => {
    const cond = values.length > 1 ? { col, op: 'in', value: joinValues(values) } : { col, op: 'eq', value: values[0] }; // 쉼표가 든 값은 "…" 로
    const conds = filterBar.getConditions();
    if (!conds.some((c) => c.col === col && c.op === cond.op && c.value === cond.value)) {
      if (conds.length >= 4) { statusBar.setMessage('필터 조건은 4개까지입니다 — 필터 막대에서 하나를 지운 뒤 다시 누르세요.', 'error'); return; }
      filterBar.setConditions([...conds, cond]);
    }
    searchBar.filterHost.classList.remove('is-hidden');
    showTab('table');
  },
});
const exportPanel = createExportPanel({
  button: $('#btn-export'), host: $('#export-panel'),
  getContext: () => {
    const ds = store.get().ds, prof = store.get().profile;
    return {
      rowCount: ds ? ds.rowCount : 0, columnCount: ds ? ds.columnCount : 0, header: ds ? ds.header : [],
      profiled: !!prof, hexLike: prof ? prof.hexLike : null,
      filterCount: filterBar.getConditions().length, query: activeQuery, searchHasResults: results.hasResults, group: lastGroup, visibleCols,
    };
  },
  run: async (mode, { visibleOnly = false } = {}) => {
    if (mode === 'group') return buildGroupXlsx(lastGroup, store.get().profile.hexLike);
    const id = 'x' + (++exportSeq);
    activeExport = id;
    try {
      return await client.request(MSG.EXPORT, { id, mode, filter: mode === 'filter' ? filterBar.getConditions() : null, query: mode === 'search' ? activeQuery : null, cols: visibleOnly ? visibleCols : null });
    } finally {
      if (activeExport === id) activeExport = null;
    }
  },
  cancel: () => { if (activeExport && client) client.send(MSG.CANCEL, { id: activeExport }); },
});

// 다른 단계(M3b/M4)에서 채우는 동작 훅
const actions = {
  searchHex(word, col) { searchBar.setPattern('hex', word, { whole: true, column: col == null ? null : col }); },
  searchValue(col, value) {
    const prof = store.get().profile;
    const st = prof && prof.stats[col];
    if (st && st.hexLike && /^(0[xX])?[0-9A-Fa-f: _-]+$/.test(value)) searchBar.setPattern('hex', value, { whole: true, column: col });
    else searchBar.setPattern('text', value, { column: col, textMode: 'whole' });
  },
  hexView(start, end, row, col) { showTab('hex'); hexView.showRange(start, end, 'cell'); statusBar.setMessage(`바이트 ${fmtInt(start)}~${fmtInt(end)}${row != null ? ` · 행 ${fmtInt(row + 1)}` : ''}${col != null && col >= 0 ? ` · ${store.get().ds.header[col]}` : ''}`); },
};

let detailCol = null; // 상세 창에 열 상세가 떠 있으면 그 열
function showDetail(el) {
  detailCol = null;
  clear(detailPanel);
  detailPanel.appendChild(el || h('div', { class: 'detail__empty', text: '표에서 셀을 클릭하거나 프로파일에서 열을 선택하면 상세가 표시됩니다.' }));
}
showDetail(null);

// ---------- 탭 ----------
const tabs = $$('#tabs .tab');
const views = $$('.view');
function showTab(name) {
  for (const t of tabs) t.classList.toggle('is-active', t.dataset.tab === name);
  for (const v of views) v.classList.toggle('is-hidden', v.dataset.view !== name);
  if (name === 'table') table.refresh();
  if (name === 'hex') hexView.refresh();
  if (name === 'graph') graphView.show();
}
for (const tab of tabs) tab.addEventListener('click', () => showTab(tab.dataset.tab));

// ---------- 이동 / 선택 ----------
function gotoRow(row, col) {
  showTab('table');
  const i = toIdx(row);
  if (i < 0) { statusBar.setMessage(`행 ${fmtInt(row + 1)} 은 필터에 가려져 있습니다 — 필터를 지우면 보입니다.`); return; }
  table.scrollToRow(i);
  if (col != null) { table.scrollToCol(col); table.select(i, col); }
}
/** 원래 행의 선택 표시 (필터에 가려진 행이면 표에는 표시하지 않는다) */
function selectInTable(row, col) { const i = toIdx(row); table.select(i >= 0 ? i : null, col); }
async function selectCell(row, col) {
  const ds = store.get().ds;
  if (!ds) return;
  selected = { row, col };
  selectInTable(row, col);
  const myClient = client;
  try {
    const d = await myClient.request(MSG.ROW_DETAIL, { row });
    if (!selected || selected.row !== row || store.get().ds !== ds) return;
    lastDetail = d;
    renderDetail();
  } catch (e) { if (client === myClient && store.get().ds === ds) statusBar.setMessage('행 상세 실패: ' + e.message, 'error'); }
}
function renderDetail() {
  const ds = store.get().ds;
  if (!ds || !lastDetail || !selected) return;
  const prof = store.get().profile;
  showDetail(renderRowDetail(lastDetail, ds, {
    selectedCol: selected.col, stats: prof ? prof.stats : null,
    onSelectCol: (c) => { selected.col = c; selectInTable(selected.row, c); table.scrollToCol(c); renderDetail(); },
    onHexView: (start, end, row, col) => actions.hexView(start, end, row, col),
    widthOverride, onWidthChange: (w) => { widthOverride = w; renderDetail(); },
  }));
}
function showColumnDetail(col) {
  const prof = store.get().profile;
  if (!prof || !prof.stats[col]) { statusBar.setMessage('프로파일이 아직 계산 중입니다.'); return; }
  profileView.setActive(col);
  const el = renderColumnDetail(prof.stats[col], store.get().ds, { onValueClick: (c, v) => actions.searchValue(c, v), onRowClick: (r) => gotoRow(r, col) });
  el.insertBefore(graphView.miniFor(col), el.children[2] || null); // 머리·타입 막대 다음에 시간 그래프
  el.insertBefore(columnActions(col), el.children[2] || null); // 그 위에 「값 있는 행만」·「이 열만 함께 보기」
  showDetail(el);
  detailCol = col;
}
/** 필터·보이는 열이 다른 곳(필터 막대·✕·열 ▾)에서 바뀌면 열 상세의 바로가기 단추도 맞춘다 */
function refreshColumnActions() {
  const old = detailCol != null && store.get().profile ? detailPanel.querySelector('.view-actions') : null;
  if (old) old.replaceWith(columnActions(detailCol));
}
/** 열 상세 바로가기: 이 열이 비지 않은 행만 / 시간 열 + 필터에 쓴 열 + 이 열만 보기 */
function columnActions(col) {
  const prof = store.get().profile;
  const conds = filterBar.getConditions();
  const applied = conds.some((c) => c.col === col && c.op === 'nonempty');
  const onlyBtn = h('button', { class: 'btn btn--sm btn--accent', type: 'button', text: applied ? '값 있는 행만 ✓' : '값 있는 행만', disabled: applied || conds.length >= 4,
    title: conds.length >= 4 && !applied ? '필터 조건은 4개까지입니다' : '이 열이 비지 않은 행만 표·그래프에 남깁니다 (필터에 「값 있음」 조건 추가)' });
  onlyBtn.addEventListener('click', () => {
    filterBar.setConditions([...filterBar.getConditions(), { col, op: 'nonempty' }]);
    searchBar.filterHost.classList.remove('is-hidden');
    showColumnDetail(col);
  });
  const focusBtn = h('button', { class: 'btn btn--sm btn--accent', type: 'button', text: '이 열만 함께 보기', title: '시간 열 + 필터에 쓴 열(RT·송수신 등) + 이 열만 표와 그래프에 보입니다' });
  focusBtn.addEventListener('click', () => {
    setVisibleCols(focusColumns({ col, timeCol: defaultXColumn(prof.stats, prof.hexLike), filter: filterBar.getConditions() }));
    graphView.focus(col); // 그래프 탭을 열면 이 열이 크게
    showColumnDetail(col);
  });
  const box = h('div', { class: 'view-actions' }, onlyBtn, focusBtn);
  if (visibleCols) {
    const all = h('button', { class: 'btn btn--sm', type: 'button', text: '모든 열 보기' });
    all.addEventListener('click', () => { setVisibleCols(null); showColumnDetail(col); });
    box.appendChild(all);
  }
  return box;
}

// ---------- 표 보기: 필터 적용 · 보이는 열 ----------
const viewFilter = $('#view-filter');
const colsBtn = $('#btn-cols');
const colPicker = createColumnPicker({ button: colsBtn, host: $('#cols-panel'), onChange: (cols) => setVisibleCols(cols, false) });
function setVisibleCols(cols, fromOutside = true) {
  const ds = store.get().ds;
  visibleCols = ds ? normalizeVisible(cols, ds.columnCount) : null;
  if (fromOutside) colPicker.setVisible(visibleCols);
  table.setVisibleColumns(visibleCols);
  graphView.setVisibleCols(visibleCols);
  exportPanel.refresh();
  refreshColumnActions();
}
function setTableRows() {
  const ds = store.get().ds;
  if (!ds || !client) return;
  if (rowCache) rowCache.invalidate();
  rowCache = createRowCache(client, { rows: viewRows });
  rowCache.onPage(() => table.refresh());
  const rows = viewRows;
  table.setView({ count: rows ? rows.length : ds.rowCount, getRow: (i) => (rowCache ? rowCache.getRow(i) : undefined), rowOf: rows ? (i) => rows[i] : null });
  if (selected) selectInTable(selected.row, selected.col);
  const vr = table.visibleRange();
  if (vr.last >= vr.first && (rows ? rows.length : ds.rowCount) > 0) minimap.setViewport(toRow(vr.first), toRow(vr.last));
  renderViewPill();
}
function renderViewPill(progress) {
  const ds = store.get().ds;
  clear(viewFilter);
  const busy = viewFilterId != null;
  viewFilter.classList.toggle('is-hidden', !ds || (!viewRows && !busy));
  viewFilter.classList.toggle('is-busy', busy);
  if (!ds) return;
  if (busy) { viewFilter.textContent = progress == null ? '필터 적용 중…' : `필터 적용 중 ${Math.round(progress * 100)}%`; return; }
  if (!viewRows) return;
  const x = h('button', { type: 'button', text: '✕', title: '필터 모두 지우기', 'aria-label': '필터 모두 지우기' });
  x.addEventListener('click', () => filterBar.setConditions([]));
  viewFilter.append(h('span', { text: `필터 ${fmtInt(viewRows.length)} / ${fmtInt(ds.rowCount)}행` }), x);
}
/** 필터를 표에도: 워커가 통과 행 목록을 만들면 표는 그 행만 보여 준다 (프로파일 뒤 — 16진수 열을 알아야 값 비교가 맞다) */
async function applyTableFilter() {
  const ds = store.get().ds;
  if (!ds || !store.get().profile || !client) return;
  const conds = filterBar.getConditions();
  const key = conds.length ? JSON.stringify(conds) : '';
  if (key === appliedFilterKey) return; // 바뀐 게 없으면(같은 조건으로 계산 중이어도) 다시 훑지 않는다 — 스크롤도 그대로
  appliedFilterKey = key;
  if (viewFilterId) { client.send(MSG.CANCEL, { id: viewFilterId }); viewFilterId = null; }
  if (!conds.length) {
    tableHost.classList.remove('is-refreshing');
    if (viewRows) { viewRows = null; setTableRows(); } else renderViewPill();
    return;
  }
  const id = 'f' + (++filterSeq);
  viewFilterId = id;
  tableHost.classList.add('is-refreshing'); // 계산하는 동안 이전 표를 흐리게
  renderViewPill(0);
  try {
    const r = await client.request(MSG.FILTER_ROWS, { id, filter: conds });
    if (viewFilterId !== id) return;
    viewFilterId = null;
    tableHost.classList.remove('is-refreshing');
    if (r.cancelled) { appliedFilterKey = ''; renderViewPill(); return; }
    viewRows = r.rows;
    setTableRows();
  } catch (e) {
    if (viewFilterId !== id) return;
    viewFilterId = null; appliedFilterKey = '';
    tableHost.classList.remove('is-refreshing');
    renderViewPill();
    statusBar.setMessage('필터 적용 실패: ' + e.message, 'error');
  }
}
function onHeaderClick(col) {
  searchBar.setScopeColumn(col);
  const ds = store.get().ds;
  statusBar.setMessage(`검색 범위를 "${ds.header[col]}" 열로 한정했습니다.`);
  if (store.get().profile) showColumnDetail(col);
}

// ---------- 검색 ----------
function runSearch(q) {
  const ds = store.get().ds;
  if (!ds) { searchBar.showError('먼저 CSV 파일을 열거나 내용을 붙여넣으세요.'); return; }
  activeQuery = q;
  results.reset(q, ds.header);
  minimap.clear();
  hexView.clearHits();
  table.setColCounts(null);
  table.setHighlights((i) => results.colsForRow(toRow(i)));
  if (q.kind === 'bytes') showTab('hex');
  client.send(MSG.SEARCH, { query: q });
}
function clearSearch() {
  activeQuery = null;
  if (client) client.send(MSG.CANCEL, { id: 0 });
  results.clear();
  minimap.clear();
  hexView.clearHits();
  table.setColCounts(null);
  table.setHighlights(null);
  exportPanel.refresh();
}

// ---------- 클라이언트 생명주기 ----------
function bootClient() {
  client = createWorkerClient(onEvent, { forceFallback: window.__csvForceFallback === true });
  rowCache = createRowCache(client);
  rowCache.onPage(() => table.refresh());
  client.ready.then(() => { engineMode.textContent = client.isFallback ? '메인 스레드 모드' : '워커 모드'; });
}
function teardown() {
  if (client) client.terminate();
  client = null;
  if (rowCache) rowCache.invalidate();
  rowCache = null;
  selected = null; lastDetail = null; activeQuery = null;
  lastGroup = null; activeExport = null;
  viewRows = null; viewFilterId = null; visibleCols = null; appliedFilterKey = '';
  colPicker.reset(); colsBtn.disabled = true;
  graphView.setVisibleCols(null);
  tableHost.classList.remove('is-refreshing');
  exportPanel.reset();
  graphView.clear();
  table.clear();
  profileView.clear();
  results.clear();
  hexView.clear();
  minimap.setRowCount(0, 0, []);
  showDetail(null);
  statusBar.reset();
  store.reset();
  renderViewPill(); // 파일이 없으니 숨긴다
}
function clearAll() {
  teardown();
  currentBlob = null;
  inputPanel.clear();
  searchBar.clear();
  filterBar.clear();
  updateFilterBadge();
  bootClient();
  statusBar.setMessage('모두 지웠습니다. 데이터는 메모리에서 해제되었습니다.');
}
$('#btn-clear-all').addEventListener('click', clearAll);

async function onOpen(blob, options) {
  const seq = ++openSeq;
  if (store.get().ds) prevHeader = store.get().ds.header;
  teardown();
  bootClient();
  currentBlob = blob;
  statusBar.setProgress('열기', null);
  statusBar.setMessage('');
  try {
    const opened = await client.request(MSG.OPEN, { blob, options });
    if (seq !== openSeq) return;
    inputPanel.setDetected(opened);
  } catch (e) {
    if (seq !== openSeq) return;
    statusBar.setProgress(null);
    statusBar.setMessage('열기 실패: ' + e.message, 'error');
  }
}
function onReopen(options) { if (currentBlob) onOpen(currentBlob, options); }

function onEvent(msg) {
  const ds = store.get().ds;
  switch (msg.type) {
    case MSG.INDEX_PROGRESS:
      statusBar.setProgress('인덱싱', msg.total ? msg.done / msg.total : null);
      statusBar.setInfo([fmtInt(msg.records) + '행 발견']);
      break;
    case MSG.INDEXED:
      onIndexed(msg);
      break;
    case MSG.PROFILE_PROGRESS:
      statusBar.setProgress('프로파일', msg.total ? msg.done / msg.total : null);
      profileView.setProgress(msg.total ? msg.done / msg.total : 0);
      break;
    case MSG.PROFILED:
      statusBar.setProgress(null);
      store.set({ profile: msg });
      profileView.setProfile(msg);
      if (ds) searchBar.setColumns(ds.header, msg.hexLike);
      if (lastDetail && selected) renderDetail();
      statusBar.setMessage('프로파일 완료');
      exportPanel.setReady(true);
      if (ds) graphView.setDataset(ds, msg, filterBar.getConditions());
      applyTableFilter(); // 다시 연 파일에 필터 조건이 남아 있으면 표에도
      break;
    case MSG.SERIES_PROGRESS:
      graphView.setProgress(msg);
      break;
    case MSG.FILTER_PROGRESS:
      if (msg.id === viewFilterId) renderViewPill(msg.total ? msg.done / msg.total : 0);
      break;
    case MSG.SEARCH_BATCH:
      if (!activeQuery || msg.id !== activeQuery.id || !ds) break;
      results.append(msg);
      if (msg.kind === 'bytes') {
        hexView.setHits(results.hits);
        hexView.setHist(msg.byteHist);
        minimap.setData({ rowCount: msg.rowCount, rowHist: msg.rowHist, rowColHist: null, cols: ds.columnCount, header: ds.header });
        break;
      }
      minimap.setData({ rowCount: msg.rowCount, rowHist: msg.rowHist, rowColHist: msg.rowColHist, cols: ds.columnCount, header: ds.header });
      table.setColCounts(msg.colCounts);
      table.refresh();
      break;
    case MSG.SEARCH_PROGRESS:
      results.setProgress(msg);
      break;
    case MSG.SEARCH_DONE:
      results.done(msg);
      exportPanel.refresh();
      break;
    case MSG.EXPORT_PROGRESS:
      if (msg.id === activeExport) exportPanel.setProgress(msg.total ? msg.done / msg.total : 0, msg.rows);
      break;
    case MSG.GROUP_BY_PROGRESS:
      if (groupBy && msg.id === groupSeq) groupBy.setProgress(msg);
      break;
    case MSG.SEARCH_ERROR:
      results.setError(msg);
      if (activeQuery && msg.id === activeQuery.id) searchBar.showError(msg.message);
      break;
    case MSG.ERROR:
      statusBar.setMessage(msg.message || '오류', 'error');
      break;
    default:
      break;
  }
}

async function onIndexed(ds) {
  store.set({ ds, profile: null });
  statusBar.setProgress(null);
  statusBar.setInfo([
    fmtInt(ds.rowCount) + '행', ds.extraCount ? `${ds.schemaCount}열 (+${ds.extraCount})` : `${ds.schemaCount}열`,
    fmtBytes(ds.size), encodingLabel(ds.encoding), delimLabel(ds.delimiter),
    ds.overflowTotal ? `초과 필드 행 ${fmtInt(ds.overflowTotal)}` : '',
  ]);
  inputPanel.setSummary(ds, currentBlob);
  profileView.setDataset(ds);
  searchBar.setColumns(ds.header, null);
  // 남은 필터: 조건에 쓴 열이 같은 자리·같은 이름이면(같은 형식의 로그를 차례로) 이어 쓰고, 아니면 지운다 — 엉뚱한 열로 표가 비지 않게
  const kept = filterBar.getConditions();
  if (kept.length && prevHeader && kept.some((c) => prevHeader[c.col] !== ds.header[c.col])) {
    filterBar.clear();
    updateFilterBadge();
    statusBar.setMessage('열 구성이 다른 파일이라 이전 필터를 지웠습니다.');
  }
  prevHeader = null;
  filterBar.setColumns(ds.header);
  colPicker.setColumns(ds.header);
  minimap.setRowCount(ds.rowCount, ds.columnCount, ds.header);
  hexView.setDataset(ds);
  statusBar.setProgress('프로파일', 0);
  let sample;
  try { sample = await client.request(MSG.ROWS, { from: 0, to: Math.min(ds.rowCount, 60) }); } catch { return; } // 파일 전환 중이면 조용히 중단
  if (store.get().ds !== ds) return;
  table.setDataset({
    header: ds.header, columnCount: ds.columnCount, schemaCount: ds.schemaCount, rowCount: ds.rowCount,
    getRow: (r) => (rowCache ? rowCache.getRow(r) : undefined), sampleRows: sample.rows, visible: visibleCols,
  });
  colsBtn.disabled = false;
  if (viewRows) setTableRows(); // 표본을 기다리는 사이 필터 결과가 먼저 왔으면 그 행으로
  showTab('table');
  searchBar.rerun();
}

// ---------- 전역 단축키 / 드롭 ----------
window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); searchBar.focus(); return; }
  if (e.key === 'F3') { e.preventDefault(); results.step(e.shiftKey ? -1 : 1); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); searchBar.focus(); }
});
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && !(e.target.closest && e.target.closest('.drop'))) onOpen(f, inputPanel.options);
});

bootClient();
return {  };
})();
</script>
