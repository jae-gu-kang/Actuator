  const root = h('div', { class: 'table' }, head, bodyWrap, empty);
  container.appendChild(root);

  let ds = null, widths = [], totalWidth = 0, getRow = () => undefined, rowOf = (i) => i;
  let highlightFn = null, selected = null, headCells = [], vis = [], visKey = '', colCounts = null;

  const vl = createVirtualList({ container: bodyWrap, rowHeight: ROW_H, render: renderRow, onRangeChange });
  bodyWrap.addEventListener('scroll', () => { head.scrollLeft = bodyWrap.scrollLeft; });
  bodyWrap.addEventListener('click', (e) => {

    if (Number.isNaN(row) || col < 0) return;

  });
  head.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');

    const col = Number(cell.dataset.col);

  });

  function computeWidths(header, sampleRows, cols) {
    const w = new Array(cols);
    for (let c = 0; c < cols; c++) {
      let m = (header[c] || '').length;
      for (const r of sampleRows) { const v = r[c]; if (v != null && v.length > m) m = Math.min(v.length, 60); }
      w[c] = Math.max(MIN_W, Math.min(MAX_W, Math.round(m * 7.4 + 18)));

  }

  function buildCells(el) {

      el.appendChild(cell);
    }
    el.dataset.cols = visKey;
  }

  function renderRow(idx, el) {

    const row = getRow(idx);
    const hl = highlightFn ? highlightFn(idx) : null;
    const children = el.children;
    children[0].textContent = String(rowOf(idx) + 1);

    for (let j = 0; j < vis.length; j++) {
      const c = vis[j];
      const cell = children[j + 1];
      const v = row ? row[c] : undefined;
      let cls = 'cell';
      if (c >= ds.schemaCount) cls += ' col--extra';
      if (row && v === undefined) cls += ' cell--missing';
      if (hl && hl.has(c)) cls += ' cell--hl';
      if (selected && selected.row === idx && selected.col === c) cls += ' cell--sel';
      if (cell.className !== cls) cell.className = cls;
      const text = row ? (v === undefined ? '' : displayText(v)) : '…';
      if (cell.textContent !== text) cell.textContent = text;
      if (v !== undefined && v.length > 20) cell.title = v;
      else if (cell.hasAttribute('title')) cell.removeAttribute('title');
    }
  }

  function buildHead() {
    clear(headInner);
    headCells = [];
    const idx = h('div', { class: 'cell cell--idx', text: '#', dataset: { col: -1 } });
    idx.style.width = IDX_W + 'px';
    headInner.appendChild(idx);
    for (const c of vis) {
      const bar = h('div', { class: 'bar' });
      bar.style.display = 'none';
      const cell = h('div', { class: 'cell' + (c >= ds.schemaCount ? ' col--extra' : ''), dataset: { col: c }, title: ds.header[c] },
        h('span', { class: 'name', text: ds.header[c] }), bar);

      visKey = vis.join(',');

})();

// ===== src/main/format.js =====
const M_main_format = (() => {
function fmtInt(n) {
  return Number(n).toLocaleString('ko-KR');
}
function fmtBytes(n) {
  if (n < 1024) return fmtInt(n) + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  let v = n;
  do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + ' ' + units[i];
}
function fmtNum(x, digits = 4) {
  if (x == null || Number.isNaN(x)) return '-';
  if (Number.isInteger(x) && Math.abs(x) < 1e15) return fmtInt(x);
  const a = Math.abs(x);
  if (a !== 0 && (a < 1e-4 || a >= 1e15)) return x.toExponential(3);
  return Number(x.toFixed(digits)).toLocaleString('ko-KR', { maximumFractionDigits: digits });
}
function fmtPct(frac, digits = 1) {
  if (frac == null || Number.isNaN(frac)) return '-';
  return (frac * 100).toFixed(digits) + '%';
}
function hex2(b) { return b.toString(16).toUpperCase().padStart(2, '0'); }
function hexOffset(n) { return n.toString(16).toUpperCase().padStart(8, '0'); }
function fmtDuration(ms) { return ms < 1000 ? Math.round(ms) + 'ms' : (ms / 1000).toFixed(1) + 's'; }
return { fmtInt, fmtBytes, fmtNum, fmtPct, hex2, hexOffset, fmtDuration };
})();

  const fileInput = h('input', { type: 'file', class: 'is-hidden', accept: '.csv,.tsv,.txt,text/csv,text/plain' });
  const drop = h('div', { class: 'drop' },
    h('div', {}, h('strong', { text: 'CSV 파일 놓기' })),
    h('div', { class: 'faint', text: '또는 클릭해서 선택 · 파일은 이 탭 메모리에만 머뭅니다' }));
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('is-over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openBlob(f);
  });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (f) openBlob(f);
  });

  const ta = h('textarea', { class: 'textarea', rows: 5, placeholder: 'CSV 내용을 여기에 붙여넣기', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off' });
  const pasteBtn = h('button', { class: 'btn btn--primary btn--sm', type: 'button', text: '붙여넣은 내용 불러오기' });
  const pasteNote = h('div', { class: 'faint paste-note' });
  function openPasted(t) {
    const blob = new Blob([t], { type: 'text/csv' });
    blob.name = '(붙여넣은 내용)';
    openBlob(blob);
  }
  pasteBtn.addEventListener('click', () => {
    const t = ta.value;
    if (!t.trim()) return;
    ta.value = ''; // 원본 문자열을 즉시 놓는다
    pasteNote.textContent = '';
    openPasted(t);
  });
  // 큰 내용은 입력란에 넣지 않고 바로 연다. 수십 MB 를 입력란에 넣으면 브라우저가 글자 배치를 계산하느라
  // 몇 분씩 멈춰 「페이지 응답 없음」이 뜬다 (30MB 에서 3분 넘게 멈춤을 확인). 작은 내용은 평소처럼 입력란에서 고칠 수 있게.
  ta.addEventListener('paste', (e) => {
    const t = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    if (t.length < PASTE_DIRECT_CHARS || !t.trim()) return;
    e.preventDefault();
    pasteNote.textContent = `붙여넣은 내용(${fmtBytes(t.length)})이 커서 입력란에 넣지 않고 바로 불러왔습니다.`;
    openPasted(t);
  });

  const encSel = select([['auto', '자동 감지'], ['utf-8', 'UTF-8'], ['euc-kr', 'EUC-KR (CP949)'], ['utf-16le', 'UTF-16 LE'], ['utf-16be', 'UTF-16 BE'], ['windows-1252', 'Windows-1252']], 'auto');
  const delSel = select([['auto', '자동 감지'], [',', '쉼표 ,'], ['\t', '탭'], [';', '세미콜론 ;'], ['|', '파이프 |']], 'auto');
  const hdrSel = select([['auto', '자동 감지'], ['true', '첫 행이 헤더'], ['false', '헤더 없음']], 'auto');
  const detected = h('div', { class: 'faint', text: '' });
  for (const s of [encSel, delSel, hdrSel]) s.addEventListener('change', () => { if (current) onReopen(options()); });

  const summary = h('dl', { class: 'summary' });
  const summaryTitle = h('div', { class: 'panel-title', text: '요약' });

  container.appendChild(h('div', { class: 'panel-title', text: '입력' }));
  container.appendChild(drop);
  container.appendChild(fileInput);
  container.appendChild(h('div', { class: 'field', style: { marginTop: '8px' } }, ta, h('div', { class: 'row' }, pasteBtn), pasteNote));
  container.appendChild(h('div', { class: 'panel-title', text: '옵션' }));
  container.appendChild(h('div', { class: 'field' }, h('label', { text: '인코딩' }), encSel));
  container.appendChild(h('div', { class: 'field' }, h('label', { text: '구분자' }), delSel));
  container.appendChild(h('div', { class: 'field' }, h('label', { text: '헤더' }), hdrSel));
  container.appendChild(detected);
  container.appendChild(summaryTitle);
  container.appendChild(summary);

  function options() {
    const hv = hdrSel.value;
    return { encoding: encSel.value, delimiter: delSel.value, hasHeader: hv === 'auto' ? 'auto' : hv === 'true' };
  }
  function openBlob(blob) { current = blob; onOpen(blob, options()); }
  function dd(k, v, cls) { return [h('dt', { text: k }), h('dd', { text: v, class: cls })]; }

  return {
    get options() { return options(); },
    setDetected(o) {
      const parts = [];
      if (o.detected) parts.push(`감지: ${encodingLabel(o.detected.encoding)} · ${delimLabel(o.detected.delimiter)} · ${o.detected.hasHeader ? '헤더 있음' : '헤더 없음'}`);
      detected.textContent = parts.join(' ');
    },
    setSummary(info, blob) {
      clear(summary);
      if (!info) return;
      const name = blob && blob.name ? blob.name : '(이름 없음)';
      summary.append(
        ...dd('파일', name),
        ...dd('크기', fmtBytes(info.size)),
        ...dd('행', fmtInt(info.rowCount)),
        ...dd('열', info.extraCount ? `${fmtInt(info.schemaCount)} + ${info.extraCount}` : fmtInt(info.schemaCount)),
        ...dd('인코딩', encodingLabel(info.encoding) + (info.bomLength ? ' (BOM)' : '')),
        ...dd('구분자', delimLabel(info.delimiter)),
        ...dd('헤더', info.hasHeader ? '있음' : '없음'),
      );
      if (info.overflowTotal) summary.append(...dd('초과 필드 행', fmtInt(info.overflowTotal) + '건', 'warn'));
    },
    clear() { current = null; clear(summary); detected.textContent = ''; pasteNote.textContent = ''; },
  };
}
return { createInputPanel };
})();

const M_main_ui_status_bar = (() => {

function createStatusBar(container) {

// ===== src/main/ui/charts.js =====
const M_main_ui_charts = (() => {
const { h } = M_main_ui_dom;
const { fmtInt, fmtNum } = M_main_format;
// 캔버스 차트 헬퍼. 색은 CSS 토큰에서 읽는다 (라이트/다크 모두 선택된 값).



function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function setupCanvas(canvas, w, h2) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h2 * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h2);
  return ctx;
}

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex.trim());
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128];
}
/** 순차 램프 (한 색상, 밝음→어두움; 다크 모드에서는 표면→밝음). t∈[0,1] */
function seqColor(t) {
  const stops = [cssVar('--viz-seq-lo'), cssVar('--viz-seq-mid'), cssVar('--viz-seq-hi')].map(hexToRgb);
  t = Math.max(0, Math.min(1, t));
  const x = t * 2, i = Math.min(1, Math.floor(x)), f = x - i;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
}

function roundTopRect(ctx, x, y, w, hh, r) {
  r = Math.min(r, w / 2, hh);
  ctx.beginPath();
  ctx.moveTo(x, y + hh);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + hh);
  ctx.closePath();
  ctx.fill();
}

/**
 * 기준선에서 자라는 세로 막대. counts: 배열, 2px 표면 간격, 4px 둥근 데이터 끝, 막대 두께 ≤ 24px.
 * 반환: 막대 x 범위 (hover 용).
 */
function drawColumns(ctx, counts, { x0, y0, width, height, color, gap = 2, maxBarW = 24, radius = 4, baseline = true, highlight = -1, highlightColor }) {
  const n = counts.length;
  if (!n) return [];
  let max = 0;
  for (let i = 0; i < n; i++) if (counts[i] > max) max = counts[i];
  const slot = width / n;
  const barW = Math.max(1, Math.min(maxBarW, slot - gap));
  const pad = (slot - barW) / 2;
  const rects = [];
  if (baseline) {
    ctx.strokeStyle = cssVar('--viz-axis');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + height + 0.5); ctx.lineTo(x0 + width, y0 + height + 0.5); ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const v = counts[i];
    const x = x0 + i * slot + pad;
    const hh = max ? Math.max(v > 0 ? 1 : 0, (v / max) * height) : 0;
    rects.push([x, x + barW]);
    if (!hh) continue;
    ctx.fillStyle = i === highlight && highlightColor ? highlightColor : color;
    roundTopRect(ctx, x, y0 + height - hh, barW, hh, radius);
  }
  return rects;
}

/** 작은 스파크라인 히스토그램 (카드). hover 시 title 로 범위/건수 */
function sparkline(canvas, hist, { width = 200, height = 32 } = {}) {
  const ctx = setupCanvas(canvas, width, height);
  const rects = drawColumns(ctx, Array.from(hist.counts), { x0: 0, y0: 2, width, height: height - 4, color: cssVar('--viz-seq-hi'), gap: 2, radius: 2, baseline: true });
  canvas.onmousemove = (e) => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (width / r.width);
    const i = rects.findIndex(([a, b]) => x >= a - 1 && x <= b + 1);
    canvas.title = i >= 0 ? `${fmtNum(hist.edges[i])} ~ ${fmtNum(hist.edges[i + 1])}: ${fmtInt(hist.counts[i])}건` : '';
  };
}

/**
 * 히스토그램 + 축 라벨 + hover 툴팁. wrapper 에 canvas 와 tooltip 을 넣는다.
 * labelFor(i) → 툴팁 텍스트, axisLabels: [left, right]
 */
function histogramChart(wrapper, counts, { height = 160, labelFor, axisLabels = [], color, highlight = -1 }) {
  wrapper.classList.add('chart');
  const canvas = h('canvas', { class: 'hist' });
  const tip = h('div', { class: 'chart__tip is-hidden' });
  wrapper.replaceChildren(canvas, tip);
  const draw = () => {
    const width = Math.max(120, wrapper.clientWidth || 300);
    const ctx = setupCanvas(canvas, width, height);
    canvas.style.height = height + 'px';
    const padB = axisLabels.length ? 16 : 4;
    const rects = drawColumns(ctx, counts, { x0: 0, y0: 4, width, height: height - padB - 4, color: color || cssVar('--viz-seq-hi'), highlight, highlightColor: cssVar('--viz-2') });
    if (axisLabels.length) {
      ctx.fillStyle = cssVar('--fg-muted');
      ctx.font = '11px ' + cssVar('--sans');
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'left'; ctx.fillText(String(axisLabels[0]), 0, height);
      ctx.textAlign = 'right'; ctx.fillText(String(axisLabels[1]), width, height);
    }
    canvas.onmousemove = (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * (width / r.width);
      const i = rects.findIndex(([a, b]) => x >= a - 2 && x <= b + 2);
      if (i < 0 || !labelFor) { tip.classList.add('is-hidden'); return; }
      tip.textContent = labelFor(i);
      tip.classList.remove('is-hidden');
      const tx = Math.min(Math.max(0, x - 40), width - tip.offsetWidth);
      tip.style.left = tx + 'px';
    };
    canvas.onmouseleave = () => tip.classList.add('is-hidden');
  };
  draw();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(draw).observe(wrapper);
  return { canvas, redraw: draw };
}
return { cssVar, setupCanvas, seqColor, drawColumns, sparkline, histogramChart };
})();

const M_main_ui_profile = (() => {
const { h, clear } = M_main_ui_dom;
const { fmtInt, fmtBytes, fmtNum, fmtPct } = M_main_format;
const { TYPE_LABEL, encodingLabel, delimLabel } = M_main_i18n;
const { histogram } = M_shared_profiler;
const { sparkline, histogramChart } = M_main_ui_charts;
// 프로파일 탭: 요약 카드, 전체 워드 빈도, 열 카드 그리드.






const TYPE_ORDER = ['int', 'float', 'hex', 'bool', 'date', 'text'];

function typeBadge(st) {
  if (!st || st.count === 0) return h('span', { class: 'badge', text: TYPE_LABEL.empty });
  if (st.hexLike) return h('span', { class: 'badge badge--hex', text: `${TYPE_LABEL.hex} · ${st.widthBits}bit` });
  if (st.mixed) return h('span', { class: 'badge badge--warn', text: `${TYPE_LABEL.mixed} (${TYPE_LABEL[st.dominant]} ${fmtPct(st.dominantShare, 0)})` });
  return h('span', { class: 'badge', text: TYPE_LABEL[st.dominant] });
}

/** 타입 분포 스택 막대 (2px 표면 간격) */
function typeBar(st) {
  const bar = h('div', { class: 'typebar', title: typeTitle(st) });
  const total = st.count || 1;
  TYPE_ORDER.forEach((name, i) => {
    const n = st.types[i];
    if (!n) return;
    const seg = h('span', { class: 't-' + name });
    seg.style.flexBasis = (n / total * 100) + '%';
    bar.appendChild(seg);
  });
  if (!st.count) bar.appendChild(h('span', { class: 't-empty', style: { flexBasis: '100%' } }));
  return bar;
}
function typeTitle(st) {
  const parts = TYPE_ORDER.map((name, i) => st.types[i] ? `${TYPE_LABEL[name]} ${fmtInt(st.types[i])}` : null).filter(Boolean);
  if (st.empty) parts.push(`빈 값 ${fmtInt(st.empty)}`);
  if (st.missing) parts.push(`없음 ${fmtInt(st.missing)}`);
  return parts.join(' · ');
}

function typeLegend() {
  return h('div', { class: 'legend' }, TYPE_ORDER.map((name) => h('span', { class: 'legend__item' }, h('i', { class: 'swatch t-' + name }), TYPE_LABEL[name])), h('span', { class: 'legend__item faint', text: '열 카드의 막대는 타입 비율, 클릭하면 상세' }));
}

function tile(label, value, cls) {
  return h('div', { class: 'tile' + (cls ? ' ' + cls : '') }, h('div', { class: 'tile__label', text: label }), h('div', { class: 'tile__value', text: value }));
}

function createProfileView({ container, onColumnClick, onWordClick, onRowClick, renderGroupBy }) {
  const root = h('div', { class: 'profile' });
  container.appendChild(root);
  let ds = null, prof = null, activeCol = -1;
  const cardEls = new Map();

  function renderPending(frac) {
    clear(root);
    if (!ds) { root.appendChild(h('div', { class: 'muted', text: '데이터를 열면 프로파일이 계산됩니다.' })); return; }
    root.appendChild(h('div', { class: 'card card--wide' },
      h('div', { class: 'card__title' }, h('span', { text: '프로파일 계산 중…' })),
      h('div', { class: 'progress', style: { width: '100%' } }, h('div', { style: { width: Math.round((frac || 0) * 100) + '%' } }))));
  }

  function renderSummary() {
    const hist = Array.from(prof.fieldCountHist);
    let minK = hist.findIndex((v) => v > 0); if (minK < 0) minK = 0;
    const maxK = hist.length - 1;
    const tiles = h('div', { class: 'tiles' },
      tile('행', fmtInt(ds.rowCount)),
      tile('열', ds.extraCount ? `${ds.schemaCount} + ${ds.extraCount}` : String(ds.schemaCount)),
      tile('크기', fmtBytes(ds.size)),
      tile('인코딩', encodingLabel(ds.encoding)),
      tile('구분자', delimLabel(ds.delimiter)),
      tile('헤더', ds.hasHeader ? '있음' : '없음'),
      tile('초과 필드 행', fmtInt(ds.overflowTotal), ds.overflowTotal ? 'tile--warn' : ''),
    );
    const fcWrap = h('div', { class: 'fc-hist' });
    const card = h('div', { class: 'card card--wide' },
      h('div', { class: 'card__title' }, h('span', { text: '데이터셋 요약' }), h('span', { class: 'faint', text: '파일 전체 기준 — 필터와 무관' })),
      tiles,
      h('div', { class: 'row', style: { marginTop: '8px', alignItems: 'flex-start', gap: '16px' } },
        h('div', { style: { flex: '1', minWidth: '0' } },
          h('div', { class: 'muted', style: { fontSize: '11px', marginBottom: '2px' }, text: `행 길이(필드 수) 분포 — 헤더 ${ds.schemaCount}열 기준, 적은 행은 정상` }),
          fcWrap),
        ds.overflowTotal ? h('div', { style: { flex: '0 0 220px' } },
          h('div', { class: 'muted', style: { fontSize: '11px', marginBottom: '2px' }, text: `초과 필드 행 (앞 ${Math.min(20, ds.overflowRows.length)}건, 클릭 → 표)` }),
          h('div', { class: 'chips' }, Array.from(ds.overflowRows).slice(0, 20).map((r) => h('span', { class: 'chip', text: fmtInt(r + 1), onClick: () => onRowClick && onRowClick(r) })))) : null,
      ));
    root.appendChild(card);
    const counts = hist.slice(minK, maxK + 1);
    histogramChart(fcWrap, counts, {
      height: 70, axisLabels: [`${minK}개`, `${maxK}개`],
      labelFor: (i) => `필드 ${minK + i}개: ${fmtInt(counts[i])}행`,
      highlight: ds.schemaCount - minK,
    });
  }

  function renderWords() {
    if (!prof.wordTop || !prof.wordTop.length) return;
    root.appendChild(h('div', { class: 'card card--wide' },
      h('div', { class: 'card__title' }, h('span', { text: '전체 워드 빈도 (16진수 열 통합, 상위 50)' }), h('span', { class: 'faint', text: '클릭 → 헥사 검색' })),
      h('div', { class: 'chips' }, prof.wordTop.map((w) => h('span', { class: 'chip', title: `${fmtInt(w.count)}회`, onClick: () => onWordClick && onWordClick(w.value) }, w.value, h('span', { class: 'faint', text: ' ' + fmtInt(w.count) }))))));
  }

  function statRow(label, value) { return [h('span', { text: label }), h('b', { text: value })]; }

  function renderCards() {
    root.appendChild(typeLegend());
    const grid = h('div', { class: 'cards' });
    cardEls.clear();
    prof.stats.forEach((st, c) => {
      const stats = [];
      stats.push(...statRow('채움률', fmtPct(st.fillRate)));
      stats.push(...statRow('고유값', st.distinctExact ? fmtInt(st.distinct) : fmtInt(st.distinct) + '+ (근사)'));
      if (st.numCount) {
        const isHex = st.hexLike;
        const f = (v) => (isHex ? '0x' + Math.round(v).toString(16).toUpperCase().padStart(st.hexNibblesMax || 1, '0') : fmtNum(v));
        stats.push(...statRow('범위', `${f(st.numMin)} ~ ${f(st.numMax)}`));
        if (!isHex) stats.push(...statRow('평균', fmtNum(st.numMean)));
      } else if (st.count) {
        stats.push(...statRow('길이', `${st.lenMin} ~ ${st.lenMax}`));
      }
      if (st.top && st.top.length) stats.push(...statRow('최빈', `${st.top[0][0]} ×${fmtInt(st.top[0][1])}`));
      const card = h('div', { class: 'card is-clickable' + (c >= ds.schemaCount ? ' card--extra' : ''), dataset: { col: c } },
        h('div', { class: 'card__title' }, h('span', { class: 'name', text: st.name, title: st.name }), typeBadge(st)),
        typeBar(st),
        h('div', { class: 'card__stats' }, stats));
      if (st.numCount > 1 && st.sample && st.sample.length > 1) {
        const canvas = h('canvas', { class: 'spark' });
        card.appendChild(canvas);
        requestAnimationFrame(() => sparkline(canvas, histogram(st.sample, st.sample.length, 20), { width: canvas.clientWidth || 200, height: 32 }));
      }
      card.addEventListener('click', () => { setActive(c); onColumnClick && onColumnClick(c); });
      cardEls.set(c, card);
      grid.appendChild(card);
    });

const M_main_ui_search_bar = (() => {
const { h, segmented, select } = M_main_ui_dom;
const { decimalToBytes, bytesToHexString } = M_shared_hex;
// 검색 바: 모드(텍스트/헥사/숫자/바이트), 옵션, 열 범위, 10진→바이트 헬퍼.



function createSearchBar({ container, onSearch, onClear }) {
  let columns = [];      // header

  let seq = 0;
  let timer = 0;
  let spanTouched = false;
  let getFilter = () => null;

  const input = h('input', { class: 'input', type: 'text', placeholder: '검색어 — 예: 0xCE12, CB9F D892, CE??, 255, 텍스트', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off' });
  const btnSearch = h('button', { class: 'btn btn--primary', type: 'button', text: '검색' });

  const btnFilter = h('button', { class: 'btn', type: 'button', text: '필터 ▾', title: '행 필터 조건 (최대 4개, AND)' });
  const mode = segmented([['text', '텍스트'], ['hex', '헥사'], ['numeric', '숫자'], ['bytes', '바이트(원본)']], 'hex', () => { updateOptionRows(); trigger(0); });

  // 공통: 열 범위
  const scopeSel = h('select', { class: 'select', title: '검색할 열' });
  // 텍스트 옵션
  const textMode = segmented([['contains', '포함'], ['whole', '전체 일치'], ['regex', '정규식']], 'contains', () => trigger(0));
  const caseChk = h('input', { type: 'checkbox' });
  // 헥사 옵션
  const spanSeg = segmented([['cell', '셀 내'], ['row', '행 내 연속']], 'cell', () => { spanTouched = true; trigger(0); });
  const alignSeg = segmented([['cell', '셀 시작'], ['byte', '바이트'], ['nibble', '니블']], 'cell', () => trigger(0));
  const wholeChk = h('input', { type: 'checkbox', checked: true });
  // 숫자 옵션
  const qHexChk = h('input', { type: 'checkbox' });
  const bareSel = select([['auto', '16진수 열에서만'], ['always', '항상'], ['never', '안 함']], 'auto');
  // 바이트 옵션: 10진→바이트
  const decIn = h('input', { class: 'input', type: 'text', placeholder: '10진수 값', spellcheck: 'false', autocomplete: 'off', style: { width: '110px' } });
  const widthSel = select([['1', '1바이트'], ['2', '2바이트'], ['4', '4바이트'], ['8', '8바이트']], '2');
  const endianSel = select([['be', '빅 엔디안'], ['le', '리틀 엔디안']], 'be');
  const fillBtn = h('button', { class: 'btn btn--sm', type: 'button', text: '니들에 채우기' });
  const errEl = h('div', { class: 'search__error is-hidden' });
  const filterHost = h('div', { class: 'filter is-hidden' });

  const rowText = h('div', { class: 'search__opts' }, textMode.el, h('label', { class: 'check' }, caseChk, '대소문자 구분'));
  const rowHex = h('div', { class: 'search__opts' },
    h('span', { text: '범위' }), spanSeg.el, h('span', { text: '정렬' }), alignSeg.el,
    h('label', { class: 'check' }, wholeChk, '전체 일치'),
    h('span', { class: 'faint', text: '· 0x·구분자 무시, ? = 임의 니블, 공백으로 나누면 연속 셀' }));
  const rowNum = h('div', { class: 'search__opts' },
    h('label', { class: 'check' }, qHexChk, '검색어를 16진수로'),
    h('span', { text: '0x 없는 값을 16진수로 해석:' }), bareSel,
    h('span', { class: 'faint', text: '· 255 ↔ 0xFF ↔ 0x00FF 수치 동치' }));
  const rowBytes = h('div', { class: 'search__opts' },
    h('span', { text: '10진→바이트' }), decIn, widthSel, endianSel, fillBtn,
    h('span', { class: 'faint', text: '· 니들 예: 4D 5A ?? 00 (?? = 임의 바이트)' }));
  const rowScope = h('div', { class: 'search__opts' }, h('span', { text: '열 범위' }), scopeSel, btnFilter);

  container.appendChild(h('div', { class: 'search__main' }, mode.el, input, btnSearch, btnClear));
  container.appendChild(h('div', { class: 'search__rows' }, rowText, rowHex, rowNum, rowBytes, rowScope));
  container.appendChild(filterHost);
  container.appendChild(errEl);

  function updateOptionRows() {
    const m = mode.value;
    rowText.classList.toggle('is-hidden', m !== 'text');
    rowHex.classList.toggle('is-hidden', m !== 'hex');
    rowNum.classList.toggle('is-hidden', m !== 'numeric');
    rowBytes.classList.toggle('is-hidden', m !== 'bytes');
    scopeSel.disabled = m === 'bytes';
  }
  function rebuildScope(keep) {
    const prev = keep ? scopeSel.value : 'all';
    scopeSel.replaceChildren();
    scopeSel.appendChild(h('option', { value: 'all', text: '전체 열' }));
    if (hexLike && Array.from(hexLike).some(Boolean)) scopeSel.appendChild(h('option', { value: 'hex', text: '16진수 열만' }));
    columns.forEach((name, i) => scopeSel.appendChild(h('option', { value: String(i), text: `${name}` })));
    scopeSel.value = Array.from(scopeSel.options).some((o) => o.value === prev) ? prev : 'all';
  }
  function scopeColumns() {
    const v = scopeSel.value;
    if (v === 'all') return null;
    if (v === 'hex') { const arr = []; hexLike && hexLike.forEach((f, i) => f && arr.push(i)); return arr.length ? Uint16Array.from(arr) : null; }
    const c = Number(v);
    return Number.isNaN(c) ? null : Uint16Array.from([c]);
  }
  function autoSpan() {
    if (spanTouched) return;
    const multi = input.value.trim().split(/\s+/).filter(Boolean).length > 1;
    spanSeg.set(multi ? 'row' : 'cell');
  }
  function buildQuery() {
    const pattern = input.value.trim();
    if (!pattern) return null;
    const kind = mode.value;
    if (kind === 'hex') autoSpan();
    return {
      id: ++seq, kind, pattern,
      columns: kind === 'bytes' ? null : scopeColumns(),
      filter: getFilter(),
      text: { mode: textMode.value, caseSensitive: caseChk.checked },
      hex: { span: spanSeg.value, align: alignSeg.value, whole: wholeChk.checked, padToColumnWidth: true },
      numeric: { queryIsHex: qHexChk.checked, treatBareHex: bareSel.value },
      bytes: {},
    };
  }
  function run() {
    clearTimeout(timer); timer = 0;
    errEl.classList.add('is-hidden');
    const q = buildQuery();
    if (!q) { onClear && onClear(); return; }
    onSearch(q);
  }
  function trigger(delay = 350) {
    clearTimeout(timer);
    if (!input.value.trim()) { timer = 0; onClear && onClear(); return; }
    timer = setTimeout(run, delay);
  }

  input.addEventListener('input', () => { if (mode.value === 'hex') autoSpan(); trigger(350); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); run(); } if (e.key === 'Escape') { input.value = ''; onClear && onClear(); } });
  btnSearch.addEventListener('click', run);
  btnClear.addEventListener('click', () => { input.value = ''; errEl.classList.add('is-hidden'); onClear && onClear(); });
  for (const el of [caseChk, wholeChk, qHexChk, bareSel, scopeSel]) el.addEventListener('change', () => trigger(0));
  btnFilter.addEventListener('click', () => { filterHost.classList.toggle('is-hidden'); btnFilter.classList.toggle('is-active', !filterHost.classList.contains('is-hidden')); });
  fillBtn.addEventListener('click', () => {
    try {
      const bytes = decimalToBytes(decIn.value, Number(widthSel.value), endianSel.value);
      input.value = bytesToHexString(bytes);
      errEl.classList.add('is-hidden');
      run();
    } catch (e) { showError(e.message); }
  });
  function showError(msg) { errEl.textContent = msg; errEl.classList.remove('is-hidden'); }

  rebuildScope(false);
  updateOptionRows();

  return {
    get mode() { return mode.value; },
    get filterHost() { return filterHost; },
    setFilterGetter(fn) { getFilter = fn; },
    setColumns(header, hl) { columns = header || []; hexLike = hl || null; rebuildScope(true); },
    setScopeColumn(col) { rebuildScope(true); scopeSel.value = col == null ? 'all' : String(col); if (input.value.trim()) trigger(0); },
    setPattern(kind, text, opts = {}) {
      mode.set(kind); updateOptionRows();
      input.value = text;
      if (kind === 'hex') { spanTouched = false; autoSpan(); if (opts.whole !== undefined) wholeChk.checked = opts.whole; }
      if (opts.column !== undefined) { rebuildScope(true); scopeSel.value = opts.column == null ? 'all' : String(opts.column); }
      if (opts.textMode) textMode.set(opts.textMode);
      run();
    },
    showError,
    focus() { input.focus(); },
    rerun() { if (input.value.trim()) trigger(0); },
    clear() { input.value = ''; errEl.classList.add('is-hidden'); columns = []; hexLike = null; rebuildScope(false); },
  };
}
return { createSearchBar };
})();

const M_main_ui_results = (() => {

class U32Builder { constructor() { this.a = new Uint32Array(1024); this.n = 0; } push(arr) { if (this.n + arr.length > this.a.length) { let cap = this.a.length; while (cap < this.n + arr.length) cap *= 2; const b = new Uint32Array(cap); b.set(this.a.subarray(0, this.n)); this.a = b; } this.a.set(arr, this.n); this.n += arr.length; } get(i) { return this.a[i]; } reset() { this.n = 0; } }
class U16Builder { constructor() { this.a = new Uint16Array(1024); this.n = 0; } push(arr) { if (this.n + arr.length > this.a.length) { let cap = this.a.length; while (cap < this.n + arr.length) cap *= 2; const b = new Uint16Array(cap); b.set(this.a.subarray(0, this.n)); this.a = b; } this.a.set(arr, this.n); this.n += arr.length; } get(i) { return this.a[i]; } reset() { this.n = 0; } }

function createResultsView({ container, onPick, requestCells, requestLocate, onColumnPick }) {

  let colCounts = null, rowHist = null, rowColHist = null, rowCount = 0;
  let byteHist = null, needleLength = 0, fileSize = 0;

  const nav = h('span', { class: 'results__nav' },
    h('button', { class: 'btn btn--sm', type: 'button', text: '▲', title: '이전 결과 (↑)', onClick: () => step(-1) }),
    h('button', { class: 'btn btn--sm', type: 'button', text: '▼', title: '다음 결과 (↓)', onClick: () => step(1) }));
  const toggle = h('button', { class: 'btn btn--sm', type: 'button', text: '접기', onClick: () => collapse(!container.classList.contains('is-collapsed')) });

  body.addEventListener('click', (e) => { const r = e.target.closest('.vlist__row'); if (!r) return; pick(Number(r.dataset.idx)); });
  body.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); step(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); } else if (e.key === 'Enter' && current >= 0) pick(current); });
  colsCanvas.addEventListener('click', (e) => {
    if (!colCounts) return;

  });

  function collapse(v) { container.classList.toggle('is-collapsed', v); toggle.textContent = v ? '펼치기' : '접기'; if (!v) vl.refresh(); }

  function drawCols() {

    setProgress(msg) { if (query && msg.id === query.id) { prog.firstChild.style.width = `${Math.round(msg.done / Math.max(1, msg.total) * 100)}%`; count.textContent = `검색 중 ${Math.round(msg.done / Math.max(1, msg.total) * 100)}% · ${fmtInt(msg.matchesTotal)}건`; } },

const M_main_ui_minimap = (() => {
const { h, segmented } = M_main_ui_dom;
const { setupCanvas, seqColor, cssVar } = M_main_ui_charts;
const { fmtInt } = M_main_format;
// 미니맵: 전체 행을 세로로 1024 버킷에 담아 매치 밀도를 그린다. 1D / 열별(2D) 토글.




function createMinimap({ container, onJump }) {
  container.classList.add('minimap');
  const canvas = h('canvas');
  const seg = segmented([['1d', '전체'], ['2d', '열별']], '1d', () => draw());
  const toggle = h('div', { class: 'minimap__toggle' }, seg.el);
  container.append(toggle, canvas);
  let data = null; // { rowCount, rowHist, rowColHist, cols, header }
  let view = { first: 0, last: -1 };
  let raf = 0;

  function mode() { return seg.value === '2d' && data && data.rowColHist && data.cols <= 64 ? '2d' : '1d'; }

  function draw() {
    raf = 0;
    const m = mode();
    const cols = m === '2d' ? data.cols : 1;
    const w = m === '2d' ? Math.max(56, cols * 3) : 56;
    container.style.width = w + 'px';
    const H = Math.max(10, canvas.clientHeight || container.clientHeight - toggle.offsetHeight);
    const ctx = setupCanvas(canvas, w, H);
    ctx.fillStyle = cssVar('--bg-panel');
    ctx.fillRect(0, 0, w, H);
    if (!data || !data.rowHist) { drawViewport(ctx, w, H); return; }
    const B = data.rowHist.length;
    const colW = w / cols;
    // 픽셀 행마다 버킷 합산
    const arr = m === '2d' ? data.rowColHist : data.rowHist;
    let max = 0;
    const agg = new Float64Array(H * cols);
    for (let y = 0; y < H; y++) {
      const b0 = Math.floor(y * B / H), b1 = Math.max(b0 + 1, Math.floor((y + 1) * B / H));
      for (let c = 0; c < cols; c++) {
        let s = 0;
        for (let b = b0; b < b1; b++) s += m === '2d' ? arr[b * cols + c] : arr[b];
        agg[y * cols + c] = s;
        if (s > max) max = s;
      }
    }
    if (max > 0) {
      const lmax = Math.log1p(max);
      for (let y = 0; y < H; y++) {
        for (let c = 0; c < cols; c++) {
          const v = agg[y * cols + c];
          if (!v) continue;
          ctx.fillStyle = seqColor(0.45 + 0.55 * (Math.log1p(v) / lmax));
          ctx.fillRect(c * colW, y, Math.max(1, colW - (cols > 1 ? 0.5 : 0)), 2);
        }
      }
    }
    drawViewport(ctx, w, H);
  }
  function drawViewport(ctx, w, H) {
    if (!data || !data.rowCount || view.last < view.first) return;
    const y0 = view.first / data.rowCount * H, y1 = Math.max(y0 + 2, (view.last + 1) / data.rowCount * H);
    ctx.strokeStyle = cssVar('--accent');
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, y0 + 0.5, w - 1, y1 - y0 - 1);
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(draw); }

  canvas.addEventListener('click', (e) => {
    if (!data || !data.rowCount) return;
    const r = canvas.getBoundingClientRect();
    const row = Math.floor((e.clientY - r.top) / r.height * data.rowCount);
    onJump && onJump(Math.max(0, Math.min(data.rowCount - 1, row)));
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!data || !data.rowCount) { canvas.title = ''; return; }
    const r = canvas.getBoundingClientRect();
    const row = Math.floor((e.clientY - r.top) / r.height * data.rowCount);
    let t = `행 ${fmtInt(row + 1)} 부근`;
    if (mode() === '2d') { const c = Math.floor((e.clientX - r.left) / r.width * data.cols); if (c >= 0 && c < data.cols) t += ` · ${data.header[c] || c}`; }
    canvas.title = t + ' (클릭 → 이동)';
  });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(schedule).observe(container);

  return {
    setData(d) { data = d; toggle.classList.toggle('is-hidden', !(d && d.rowColHist && d.cols <= 64)); schedule(); },
    setViewport(first, last) { view = { first, last }; schedule(); },
    clear() { data = data ? { rowCount: data.rowCount, rowHist: null, rowColHist: null, cols: data.cols, header: data.header } : null; schedule(); },
    setRowCount(rowCount, cols, header) { data = { rowCount, rowHist: null, rowColHist: null, cols, header }; schedule(); },
  };
}
return { createMinimap };
})();

// ===== src/shared/words.js =====
const M_shared_words = (() => {
const { parseNumber } = M_shared_numeric;
// 워드 인스펙터 계산 (범용, 1553 필드 디코딩 없음).


function widthForColumn(stats) {
  return stats && stats.hexLike && stats.widthBits ? stats.widthBits : 16;
}

/**
 * text 를 widthBits 폭의 워드로 해석. { ok, hex, unsigned, signed, bits(MSB 우선), bytesBE, width } 또는 { ok:false, reason }
 */
function inspectWord(text, widthBits = 16, { bareHex = false } = {}) {
  const r = parseNumber(String(text), 0, String(text).length, { bareHex });
  if (!r || r.i === undefined) return { ok: false, reason: '정수로 해석할 수 없습니다' };
  const bits = BigInt(widthBits);
  const mod = 1n << bits;
  let u = r.i;
  if (u < 0n) { if (-u > (mod >> 1n)) return { ok: false, reason: `${widthBits}비트 범위를 벗어납니다` }; u = mod + u; }
  if (u >= mod) return { ok: false, reason: `${widthBits}비트 범위를 벗어납니다 (값 ${r.i.toString()})` };
  const signed = u >= (mod >> 1n) ? u - mod : u;
  const bitArr = new Uint8Array(widthBits);
  for (let i = 0; i < widthBits; i++) bitArr[i] = Number((u >> BigInt(widthBits - 1 - i)) & 1n);
  const nBytes = widthBits / 8;
  const bytesBE = new Uint8Array(nBytes);
  for (let i = 0; i < nBytes; i++) bytesBE[i] = Number((u >> BigInt(8 * (nBytes - 1 - i))) & 0xffn);
  return { ok: true, width: widthBits, hex: '0x' + u.toString(16).toUpperCase().padStart(widthBits / 4, '0'), unsigned: u, signed, bits: bitArr, bytesBE };
}

/** 두 16비트 워드를 32비트로 (hi 가 상위 워드) */
function pair32(hi, lo) {
  const u32 = ((hi & 0xffff) * 65536 + (lo & 0xffff)) >>> 0;
  const dv = new DataView(new ArrayBuffer(4));
  dv.setUint32(0, u32, false);
  return { u32, i32: dv.getInt32(0, false), f32: dv.getFloat32(0, false) };
}

/** 셀 텍스트 → 16비트 워드 숫자 (불가하면 null) */
function wordValue(text, { bareHex = false } = {}) {
  const r = parseNumber(String(text), 0, String(text).length, { bareHex });
  if (!r || r.i === undefined || r.i < 0n || r.i > 0xffffn) return null;
  return Number(r.i);
}
return { widthForColumn, inspectWord, pair32, wordValue };
})();

  const kv = h('table', { class: 'kv' });

      if (nxt != null) { add('이 셀 ‖ 다음 셀 (빅 엔디안 워드 순서)', cur, nxt); add('다음 셀 ‖ 이 셀 (리틀)', nxt, cur); }

  container.append(list, h('div', { class: 'row' }, addBtn, clearBtn, hint));
  let timer = 0;
  const fire = () => { clearTimeout(timer); timer = setTimeout(() => onChange && onChange(getConditions()), 300); };

  function colSelect(value) {
    const s = h('select', { class: 'select' });
    columns.forEach((name, i) => s.appendChild(h('option', { value: String(i), text: name })));
    if (value != null) s.value = String(value);
    return s;
  }
  function addRow(cond = {}) {
    if (rows.length >= 4) return null;
    const colSel = colSelect(cond.col);
    const opSel = select(FILTER_OPS, cond.op || 'eq');
    const val = h('input', { class: 'input', type: 'text', placeholder: '값', spellcheck: 'false', autocomplete: 'off', value: cond.value || '' });
    const min = h('input', { class: 'input', type: 'text', placeholder: '최소', spellcheck: 'false', autocomplete: 'off', value: cond.min || '' });
    const max = h('input', { class: 'input', type: 'text', placeholder: '최대', spellcheck: 'false', autocomplete: 'off', value: cond.max || '' });
    const tilde = h('span', { text: '~' });
    const del = h('button', { class: 'btn btn--sm', type: 'button', text: '×', title: '조건 제거' });
    const row = h('div', { class: 'filter__cond' }, colSel, opSel, val, min, tilde, max, del);
    const sync = () => {
      const range = opSel.value === 'range', noValue = !filterNeedsValue(opSel.value);
      val.classList.toggle('is-hidden', range || noValue); min.classList.toggle('is-hidden', !range); max.classList.toggle('is-hidden', !range); tilde.classList.toggle('is-hidden', !range);
      val.placeholder = opSel.value === 'in' ? '값, 값 … (쉼표가 든 값은 "…")' : '값';
    };
    sync();
    opSel.addEventListener('change', () => { sync(); fire(); });
    for (const el of [colSel, val, min, max]) { el.addEventListener('input', fire); el.addEventListener('change', fire); }
    for (const el of [val, min, max]) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(timer); onChange && onChange(getConditions()); } });
    del.addEventListener('click', () => { const i = rows.indexOf(entry); if (i >= 0) rows.splice(i, 1); row.remove(); fire(); });
    const entry = { row, colSel, opSel, val, min, max };
    rows.push(entry);
    list.appendChild(row);
    return entry;
  }
  function getConditions() {
    const out = [];
    for (const r of rows) {
      const op = r.opSel.value, col = Number(r.colSel.value);
      if (Number.isNaN(col)) continue;
      if (!filterNeedsValue(op)) { out.push({ col, op }); continue; }
      if (op === 'range') { if (r.min.value.trim() === '' && r.max.value.trim() === '') continue; out.push({ col, op, min: r.min.value, max: r.max.value }); }
      else if (op === 'in') { if (splitValues(r.val.value).length) out.push({ col, op, value: r.val.value }); } // 「,」 뿐이면 조건이 아니다

    }
    return out;
  }
  addBtn.addEventListener('click', () => { addRow(); });
  clearBtn.addEventListener('click', () => { for (const r of rows) r.row.remove(); rows.length = 0; fire(); });

  return {
    setColumns(header) {
      columns = header || [];
      for (const r of rows) { const v = r.colSel.value; const s = colSelect(v); r.colSel.replaceWith(s); r.colSel = s; s.addEventListener('change', fire); }
    },
    getConditions,
    setConditions(conds) {
      for (const r of rows) r.row.remove();
      rows.length = 0;
      for (const c of (conds || []).slice(0, 4)) addRow(c);
      clearTimeout(timer);
      onChange && onChange(getConditions());
    },
    get count() { return getConditions().length; },
    clear() { for (const r of rows) r.row.remove(); rows.length = 0; columns = []; },
  };
}
return { createFilterBar };
})();

const M_main_ui_offset_bar = (() => {
const { h } = M_main_ui_dom;
const { setupCanvas, seqColor, cssVar } = M_main_ui_charts;
const { fmtBytes } = M_main_format;
// 오프셋 바: 파일 전체 바이트 범위를 가로로, 바이트 검색 매치 밀도와 현재 뷰포트를 그린다.




function createOffsetBar({ container, onJump }) {
  const canvas = h('canvas');
  container.appendChild(canvas);
  let size = 0, hist = null, view = [0, 0], raf = 0;
  function draw() {
    raf = 0;
    const w = container.clientWidth || 300, hh = container.clientHeight || 28;
    const ctx = setupCanvas(canvas, w, hh);
    ctx.fillStyle = cssVar('--bg-elev');
    ctx.fillRect(0, 0, w, hh);
    if (hist && size > 0) {
      const B = hist.length;
      let max = 0;
      const agg = new Float64Array(w);
      for (let x = 0; x < w; x++) {
        const b0 = Math.floor(x * B / w), b1 = Math.max(b0 + 1, Math.floor((x + 1) * B / w));
        let s = 0; for (let b = b0; b < b1; b++) s += hist[b];
        agg[x] = s; if (s > max) max = s;
      }
      if (max > 0) {
        const lmax = Math.log1p(max);
        for (let x = 0; x < w; x++) { if (!agg[x]) continue; ctx.fillStyle = seqColor(0.45 + 0.55 * Math.log1p(agg[x]) / lmax); ctx.fillRect(x, 2, 1, hh - 4); }
      }
    }
    if (size > 0 && view[1] > view[0]) {
      const x0 = view[0] / size * w, x1 = Math.max(x0 + 2, view[1] / size * w);
      ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 1.5;
      ctx.strokeRect(x0 + 0.5, 1, x1 - x0 - 1, hh - 2);
    }
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(draw); };
  canvas.addEventListener('click', (e) => {
    if (!size) return;
    const r = canvas.getBoundingClientRect();
    onJump && onJump(Math.floor((e.clientX - r.left) / r.width * size));
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!size) { canvas.title = ''; return; }
    const r = canvas.getBoundingClientRect();
    const off = Math.floor((e.clientX - r.left) / r.width * size);
    canvas.title = `오프셋 0x${off.toString(16).toUpperCase()} (${fmtBytes(off)}) — 클릭 → 이동`;
  });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(schedule).observe(container);
  return {
    setSize(s) { size = s; schedule(); },
    setHist(hh) { hist = hh; schedule(); },
    setView(a, b) { view = [a, b]; schedule(); },
    clear() { hist = null; schedule(); },
  };
}
return { createOffsetBar };
})();

const M_main_ui_hex_view = (() => {
const { h, clear } = M_main_ui_dom;
const { createVirtualList } = M_main_ui_virtual_list;
const { createOffsetBar } = M_main_ui_offset_bar;
const { hexLine } = M_shared_hex;
const { fmtInt } = M_main_format;
// 헥사 탭: 오프셋 바 + 가상 hex dump (16바이트/줄) + 행/열 주석 + 하이라이트 + 표 연동.






const LINE = 16;

function createHexView({ container, requestBytes, onGotoCell }) {
  container.classList.add('hex');
  const barHost = h('div', { class: 'hex__bar' });
  const offIn = h('input', { class: 'input', type: 'text', placeholder: '오프셋 (0x.. 또는 10진)', spellcheck: 'false', autocomplete: 'off' });
  const goBtn = h('button', { class: 'btn btn--sm', type: 'button', text: '이동' });
  const posEl = h('span', { class: 'hex__pos muted' });
  const hitInfo = h('span', { class: 'muted' });
  const tools = h('div', { class: 'hex__tools' }, h('span', { text: '오프셋' }), offIn, goBtn, posEl, h('span', { class: 'grow' }), hitInfo);
  const dumpHost = h('div', { class: 'hex__dump' });
  const empty = h('div', { class: 'table__empty', text: '데이터를 열면 파일의 원시 바이트가 표시됩니다.' });
  container.append(barHost, tools, dumpHost, empty);
  const bar = createOffsetBar({ container: barHost, onJump: (off) => showOffset(off) });

  let ds = null;          // { size, dataStart, header, bomLength }
  let win = null;         // { offset, bytes, records, cols }
  let pendingWin = null;
  let highlight = null;   // { start, end, kind: 'cell' | 'hit' }
  let hits = null;        // { offsets: Uint32Array-like getter, count, length(L) }
  let seq = 0;

  const vl = createVirtualList({ container: dumpHost, rowHeight: 28, overscan: 8, render: renderLine, onRangeChange: onRange, rowClass: 'vlist__row hex__line' });
  dumpHost.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-row]');
    if (btn) { onGotoCell && onGotoCell(Number(btn.dataset.row), Number(btn.dataset.col)); return; }
    const span = e.target.closest('.hex__bytes span[data-off]');
    if (span) { const off = Number(span.dataset.off); offIn.value = '0x' + off.toString(16).toUpperCase(); describe(off); }
  });
  goBtn.addEventListener('click', () => jumpInput());
  offIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpInput(); });
  function jumpInput() {
    const t = offIn.value.trim();
    if (!t) return;
    const v = /^0x/i.test(t) ? parseInt(t, 16) : parseInt(t, 10);
    if (Number.isNaN(v)) return;
    showOffset(v);
  }

  function lineCount() { return ds ? Math.ceil(ds.size / LINE) : 0; }

  async function onRange(first, last) {
    if (!ds) return;
    bar.setView(first * LINE, Math.min(ds.size, (last + 1) * LINE));
    const need0 = Math.max(0, first - 8) * LINE, need1 = Math.min(ds.size, (last + 9) * LINE);
    if (win && win.offset <= need0 && win.offset + win.bytes.length >= need1) return;
    const off = Math.max(0, (first - 24) * LINE), len = Math.min(ds.size - off, (last - first + 49) * LINE);
    if (pendingWin && pendingWin.off === off && pendingWin.len === len) return;
    const my = ++seq;
    pendingWin = { off, len };
    try {
      const r = await requestBytes(off, len);
      if (my !== seq) return;
      win = { offset: r.offset, bytes: r.bytes, records: r.records, cols: r.cols };
      pendingWin = null;
      vl.refresh();
    } catch { pendingWin = null; }
  }

  function annotation(rec, col) {
    if (!ds) return '';
    if (rec < 0) return ds.bomLength ? 'BOM / 범위 밖' : '';
    if (rec < ds.dataStart) return col >= 0 ? `헤더 · ${ds.header[col] || ''}` : '헤더';
    const row = rec - ds.dataStart;
    return col >= 0 ? `행 ${fmtInt(row + 1)} · ${ds.header[col] || `열${col + 1}`}` : `행 ${fmtInt(row + 1)} · 구분자/줄끝`;
  }

  function hitRangesIn(a, b) {
    // hits.offsets 는 오름차순
    const out = [];
    if (!hits || !hits.count) return out;
    const L = hits.length;
    let lo = 0, hi = hits.count;
    while (lo < hi) { const mid = (lo + hi) >>> 1; if (hits.get(mid) + L <= a) lo = mid + 1; else hi = mid; }
    for (let i = lo; i < hits.count; i++) { const o = hits.get(i); if (o >= b) break; out.push([o, o + L]); }
    return out;
  }

  function renderLine(idx, el) {
    if (el.childElementCount !== 4) {
      clear(el);
      el.append(h('span', { class: 'hex__off' }), h('span', { class: 'hex__bytes' }), h('span', { class: 'hex__ascii' }), h('span', { class: 'hex__ann' }));
    }
    const [offEl, bytesEl, asciiEl, annEl] = el.children;
    const lineOff = idx * LINE;
    offEl.textContent = lineOff.toString(16).toUpperCase().padStart(8, '0');
    if (!win || lineOff < win.offset || lineOff >= win.offset + win.bytes.length) {
      bytesEl.textContent = '…'; asciiEl.textContent = ''; annEl.textContent = '';
      return;
    }
    const rel = lineOff - win.offset;
    const slice = win.bytes.subarray(rel, Math.min(win.bytes.length, rel + LINE));
    const line = hexLine(lineOff, slice, LINE);
    const ranges = hitRangesIn(lineOff, lineOff + LINE);
    clear(bytesEl); clear(asciiEl);
    for (let i = 0; i < LINE; i++) {
      const off = lineOff + i;
      let cls = '';
      if (i < slice.length) {
        if (highlight && off >= highlight.start && off < highlight.end) cls = highlight.kind === 'cell' ? 'cell' : 'hl';
        else if (ranges.some(([a, b]) => off >= a && off < b)) cls = 'hl';
      }
      bytesEl.appendChild(h('span', { class: cls || null, dataset: i < slice.length ? { off } : null, text: line.hex[i] }));
      asciiEl.appendChild(h('span', { class: cls || null, text: line.ascii[i] }));
    }
    const li = Math.floor(rel / LINE);
    const rec = win.records[li], col = win.cols[li];
    clear(annEl);
    annEl.appendChild(h('span', { text: annotation(rec, col) }));
    if (rec >= ds.dataStart) annEl.appendChild(h('button', { class: 'btn--link', type: 'button', text: ' 표에서 보기', dataset: { row: rec - ds.dataStart, col: Math.max(0, col) } }));
  }

  function describe(off) { posEl.textContent = `0x${off.toString(16).toUpperCase()} = ${fmtInt(off)}`; }

  function showOffset(off, hl) {
    if (!ds) return;
    off = Math.max(0, Math.min(ds.size - 1, off));
    highlight = hl || null;
    vl.scrollToIndex(Math.floor(off / LINE), 'center');
    describe(off);
    vl.refresh();
  }

  return {
    setDataset(d) {
      ds = d ? { size: d.size, dataStart: d.dataStart, header: d.header, bomLength: d.bomLength } : null;
      win = null; pendingWin = null; highlight = null; hits = null;
      bar.setSize(ds ? ds.size : 0); bar.clear();
      empty.classList.toggle('is-hidden', !!ds);
      vl.setCount(lineCount());
      if (!ds) { vl.clearPool(); posEl.textContent = ''; }
      hitInfo.textContent = '';
      if (ds) vl.layoutNow();
    },
    /** 셀/행 바이트 범위를 강조하며 이동 */
    showRange(start, end, kind = 'cell') { showOffset(start, { start, end, kind }); },
    showOffset,
    setHits(h2) { hits = h2; hitInfo.textContent = h2 && h2.count ? `바이트 검색 매치 ${fmtInt(h2.total)}건 (니들 ${h2.length}B)` : ''; vl.refresh(); },
    setHist(hist) { bar.setHist(hist); },
    clearHits() { hits = null; hitInfo.textContent = ''; bar.clear(); vl.refresh(); },
    refresh() { vl.refresh(); },
    clear() { this.setDataset(null); },
  };
}
return { createHexView };
})();

const M_main_leave_guard = (() => {
// 데이터가 열려 있을 때 페이지를 떠나면(「홈」, 새로고침, 탭 닫기) 브라우저 확인창을 띄운다.
// 데이터는 이 탭 메모리에만 있어서 한 번 떠나면 되돌릴 수 없다. hasData 는 떠나는 시점에 읽는다.
function installLeaveGuard(target, hasData) {
  const onBeforeUnload = (e) => {
    if (!hasData()) return;
    e.preventDefault();
    e.returnValue = true; // preventDefault 만으로는 확인창을 띄우지 않는 구형 브라우저용
  };
  target.addEventListener('beforeunload', onBeforeUnload);
  return () => target.removeEventListener('beforeunload', onBeforeUnload);
}
return { installLeaveGuard };
})();

const M_main_export_plan = (() => {
const { createXlsxWriter, XLSX_MAX_ROWS, SHEETS_MAX_CELLS } = M_shared_xlsx;
const { fmtInt, fmtBytes } = M_main_format;
// 내보내기 패널의 판단: 어떤 범위를 고를 수 있는지·한도 경고·파일 이름·결과 문구, 그리고 그룹 집계 표 XLSX.
// DOM 을 쓰지 않는다 (패널 그리기와 파일 저장은 ui/export-panel.js).



const MAX_DATA_ROWS = XLSX_MAX_ROWS - 1;
const LABEL = { all: '전체 행', filter: '필터 통과 행', search: '검색 결과 행', group: '그룹 집계 표' };
const FILE_LABEL = { all: '전체', filter: '필터', search: '검색', group: '그룹집계' };

function sheetsWarning(gridCells) {
  return `구글 시트 한도(1,000만 셀)를 넘습니다 (${fmtInt(gridCells)}셀) — 엑셀에서는 열리지만 시트로는 가져올 수 없습니다. 필터로 줄여 보세요.`;
}

/**
 * ctx: { rowCount, columnCount, profiled, filterCount, query, searchHasResults, group }
 * → [{ mode, label, enabled, detail, reason?, warn? }] — 순서: 전체, 필터, 검색, 그룹
 */
function planOptions(ctx) {
  const { rowCount = 0, columnCount = 0, profiled, filterCount = 0, query, searchHasResults, group } = ctx;
  const opt = (mode, enabled, detail, reason) => ({ mode, label: LABEL[mode], enabled, detail, ...(enabled ? {} : { reason }) });
  if (!profiled) {
    // 16진수 열은 프로파일이 끝나야 안다 — 그 전에 저장하면 0012 가 12 로 바뀔 수 있다
    return ['all', 'filter', 'search', 'group'].map((m) => opt(m, false, '', '프로파일이 끝나면 내보낼 수 있습니다'));
  }
  const all = opt('all', rowCount <= MAX_DATA_ROWS, `${fmtInt(rowCount)}행 × ${fmtInt(columnCount)}열`,
    `엑셀 한도(${fmtInt(MAX_DATA_ROWS)}행)를 넘습니다 — 필터로 줄여 주세요`);
  const grid = (rowCount + 1) * columnCount;
  if (all.enabled && grid > SHEETS_MAX_CELLS) all.warn = sheetsWarning(grid);

  const filter = opt('filter', filterCount > 0, `조건 ${filterCount}개를 통과한 행`, '필터 조건이 없습니다');

  let search;

  else if (query && searchHasResults) search = opt('search', true, `검색 「${query.pattern}」에 맞은 칸이 있는 행`);
  else search = opt('search', false, '', '검색 결과가 없습니다');

  const groupOpt = group
    ? opt('group', true, `${fmtInt(group.groups.length)}개 그룹 · 건수·비율`)
    : opt('group', false, '', '프로파일 탭에서 그룹 집계를 먼저 실행하세요');

/** 처음 열었을 때 고를 범위: 전체, 막혀 있으면 고를 수 있는 첫 번째, 없으면 null */

}

function hexColumnsNote(header, hexLike) {
  if (!hexLike) return '';

  if (!names.length) return '';
  return `16진수 열 ${fmtInt(names.length)}개(${names.slice(0, 3).join(', ')}${names.length > 3 ? ' 외' : ''})는 글자 그대로 저장합니다 — 0012·1E05 같은 값이 숫자로 바뀌지 않습니다.`;

/** res: { rows, columns, bytes, gridCells, sheetsOk, removedChars, truncatedCells } → { text, warnings } */
function resultMessage(res) {
  const warnings = [];

  if (res.removedChars) warnings.push(`XLSX 에 넣을 수 없는 제어 문자 ${fmtInt(res.removedChars)}개를 뺐습니다.`);
  if (res.truncatedCells) warnings.push(`32,767자를 넘는 칸 ${fmtInt(res.truncatedCells)}개를 잘랐습니다 (엑셀·시트의 칸 한도).`);

/** 그룹 집계 결과(GROUP_BY_RESULT) → 시트 열·행. 상한에 걸려 합쳐진 나머지는 (기타) 행으로. */
function groupSheet(group, hexLike) {

  columns.push({ name: '건수', type: 'auto' }, { name: '비율', type: 'percent' });
  const total = Math.max(1, group.total);
  const rows = group.groups.map((g) => [...g.parts, g.count, g.count / total]);

/** 그룹 집계 표는 많아야 1만여 행이라 워커를 거치지 않고 메인 스레드에서 만든다 */

const M_main_ui_export_panel = (() => {
const { h, clear } = M_main_ui_dom;

const { fmtInt } = M_main_format;
// 「XLSX 내보내기」 패널: 범위를 고르면 만들어진 XLSX 를 파일로 저장한다.
// 파일 저장은 이 모듈에서만 한다 — build.mjs 의 금지 API 게이트가 모듈별로 검사해, 다른 모듈에는 저장 속성 이름 자체가 들어올 수 없다.
// 무엇을 고를 수 있는지·문구는 export-plan.js 가 정한다. 여기는 그리기와 저장뿐.




function createExportPanel({ button, host, getContext, run, cancel }) {
  let open = false, running = false, mode = null, outcome = null, visibleOnly = true;
  let progBar = null, progText = null;

  button.addEventListener('click', () => { if (open) close(); else show(); });
  document.addEventListener('keydown', (e) => { if (open && !running && e.key === 'Escape') close(); });
  document.addEventListener('mousedown', (e) => {
    if (open && !running && !host.contains(e.target) && !button.contains(e.target)) close();
  });

  function show() { open = true; outcome = null; mode = null; host.classList.remove('is-hidden'); button.setAttribute('aria-expanded', 'true'); render(); }
  function close() { open = false; host.classList.add('is-hidden'); button.setAttribute('aria-expanded', 'false'); }

  function render() {
    const ctx = getContext();
    const opts = planOptions(ctx);
    if (!opts.some((o) => o.mode === mode && o.enabled)) mode = defaultMode(opts);
    const sel = opts.find((o) => o.mode === mode);
    clear(host);
    host.append(
      h('div', { class: 'export__head' },
        h('strong', { text: 'XLSX로 내보내기' }),
        h('span', { class: 'muted', text: '구글 시트 「파일 → 가져오기」나 엑셀에서 바로 엽니다. 파일은 이 PC에서 만들어지며 어디로도 전송되지 않습니다.' })),
      h('div', { class: 'export__opts', role: 'radiogroup', 'aria-label': '내보낼 범위' }, ...opts.map(optionEl)),
    );
    // 열을 숨겨 두었으면 보이는 열만 내보낼지 (그룹 집계 표는 열이 정해져 있어 해당 없음)
    if (ctx.visibleCols && mode !== 'group') {
      const box = h('input', { type: 'checkbox', checked: visibleOnly, disabled: running });
      box.addEventListener('change', () => { visibleOnly = box.checked; });
      host.append(h('label', { class: 'check export__note' }, box, `보이는 열만 (${ctx.visibleCols.length} / ${ctx.header.length}개)`));
    }
    const note = mode && mode !== 'group' ? hexColumnsNote(ctx.header, ctx.hexLike) : '';
    if (note) host.append(h('div', { class: 'export__note', text: note }));
    if (sel && sel.warn) host.append(h('div', { class: 'export__msg export__msg--warn', text: sel.warn }));
    if (running) {
      progBar = h('div');
      progText = h('span', { text: '만드는 중…' });
      host.append(h('div', { class: 'export__progress' }, h('div', { class: 'progress' }, progBar), progText));
    }
    if (outcome) {
      if (outcome.error) host.append(h('div', { class: 'export__msg export__msg--error', text: outcome.error }));
      else host.append(h('div', { class: 'export__msg export__msg--ok', text: outcome.text }));
      for (const w of outcome.warnings || []) host.append(h('div', { class: 'export__msg export__msg--warn', text: w }));
    }
    const go = h('button', { class: 'btn btn--primary', type: 'button', text: '내보내기', disabled: running || !mode });
    go.addEventListener('click', doExport);
    const second = running
      ? h('button', { class: 'btn', type: 'button', text: '취소', disabled: mode === 'group' })
      : h('button', { class: 'btn', type: 'button', text: '닫기' });
    second.addEventListener('click', () => { if (running) cancel(); else close(); });
    host.append(h('div', { class: 'export__actions' }, second, go));
  }

  function optionEl(o) {
    const input = h('input', { type: 'radio', name: 'export-mode', value: o.mode, checked: o.mode === mode, disabled: !o.enabled || running });
    input.addEventListener('change', () => { mode = o.mode; outcome = null; render(); });
    return h('label', { class: 'export__opt' + (o.enabled ? '' : ' is-disabled'), dataset: { mode: o.mode } },
      input, h('span', { class: 'export__label', text: o.label }), h('span', { class: 'export__detail', text: o.enabled ? o.detail : o.reason }));
  }

  async function doExport() {
    if (running || !mode) return;
    const m = mode;
    running = true; outcome = null;
    render();
    try {
      const ctx = getContext();
      const res = await run(m, { visibleOnly: !!ctx.visibleCols && visibleOnly });
      if (res.cancelled) outcome = { text: '취소했습니다. 파일을 만들지 않았습니다.' };
      else if (!res.rows) outcome = { text: '조건에 맞는 행이 없어 파일을 만들지 않았습니다.' };
      else { saveFile(res.blob, exportFileName(m)); outcome = resultMessage(res); }
    } catch (e) {
      outcome = { error: '내보내지 못했습니다: ' + ((e && e.message) || e) };
    } finally {
      running = false;
      if (open) render();
    }
  }

  function saveFile(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, class: 'is-hidden' });
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  return {
    /** 프로파일이 끝나야(16진수 열을 알아야) 내보낼 수 있다 */
    setReady(ready) {
      button.disabled = !ready;
      button.title = ready ? '지금 데이터를 XLSX 파일로 저장합니다 (구글 시트·엑셀)' : '프로파일이 끝나면 내보낼 수 있습니다';
      if (!ready) close();
    },
    setProgress(frac, rows) {
      if (!running || !progBar) return;
      progBar.style.width = `${Math.round(Math.max(0, Math.min(1, frac)) * 100)}%`;
      progText.textContent = `만드는 중 ${Math.round(frac * 100)}% · ${fmtInt(rows)}행`;
    },
    /** 검색·필터·그룹 집계가 바뀌면 고를 수 있는 범위도 바뀐다 */
    refresh() { if (open && !running) render(); },
    reset() { running = false; outcome = null; close(); this.setReady(false); },
  };
}
return { createExportPanel };
})();

const M_main_chart_scale = (() => {
const { fmtInt } = M_main_format;
// 그래프 축 계산: 깔끔한 눈금, 16진수 눈금, 눈금·값 글자. DOM 을 쓰지 않는다 (그리기는 ui/graph-view.js).


function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
const clean = (v) => Number(v.toPrecision(12)); // 0.1 + 0.2 같은 부동소수 꼬리 제거

/** [lo, hi] 를 깔끔한 간격으로 넓히고 그 눈금을 돌려준다 (값이 하나면 그 주변으로) */
function niceScale(lo, hi, count = 5) {
  if (!(hi > lo)) { const d = Math.abs(lo) || 1; lo -= d / 2; hi += d / 2; }
  const step = niceStep((hi - lo) / Math.max(1, count));
  const a = clean(Math.floor(lo / step) * step), b = clean(Math.ceil(hi / step) * step);
  const ticks = [];
  for (let v = a, i = 0; v <= b + step / 2 && i < 100; v = clean(a + step * ++i)) ticks.push(v);
  return { lo: a, hi: b, step, ticks };
}

/** 16진수 열: 범위는 데이터 그대로, 눈금은 1·2·4·8 × 16^k 간격 */
function hexScale(lo, hi, count = 4) {
  if (!(hi > lo)) return { lo: lo - 1, hi: hi + 1, step: 1, ticks: [lo] };
  const raw = (hi - lo) / Math.max(1, count);
  let step = 1;
  while (step < raw) step *= 2;
  if (step > raw * 1.5 && step > 1) step /= 2; // 너무 성기면 한 단계 촘촘히
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi && ticks.length < 50; v += step) ticks.push(v);
  return { lo, hi, step, ticks };
}

/** 축 눈금 글자: 1만부터 K/M/B 로 줄이고, 소수는 간격의 자릿수만큼 */
function formatTick(v, { hex = false, step = 1 } = {}) {
  if (hex) return '0x' + Math.round(v).toString(16).toUpperCase().padStart(4, '0');
  const a = Math.abs(v);
  for (const [n, u] of [[1e9, 'B'], [1e6, 'M'], [1e4, 'K']]) {
    if (a >= n) return (n === 1e4 ? clean(v / 1e3) : clean(v / n)).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + (n === 1e4 ? 'K' : u);
  }
  const digits = step >= 1 ? 0 : Math.min(10, Math.ceil(-Math.log10(step) - 1e-9));
  return clean(v).toLocaleString('ko-KR', { maximumFractionDigits: digits });
}

/** 툴팁 값: 16진수는 0x 표기와 10진 함께, 없으면 — */
function formatValue(v, { hex = false, width = 4 } = {}) {
  if (!Number.isFinite(v)) return '—';
  if (hex) return `0x${Math.round(v).toString(16).toUpperCase().padStart(width, '0')} (${fmtInt(Math.round(v))})`;
  return Number.isInteger(v) ? fmtInt(v) : clean(v).toLocaleString('ko-KR', { maximumFractionDigits: 6 });
}

/** X 값 글자 — 구간 폭(res)보다 한 자리만 더 (19,926.726245 → 폭이 57 이면 19,927) */
function formatX(v, res) {
  const digits = res > 0 ? Math.max(0, Math.min(10, Math.ceil(-Math.log10(res)) + 1)) : 2;
  return clean(v).toLocaleString('ko-KR', { maximumFractionDigits: digits });
}

/** 범위의 양 끝을 같은 단위로 — 큰 쪽 기준으로 K/M/B 를 정해 둘 다 그 단위로 쓴다 */
function formatSpan(a, b) {
  const m = Math.max(Math.abs(a), Math.abs(b));
  const [n, u] = m >= 1e9 ? [1e9, 'B'] : m >= 1e6 ? [1e6, 'M'] : m >= 1e4 ? [1e3, 'K'] : [1, ''];
  const f = (v) => (v === 0 ? '0' : clean(v / n).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + u);
  return [f(a), f(b)];
}

/** b 번 구간이 덮는 X 범위 [from, to] */
function bucketRange(b, x0, x1, B) {
  const w = (x1 - x0) / B;
  return [clean(x0 + w * b), clean(x0 + w * (b + 1))];
}
return { niceScale, hexScale, formatTick, formatValue, formatX, formatSpan, bucketRange };
})();

    const colW = w / B;
    const tot = new Float64Array(B);
    for (let b = 0; b < B; b++) for (let k = 0; k < K; k++) tot[b] += s.counts[b * K + k];
    const below = (b, k) => { let n = 0; for (let j = 0; j < k; j++) n += s.counts[b * K + j]; return n; };
    for (let k = 0; k < K; k++) {
      ctx.fillStyle = catColor(s, k);
      for (let b = 0; b < B; b++) {
        const n = s.counts[b * K + k];
        if (!tot[b] || !n) continue;
        const lo = below(b, k);
        const y1 = ys(lo / tot[b]), y2 = ys((lo + n) / tot[b]);
        ctx.fillRect(l + b * colW, y2, colW + 0.6, y1 - y2);
      }
    }
    // 층 사이를 표면색 선으로 갈라 이웃 색이 붙어 보이지 않게 (테두리가 아니라 간격)
    ctx.strokeStyle = cssVar('--bg-panel'); ctx.lineWidth = 1.5;
    for (let k = 1; k < K; k++) {
      ctx.beginPath();
      for (let b = 0; b < B; b++) {
        if (!tot[b]) continue;
        const y = ys(below(b, k) / tot[b]);
        ctx.moveTo(l + b * colW, y); ctx.lineTo(l + (b + 1) * colW, y);
      }
      ctx.stroke();
    }
    return;
  }
  const color = cssVar('--viz-1');
  // 최소~최대 띠: 값이 이어진 구간마다 다각형 하나 (옅은 칠)
  ctx.fillStyle = rgba(color, 0.16);
  for (let b = 0; b < B;) {
    if (!s.cnt[b]) { b++; continue; }
    let e = b;
    while (e + 1 < B && s.cnt[e + 1]) e++;
    ctx.beginPath();
    ctx.moveTo(l + (b / B) * w, ys(s.max[b]));
    for (let i = b; i <= e; i++) ctx.lineTo(xs(i), ys(s.max[i]));
    ctx.lineTo(l + ((e + 1) / B) * w, ys(s.max[e]));
    ctx.lineTo(l + ((e + 1) / B) * w, ys(s.min[e]));
    for (let i = e; i >= b; i--) ctx.lineTo(xs(i), ys(s.min[i]));
    ctx.lineTo(l + (b / B) * w, ys(s.min[b]));
    ctx.closePath();
    ctx.fill();
    b = e + 1;
  }
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  let filled = 0;
  for (let b = 0; b < B; b++) if (s.cnt[b]) filled++;
  if (filled <= B / 2) {
    // 듬성듬성한 데이터(필터로 한 RT·한 열만 남긴 경우 등): 빈 구간을 건너 점끼리 이어 흐름이 보이게 + 8px 점(표면색 테두리).
    // 평소 간격의 4배를 넘는 빈 구간(정말 값이 없던 시간)은 실선으로 잇지 않고 가는 점선으로
    const at = [];
    for (let b = 0; b < B; b++) if (s.cnt[b]) at.push(b);
    const gaps = at.slice(1).map((b, k) => b - at[k]).sort((p, q) => p - q);
    const longGap = Math.max(2, 4 * (gaps.length ? gaps[gaps.length >> 1] : 1));
    const solid = new Path2D(), dashed = new Path2D();
    for (let k = 1; k < at.length; k++) {
      const a = at[k - 1], b = at[k];
      if (b - a > longGap) { dashed.moveTo(xs(a), ys(s.mean[a])); dashed.lineTo(xs(b), ys(s.mean[b])); continue; }
      if (k === 1 || a - at[k - 2] > longGap) solid.moveTo(xs(a), ys(s.mean[a]));
      solid.lineTo(xs(b), ys(s.mean[b]));
    }
    ctx.stroke(solid);
    ctx.lineWidth = 1; ctx.setLineDash([3, 4]); ctx.stroke(dashed); ctx.setLineDash([]);
    ctx.lineWidth = 2; ctx.strokeStyle = cssVar('--bg-panel');
    for (let b = 0; b < B; b++) {
      if (!s.cnt[b]) continue;
      ctx.beginPath(); ctx.arc(xs(b), ys(s.mean[b]), 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    return;
  }
  // 평균 선(2px) — 값이 없는 구간에서 끊고, 홀로 떨어진 구간은 점으로
  for (let b = 0; b < B;) {
    if (!s.cnt[b]) { b++; continue; }
    let e = b;
    while (e + 1 < B && s.cnt[e + 1]) e++;
    if (e === b) { ctx.beginPath(); ctx.arc(xs(b), ys(s.mean[b]), 3, 0, Math.PI * 2); ctx.fill(); }
    else {
      ctx.beginPath();
      ctx.moveTo(xs(b), ys(s.mean[b]));
      for (let i = b + 1; i <= e; i++) ctx.lineTo(xs(i), ys(s.mean[i]));
      ctx.stroke();
    }
    b = e + 1;
  }
}

/** 범례 — 범주는 값마다 칠 견본, 숫자(크게 보기)는 평균 선과 최소~최대 띠 */
function legendEl(s) {
  if (s.kind === 'cat') {
    return h('div', { class: 'legend graph__legend' }, ...s.labels.map((name, k) => {
      const sw = h('span', { class: 'swatch' });
      sw.style.background = catColor(s, k);
      return h('span', { class: 'legend__item' }, sw, h('span', { text: name }));
    }));
  }
  const line = h('span', { class: 'graph__key' });
  line.style.background = cssVar('--viz-1');
  const band = h('span', { class: 'graph__key graph__key--band' });
  band.style.background = rgba(cssVar('--viz-1'), 0.3);
  return h('div', { class: 'legend graph__legend' }, h('span', { class: 'legend__item' }, line, h('span', { text: '구간 평균' })), h('span', { class: 'legend__item' }, band, h('span', { text: '구간 최소 ~ 최대' })));
}

function createGraphView({ container, request, cancel, onOpenColumn, onGotoRow, onFilterValue }) {
  let ds = null, prof = null, xCol = -1;
  let filterConds = null, filterKey = '';
  let overview = null, overviewKey = '', overviewPending = null, overviewError = '';
  let focusCol = null, focusData = null, zoom = null, tableOpen = false, focusPending = null, lastShown = null;
  let seq = 0, progressFor = null, hoverB = -1, visibleSet = null, autoFocused = false; // visibleSet: 표에서 고른 보이는 열 (null = 모두)
  let markValues = [], markDraft = '', markNote = ''; // 크게 보는 열에서 「나온 때」를 볼 값들 (MARK_MAX 개까지) · 입력란에 치는 중인 글자 (다시 그려도 남게) · 넘친 값 안내
  const markSlots = new Map(); // 값 → 색 자리. 값을 빼도 남은 값의 색은 그대로 (색은 순서가 아니라 값을 따른다)
  const minis = new Set();

  const root = h('div', { class: 'graph' });
  const xSel = h('select', { class: 'select', title: '가로축' });
  const status = h('span', { class: 'muted graph__status' });
  const prog = h('div', { class: 'progress is-hidden' }, h('div'));
  const bar = h('div', { class: 'graph__bar' }, h('label', { class: 'graph__x' }, h('span', { text: 'X축' }), xSel), prog, status);
  const focusBox = h('div', { class: 'card graph__focus is-hidden' });
  const grid = h('div', { class: 'graph__grid' });
  const skippedBox = h('div', { class: 'graph__skipped' });
  const empty = h('div', { class: 'detail__empty', text: '파일을 열고 프로파일이 끝나면 열마다 시간에 따른 변화를 그립니다.' });
  root.append(bar, focusBox, grid, skippedBox, empty);
  container.appendChild(root);

  // X 를 바꿔도 크게 보던 열은 유지한다 (그 열이 X 가 되면 크게 보기에 이유가 나온다)
  xSel.addEventListener('change', () => { xCol = Number(xSel.value); invalidate(); zoom = null; lastShown = null; renderAll(); ensureOverview(); });

  const visible = () => !container.classList.contains('is-hidden');
  const keyNow = () => `${xCol}|${filterKey}`;
  const redrawMinis = () => { for (const m of minis) m.redraw(); };

  /** 크게 보기 상태를 한 곳에서 비운다 (진행 중인 계산도 취소) */
  function resetFocus(col = null) {
    if (focusPending) { cancel(focusPending); focusPending = null; }
    focusCol = col; focusData = null; zoom = null; tableOpen = false; hoverB = -1; lastShown = null;
    markValues = []; markDraft = ''; markNote = ''; markSlots.clear();
  }

  /** 값을 넣어 볼 수 있는 열: X축이 아니고 값이 있는 열 (그래프로 그리지 않는 글자 열도 「나온 때」는 볼 수 있다) */
  const canMark = (col) => !!(prof && col != null && col !== xCol && prof.stats[col] && prof.stats[col].count > 0);
  const drawable = (col) => !overview || overview.series.some((x) => x.col === col);
  const sameList = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  /** 지금 넣은 값들로 센 결과만 (다른 값·다른 열의 것은 버린다) */
  const markOf = (r) => (markValues.length && r && r.mark && r.mark.col === focusCol && sameList(r.mark.values, markValues) ? r.mark : null);

  /** 넣은 값들 → 비교할 값들 (16진수 열은 0x 와 열 폭의 대문자 한 모양 · 숫자만은 16진수, 같은 값은 한 번, MARK_MAX 개까지 — 워커와 「이 값인 행만」 필터도 같은 값) */
  const normMarks = (col, list) => markQueries(list, !!(prof && prof.hexLike && prof.hexLike[col]), (prof && prof.stats[col] && prof.stats[col].hexNibblesMax) || 0);

    }

    markValues = next; markDraft = joinValues(next); // 쉼표가 든 값은 "…" 로 — 다시 Enter 해도 한 값
    if (changed) hoverB = -1;

  }
  function setMarks(list, refocus = false) {
    const next = normMarks(focusCol, list);
    markNote = list.length > MARK_MAX && next.length === MARK_MAX ? `${MARK_MAX}개까지만 비교합니다 — 뒤의 값은 뺐습니다` : '';
    const changed = applyMarks(next);
    renderFocus();
    if (refocus) { const i = focusBox.querySelector('.graph__markin'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } // 단추를 눌러도 키보드 초점은 입력란에
    if (changed && markValues.length) refineFocus();
  }
  /** 자주 나온 값 단추: 넣었으면 빼고, 아니면 더한다 */
  function toggleMark(v) {
    const q = normMarks(focusCol, [v])[0];
    if (q) setMarks(markValues.includes(q) ? markValues.filter((x) => x !== q) : [...markValues, q], true);
  }

  function invalidate() {
    if (overviewPending) { cancel(overviewPending); overviewPending = null; }
    if (focusPending) { cancel(focusPending); focusPending = null; }
    overview = null; overviewKey = ''; focusData = null; overviewError = '';
  }

  async function ensureOverview() {
    if (!ds || !prof) return;
    const key = keyNow();
    if ((overview && overviewKey === key) || (overviewPending && overviewKey === key)) return;
    if (overviewPending) cancel(overviewPending);
    const id = 'g' + (++seq);
    overviewPending = id; overviewKey = key; progressFor = id; overviewError = '';
    setBusy(true, '계산 중…');
    redrawMinis();
    try {
      const r = await request({ id, xCol, buckets: OVERVIEW_BUCKETS, filter: filterConds });
      if (overviewPending !== id) return;
      overviewPending = null;
      if (r.cancelled) { overviewKey = ''; setBusy(false, ''); redrawMinis(); return; }
      overview = r;
      setBusy(false);
      renderAll();
      if (focusCol != null) refineFocus();
    } catch (e) {
      if (overviewPending !== id) return;

      setBusy(false, overviewError);
      redrawMinis();
    }
  }

  async function refineFocus() {
    if (focusCol == null || !overview) return;
    if (!drawable(focusCol) && !(markValues.length && canMark(focusCol))) { renderFocus(); return; }
    if (focusPending) cancel(focusPending);
    const id = 'g' + (++seq);
    focusPending = id; progressFor = id;
    focusBox.dataset.ready = 'false'; // 화면 폭에 맞춘 데이터로 다시 그리기 전 (e2e 가 이걸 기다린다)
    const width = Math.max(200, Math.min(2000, Math.round(focusBox.clientWidth || 800)));
    try {
      const r = await request({ id, xCol, buckets: width, cols: [focusCol], range: zoom, filter: filterConds, mark: markValues.length ? { col: focusCol, values: markValues } : null });
      if (focusPending !== id) return;

    } catch (e) {
      if (focusPending !== id) return;

  }

  function setBusy(on, text) {
    prog.classList.toggle('is-hidden', !on);

    if (text != null) status.textContent = text;
    // 다시 계산하는 동안 이전 그림을 흐리게 유지한다 (빈 화면으로 깜빡이지 않게)
    root.classList.toggle('is-refreshing', !!on);
  }

  function summaryText(r) {
    const n = r.rows.reduce((a, b) => a + b, 0);
    const parts = [`${fmtInt(n)}행`, `${fmtInt(r.series.length)}개 열`, `X: ${r.xName}`];
    if (r.filteredOut) parts.push(`필터로 ${fmtInt(r.filteredOut)}행 제외`);
    if (r.noX) parts.push(`X 값 없는 ${fmtInt(r.noX)}행 제외`);

  // ---------- 작은 그래프 묶음 ----------

    empty.classList.toggle('is-hidden', !!overview || !!overviewPending);

    clear(grid); clear(skippedBox);
    const shown = overview.series.filter((s) => !visibleSet || visibleSet.has(s.col));
    const skipped = overview.skipped.filter((k) => !visibleSet || visibleSet.has(k.col));
    status.textContent = summaryText(overview) + (visibleSet ? ` · 보이는 열 ${fmtInt(visibleSet.size)}개만` : '');
    for (const s of shown) grid.appendChild(cardEl(s));
    if (!shown.length) grid.appendChild(h('div', { class: 'detail__empty', text: '보이는 열 중에 그래프로 그릴 열이 없습니다. 위 「열 ▾」에서 열을 더 고르세요.' }));
    if (skipped.length) {
      skippedBox.append(h('div', { class: 'panel-title', text: '그래프로 그리지 않은 열' }),
        h('div', { class: 'chips' }, ...skipped.map((k) => h('span', { class: 'chip graph__skip', title: k.reason, text: `${k.name} — ${k.reason}` }))));
    }
    // 보이는 열 중 그릴 열이 하나뿐이면 바로 크게 (한 열의 흐름을 보려고 고른 경우)
    if (visibleSet && shown.length === 1 && focusCol == null && !autoFocused) { autoFocused = true; focusCol = shown[0].col; refineFocus(); } // 닫으면 다시 열지 않는다

  function cardEl(s) {

    const card = h('div', { class: 'card is-clickable graph__card' + (s.col === focusCol ? ' is-active' : ''), dataset: { col: String(s.col) }, tabindex: '0', role: 'button', 'aria-label': `${s.name} 크게 보기` },
      h('div', { class: 'card__title' }, h('span', { class: 'name', text: s.name }), h('span', { class: 'badge' + (s.hex ? ' badge--hex' : ''), text: KIND_LABEL[kindOf(s)] })),
      canvas,
      h('div', { class: 'graph__xr faint' }, ...formatSpan(overview.x0, overview.x1).map((t) => h('span', { text: t }))));
    if (s.kind === 'cat') card.appendChild(legendEl(s));

  function drawCard(canvas, s) {

  function drawCards() {

  // ---------- 크게 보기 ----------
  /** 지금 그릴 데이터: 화면 폭에 맞춘 데이터 → (확대 전이면) 전체 그래프 데이터 → 계산 중이면 직전 그림(흐리게) */

    if (focusData && colOf(focusData) === focusCol) return { r: focusData, s: focusData.series[0] || null, stale: false };
