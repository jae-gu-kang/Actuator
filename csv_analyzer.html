})();

// ===== src/shared/groupby.js =====
const M_shared_groupby = (() => {
// 상한 있는 그룹 카운터. 키 = parts.join('\u0001'). 상한 초과 신규 키는 otherCount 로.
function createGroupCounter(cap = 10000) {
  const map = new Map();
  let total = 0, otherCount = 0, capped = false;
  return {
    add(parts) {
      total++;
      const key = parts.join('\u0001');
      const c = map.get(key);
      if (c !== undefined) map.set(key, c + 1);
      else if (map.size < cap) map.set(key, 1);
      else { capped = true; otherCount++; }
    },
    result() {
      const groups = Array.from(map, ([k, count]) => ({ parts: k.split('\u0001'), count }));
      groups.sort((a, b) => b.count - a.count || (a.parts.join('\u0001') < b.parts.join('\u0001') ? -1 : 1));
      return { groups, total, otherCount, capped, distinct: map.size };
    },
  };
}
return { createGroupCounter };
})();

// ===== src/shared/search-bytes.js =====
const M_shared_search_bytes = (() => {
// 마스크 바이트 시퀀스 검색. 앵커(첫 완전 고정 바이트)를 네이티브 indexOf 로 찾고 마스크로 검증한다.
/**
 * hay[from, toExcl) 안에 완전히 들어가는 매치의 시작 위치를 onHit(start) 로 보고.
 */
function findMasked(hay, bytes, mask, anchor, from, toExcl, onHit) {
  const L = bytes.length;
  if (L === 0 || toExcl - from < L) return 0;
  const a = bytes[anchor];
  let count = 0;
  let i = hay.indexOf(a, from + anchor);
  const lastStart = toExcl - L;
  while (i >= 0) {
    const start = i - anchor;
    if (start > lastStart) break;
    if (start >= from) {
      let ok = true;
      for (let j = 0; j < L; j++) {
        if (((hay[start + j] ^ bytes[j]) & mask[j]) !== 0) { ok = false; break; }
      }
      if (ok) { onHit(start); count++; }
    }
    i = hay.indexOf(a, i + 1);
  }
  return count;
}
return { findMasked };
})();

// ===== src/worker/engine.js =====
const M_worker_engine = (() => {
const { createByteRecordScanner, FieldIndex, scanFieldsString, fieldText, scanRecordFieldsBytes, fieldAtByte } = M_shared_csv_scan;
const { detectEncoding, detectDelimiter, detectHeader, makeDecoder, firstRecords } = M_shared_detect;
const { U32Vec, U16Vec, rowOfOffset } = M_shared_offsets;
const { MSG } = M_shared_protocol;
const { createColumnProfiler, provisionalForColumn, topN } = M_shared_profiler;
const { makeRng } = M_shared_rng;
const { compileCellMatcher, searchBlock } = M_shared_search_cells;
const { compileFilter } = M_shared_filter;
const { createGroupCounter } = M_shared_groupby;
const { trimSpan } = M_shared_infer;
const { parseByteNeedle } = M_shared_hex;
const { findMasked } = M_shared_search_bytes;
// 데이터셋 엔진. 워커에서 실행되지만 메인 스레드 폴백으로도 동작한다 (DOM 사용 금지).













const CHUNK = 8 << 20;        // 인덱스 패스 청크
const SAMPLE = 1 << 20;       // 감지 샘플
const MAX_FILE = 0xffffffff;  // Uint32 오프셋 한계
const MAX_EXTRA = 256;
const MAX_OVERFLOW_LIST = 10000;
const MAX_ANNOTATED_RECORD = 1 << 20; // hex 뷰 주석을 위해 파싱할 최대 레코드 길이

class Engine {
  constructor(post) {
    this.post = post;
    this.ds = null;
    this.gen = 0;      // open/clear 마다 증가. 긴 루프는 세대가 바뀌면 중단.
    this.fi = new FieldIndex();
    this.busy = 0;            // 검색/그룹 집계 등 우선 작업 수. 프로파일은 0이 될 때까지 양보.
    this.resumeWaiters = [];
    this.profiling = false;
    this.profilePromise = null;
    this.activeSearch = 0;
    this.activeGroup = 0;
  }

  /** 우선 작업 시작/종료. 종료 시 프로파일 재개. */
  beginPriority() { this.busy++; }
  endPriority() {
    this.busy = Math.max(0, this.busy - 1);
    if (this.busy === 0) { const w = this.resumeWaiters; this.resumeWaiters = []; for (const r of w) r(); }
  }
  async yieldToPriority(gen) {
    while (this.busy > 0 && gen === this.gen) await new Promise((r) => this.resumeWaiters.push(r));
  }
  wakeWaiters() { const w = this.resumeWaiters; this.resumeWaiters = []; for (const r of w) r(); }

  async handle(msg) {
    const reqId = msg.reqId;
    try {
      switch (msg.type) {
        case MSG.PING: this.post({ type: MSG.PONG, reqId }); break;
        case MSG.OPEN: await this.open(msg); break;
        case MSG.ROWS: await this.rows(msg); break;
        case MSG.ROW_DETAIL: await this.rowDetail(msg); break;
        case MSG.BYTES: await this.bytes(msg); break;
        case MSG.LOCATE: await this.locate(msg); break;
        case MSG.PROFILE: await this.profile({ reqId }); break;
        case MSG.SEARCH: await this.search(msg); break;
        case MSG.CANCEL: this.cancel(msg); break;
        case MSG.CELLS: await this.cells(msg); break;
        case MSG.GROUP_BY: await this.groupBy(msg); break;
        case MSG.LOCATE_MANY: await this.locateMany(msg); break;
        case MSG.CLEAR: this.clear(); this.post({ type: 'cleared', reqId }); break;
        default:
          throw new Error('알 수 없는 메시지: ' + msg.type);
      }
    } catch (e) {
      this.post({ type: MSG.ERROR, reqId, message: (e && e.message) || String(e) });
    }
  }

  need() {
    if (!this.ds || !this.ds.recordOffsets) throw new Error('열린 데이터가 없습니다');
    return this.ds;
  }

  clear() {
    this.gen++;
    this.ds = null;
    this.wakeWaiters(); // 대기 중인 프로파일이 세대 변경을 보고 종료하도록
  }

  // ---------- 열기 / 감지 ----------
  async open({ reqId, blob, options = {} }) {
    this.clear();
    const gen = this.gen;
    const size = blob.size;
    if (size >= MAX_FILE) throw new Error('4GB 이상 파일은 지원하지 않습니다');

    const sample = new Uint8Array(await blob.slice(0, Math.min(size, SAMPLE)).arrayBuffer());
    if (gen !== this.gen) return;

    const enc = detectEncoding(sample);
    const encoding = options.encoding && options.encoding !== 'auto' ? options.encoding : enc.encoding;
    const bomLength = enc.bomLength;
    const unitSize = encoding.startsWith('utf-16') ? 2 : 1;
    const littleEndian = encoding !== 'utf-16be';
    const decoder = makeDecoder(encoding);
    const sampleText = decoder.decode(sample.subarray(bomLength), { stream: true });
    decoder.decode(); // 스트림 상태 초기화

    const detDel = detectDelimiter(sampleText);
    const delimiter = options.delimiter && options.delimiter !== 'auto' ? options.delimiter : detDel.delimiter;
    const recs = firstRecords(sampleText, delimiter, 2);
    const detHeader = detectHeader(recs[0] || [], recs[1] || null);
    const hasHeader = typeof options.hasHeader === 'boolean' ? options.hasHeader : detHeader;
    const first = recs[0] || [];
    const header = hasHeader
      ? first.map((s, i) => s.trim() || `열${i + 1}`)
      : first.map((_, i) => `열${i + 1}`);

    // 레코드 수 추정 (U32Vec 사전 크기)
    let lf = 0;
    for (let i = 0; i < sample.length; i += unitSize) if (sample[i] === 10) lf++;
    const avg = sample.length / Math.max(1, lf);
    const estRecords = Math.ceil(size / avg * 1.15) + 64;

    this.ds = {
      blob, size, encoding, bomLength, unitSize, littleEndian, delimiter, quote: '"', hasHeader,
      header, schemaCount: header.length, extraCount: 0, columnCount: header.length,
      decoder, estRecords,
      recordOffsets: null, recordFieldCounts: null, recordCount: 0, dataStart: hasHeader ? 1 : 0, rowCount: 0,
      overflowRows: null, overflowTotal: 0, fieldCountHist: null, maxFieldCount: 0,
      stats: null, hexLike: null, padNibbles: null, wordFreq: null,
    };
    this.post({
      type: MSG.OPENED, reqId, encoding, bomLength, delimiter, hasHeader, header: header.slice(), size,
      detected: { encoding: enc.encoding, delimiter: detDel.delimiter, hasHeader: detHeader, confidence: enc.confidence },
    });
    await this.index(gen);
  }

  // ---------- 패스 A: 인덱스 ----------
  async index(gen) {
    const ds = this.ds;
    const { blob, size, bomLength, unitSize } = ds;
    const offsets = new U32Vec(ds.estRecords);
    const counts = new U16Vec(ds.estRecords);
    const scanner = createByteRecordScanner({ delimiter: ds.delimiter, quote: ds.quote, unitSize, littleEndian: ds.littleEndian });
    let pos = bomLength;
    let lastReport = 0;
    let next = pos < size ? blob.slice(pos, Math.min(size, pos + CHUNK)).arrayBuffer() : null;
    while (pos < size) {
      const end = Math.min(size, pos + CHUNK);
      const buf = await next;
      if (gen !== this.gen) return;
      next = end < size ? blob.slice(end, Math.min(size, end + CHUNK)).arrayBuffer() : null; // 선읽기
      scanner.scan(new Uint8Array(buf), pos, offsets, counts);
      pos = end;
      if (pos - lastReport >= (16 << 20) || pos === size) {
        lastReport = pos;
        this.post({ type: MSG.INDEX_PROGRESS, done: pos, total: size, records: offsets.length });
      }
    }
    scanner.finish(size, offsets, counts);
    if (gen !== this.gen) return;

    const n = offsets.length;
    const recordOffsets = new Uint32Array(n + 1);
    recordOffsets.set(offsets.view());
    recordOffsets[n] = size;
    const recordFieldCounts = counts.compact();
    ds.recordOffsets = recordOffsets;
    ds.recordFieldCounts = recordFieldCounts;
    ds.recordCount = n;
    ds.dataStart = ds.hasHeader && n > 0 ? 1 : 0;
    ds.rowCount = Math.max(0, n - ds.dataStart);

    // 스키마: 헤더 열 수 기준. 부족한 행은 정상, 초과 행만 이상치.
    const schema = ds.schemaCount;
    let maxFc = 0;
    const overflow = new U32Vec(256);
    let overflowTotal = 0;
    for (let r = ds.dataStart; r < n; r++) {
      const fc = recordFieldCounts[r];
      if (fc > maxFc) maxFc = fc;
      if (fc > schema) { overflowTotal++; if (overflow.length < MAX_OVERFLOW_LIST) overflow.push(r - ds.dataStart); }
    }
    const fieldCountHist = new Uint32Array(maxFc + 1);
    for (let r = ds.dataStart; r < n; r++) fieldCountHist[recordFieldCounts[r]]++;
    ds.maxFieldCount = maxFc;
    ds.extraCount = Math.min(MAX_EXTRA, Math.max(0, maxFc - schema));
    ds.header = ds.header.slice(0, schema);
    for (let i = 0; i < ds.extraCount; i++) ds.header.push(`EXTRA_${i + 1}`);
    ds.columnCount = schema + ds.extraCount;
    ds.overflowTotal = overflowTotal;
    ds.overflowRows = overflow.compact();
    ds.fieldCountHist = fieldCountHist;

    this.post({
      type: MSG.INDEXED,
      recordCount: n, rowCount: ds.rowCount, dataStart: ds.dataStart,
      header: ds.header.slice(), schemaCount: schema, extraCount: ds.extraCount, columnCount: ds.columnCount,
      maxFieldCount: maxFc, fieldCountHist: fieldCountHist.slice(), overflowTotal, overflowRows: ds.overflowRows.slice(),
      encoding: ds.encoding, delimiter: ds.delimiter, hasHeader: ds.hasHeader, size, bomLength,
    });
    await this.profile({ gen });
  }

  // ---------- 행 블록 이터레이터 (패스 B / 검색 / 그룹) ----------
  /** [fromRow, toRow) 데이터 행을 ~targetBytes 블록으로. { rowStart, rowEnd, u8, base } 를 yield. 1블록 선읽기. */
  async *rowBlocks(fromRow, toRow, targetBytes = CHUNK) {
    const ds = this.need();
    const off = ds.recordOffsets, ds0 = ds.dataStart;
    toRow = Math.min(toRow, ds.rowCount);
    const planEnd = (rowStart) => {
      const startByte = off[rowStart + ds0];
      let lo = rowStart + 1, hi = toRow + 1; // off[toRow+ds0](마지막 행의 끝)까지 포함해 탐색
      // off[row+ds0] <= startByte + targetBytes 인 최대 row+1
      while (lo < hi) { const mid = (lo + hi) >>> 1; if (off[mid + ds0] <= startByte + targetBytes) lo = mid + 1; else hi = mid; }
      return Math.max(rowStart + 1, lo - 1 > rowStart ? lo - 1 : rowStart + 1);
    };
    let rowStart = fromRow;
    if (rowStart >= toRow) return;
    let rowEnd = planEnd(rowStart);
    let pending = ds.blob.slice(off[rowStart + ds0], off[rowEnd + ds0]).arrayBuffer();
    while (rowStart < toRow) {
      const buf = await pending;
      const curStart = rowStart, curEnd = rowEnd;
      rowStart = rowEnd;
      if (rowStart < toRow) {
        rowEnd = planEnd(rowStart);
        pending = ds.blob.slice(off[rowStart + ds0], off[rowEnd + ds0]).arrayBuffer();
      }
      yield { rowStart: curStart, rowEnd: curEnd, u8: new Uint8Array(buf), base: off[curStart + ds0] };
    }
  }

  // ---------- 행 조회 ----------
  async rows({ reqId, from, to }) {
    const ds = this.need();
    from = Math.max(0, from | 0);
    to = Math.min(ds.rowCount, to | 0);
    const out = [];
    if (to > from) {
      const a = ds.recordOffsets[from + ds.dataStart], b = ds.recordOffsets[to + ds.dataStart];
      const u8 = new Uint8Array(await ds.blob.slice(a, b).arrayBuffer());
      const text = ds.decoder.decode(u8);
      const fi = this.fi;
      scanFieldsString(text, ds.delimiter.charCodeAt(0), 34, fi);
      for (let k = 0; k < fi.nRec; k++) {
        const row = [];
        const f0 = fi.recFirst[k], c = fi.recCount[k];
        for (let j = 0; j < c; j++) row.push(fieldText(text, fi, f0 + j));
        out.push(row);
      }
    }
    this.post({ type: MSG.ROWS_RESULT, reqId, from, to, rows: out });
  }

  async recordBytes(rec) {
    const ds = this.need();
    return new Uint8Array(await ds.blob.slice(ds.recordOffsets[rec], ds.recordOffsets[rec + 1]).arrayBuffer());
  }

  async rowDetail({ reqId, row }) {
    const ds = this.need();
    if (row < 0 || row >= ds.rowCount) throw new Error('행 범위 밖');
    const rec = row + ds.dataStart;
    const start = ds.recordOffsets[rec];
    const u8 = await this.recordBytes(rec);
    const text = ds.decoder.decode(u8);
    const fi = this.fi;
    scanFieldsString(text, ds.delimiter.charCodeAt(0), 34, fi);
    const fields = [];
    if (fi.nRec > 0) for (let j = 0; j < fi.recCount[0]; j++) fields.push(fieldText(text, fi, fi.recFirst[0] + j));
    const br = scanRecordFieldsBytes(u8, ds.delimiter, ds.quote, ds.unitSize, ds.littleEndian);
    const ranges = [];
    for (let i = 0; i < br.count; i++) ranges.push({ start: start + br.starts[i], end: start + br.ends[i], quoted: (br.flags[i] & 1) === 1 });
    this.post({ type: MSG.ROW_DETAIL_RESULT, reqId, row, record: rec, start, end: start + br.recEnd, fields, ranges, fieldCount: ds.recordFieldCounts[rec] });
  }

  // ---------- 바이트 / 위치 ----------
  async bytes({ reqId, offset, length }) {
    const ds = this.need();
    offset = Math.max(0, Math.min(ds.size, Math.floor(Number(offset)) || 0));
    const end = Math.min(ds.size, offset + Math.max(0, Math.floor(Number(length)) || 0));
    const u8 = new Uint8Array(await ds.blob.slice(offset, end).arrayBuffer());
    const lines = Math.ceil(u8.length / 16);
    const records = new Int32Array(lines), cols = new Int32Array(lines);
    let curRec = -2, fields = null, recStart = 0;
    for (let L = 0; L < lines; L++) {
      const off = offset + L * 16;
      const rec = rowOfOffset(ds.recordOffsets, ds.recordCount, off);
      if (rec !== curRec) {
        curRec = rec; fields = null;
        if (rec >= 0) {
          recStart = ds.recordOffsets[rec];
          if (ds.recordOffsets[rec + 1] - recStart <= MAX_ANNOTATED_RECORD) {
            fields = scanRecordFieldsBytes(await this.recordBytes(rec), ds.delimiter, ds.quote, ds.unitSize, ds.littleEndian);
          }
        }
      }
      records[L] = rec;
      cols[L] = fields ? fieldAtByte(fields, off - recStart) : -1;
    }
    this.post({ type: MSG.BYTES_RESULT, reqId, offset, bytes: u8, records, cols });
  }

  async locate({ reqId, offset }) {
    const ds = this.need();
    const rec = rowOfOffset(ds.recordOffsets, ds.recordCount, offset);
    let col = -1, cellStart = -1, cellEnd = -1;
    if (rec >= 0 && ds.recordOffsets[rec + 1] - ds.recordOffsets[rec] <= MAX_ANNOTATED_RECORD) {
      const recStart = ds.recordOffsets[rec];
      const fields = scanRecordFieldsBytes(await this.recordBytes(rec), ds.delimiter, ds.quote, ds.unitSize, ds.littleEndian);
      col = fieldAtByte(fields, offset - recStart);
      if (col >= 0) { cellStart = recStart + fields.starts[col]; cellEnd = recStart + fields.ends[col]; }
    }
    const row = rec >= ds.dataStart ? rec - ds.dataStart : -1;
    this.post({ type: MSG.LOCATED, reqId, offset, record: rec, row, col, cellStart, cellEnd, isHeader: rec >= 0 && rec < ds.dataStart, isBom: offset < ds.bomLength });
  }

  // ---------- 패스 B: 프로파일 ----------
  async profile({ reqId, gen } = {}) {
    if (gen == null) gen = this.gen;
    // 이전 프로파일(다른 데이터셋일 수 있음)이 끝날 때까지 직렬화한다. 세대가 바뀌면 이전 것은 곧 종료된다.
    while (this.profilePromise) await this.profilePromise;
    if (gen !== this.gen) return;
    this.profilePromise = this.runProfile(reqId, gen).finally(() => { this.profilePromise = null; });
    return this.profilePromise;
  }

  async runProfile(reqId, gen) {
    const ds = this.need();
    this.profiling = true;
    try {
      const cols = ds.columnCount;
      const D = ds.delimiter.charCodeAt(0);
      const fi = new FieldIndex(1 << 16, 1 << 12);
      const rng = makeRng(0x1553);
      const distinctCap = Math.max(1000, Math.min(10000, Math.floor(200000 / Math.max(1, cols))));
      const reservoirSize = Math.max(2000, Math.min(10000, Math.floor(100000 / Math.max(1, cols))));

      // 임시 판정용 샘플 (첫 2000행)
      const sampleVals = Array.from({ length: cols }, () => []);
      {
        const n = Math.min(ds.rowCount, 2000);
        if (n > 0) {
          const a = ds.recordOffsets[ds.dataStart], b = ds.recordOffsets[n + ds.dataStart];
          const text = ds.decoder.decode(new Uint8Array(await ds.blob.slice(a, b).arrayBuffer()));
          if (gen !== this.gen) return;
          scanFieldsString(text, D, 34, fi);
          for (let k = 0; k < fi.nRec; k++) {
            const f0 = fi.recFirst[k], c = Math.min(fi.recCount[k], cols);
            for (let j = 0; j < c; j++) { const s = fi.fieldStart[f0 + j], e = fi.fieldEnd[f0 + j]; if (e > s) sampleVals[j].push(text.slice(s, e)); }
          }
        }
      }
      const profs = [];
      for (let c = 0; c < cols; c++) {
        const prov = provisionalForColumn(sampleVals[c]);
        profs.push(createColumnProfiler(c, ds.header[c], { distinctCap, reservoirSize, bareHex: prov.bareHex, smallDomain: prov.smallDomain, rng }));
      }

      let done = 0, lastReport = 0;
      const total = ds.size;
      for await (const blk of this.rowBlocks(0, ds.rowCount)) {
        if (gen !== this.gen) return;
        await this.yieldToPriority(gen);
        if (gen !== this.gen) return;
        const text = ds.decoder.decode(blk.u8);
        scanFieldsString(text, D, 34, fi);
        const nRec = Math.min(fi.nRec, blk.rowEnd - blk.rowStart);
        for (let k = 0; k < nRec; k++) {
          const row = blk.rowStart + k;
          const f0 = fi.recFirst[k], fc = fi.recCount[k];
          const lim = fc < cols ? fc : cols;
          for (let c = 0; c < lim; c++) { const f = f0 + c; profs[c].add(text, fi.fieldStart[f], fi.fieldEnd[f], fi.fieldFlags[f], row); }
          for (let c = lim; c < cols; c++) profs[c].addMissing();
        }
        done += blk.u8.length;
        if (done - lastReport >= (16 << 20)) {
          lastReport = done;
          this.post({ type: MSG.PROFILE_PROGRESS, done, total, rows: blk.rowEnd });
        }
      }
      if (gen !== this.gen) return;

      const stats = [];
      const hexLike = new Uint8Array(cols);
      const padNibbles = new Uint8Array(cols);
      let wordFreq = null;
      for (let c = 0; c < cols; c++) {
        const { stats: st, counter } = profs[c].finalize();
        stats.push(st);
        hexLike[c] = st.hexLike ? 1 : 0;
        padNibbles[c] = st.hexLike ? Math.min(255, st.hexNibblesMax) : 0;
        if (st.hexLike && counter) {
          if (!wordFreq) wordFreq = new Uint32Array(65536);
          for (let v = 0; v < 65536; v++) wordFreq[v] += counter[v];
        }
      }
      ds.stats = stats;
      ds.hexLike = hexLike;
      ds.padNibbles = padNibbles;
      ds.wordFreq = wordFreq;
      let wordTop = [];
      if (wordFreq) {
        const items = [];
        for (let v = 0; v < 65536; v++) if (wordFreq[v]) items.push([v, wordFreq[v]]);
        wordTop = topN(items, 50).map(([v, n]) => ({ value: '0x' + v.toString(16).toUpperCase().padStart(4, '0'), word: v, count: n }));
      }
      this.post({
        type: MSG.PROFILED, reqId, stats, wordTop,
        hexLike: hexLike.slice(), padNibbles: padNibbles.slice(),
        fieldCountHist: ds.fieldCountHist ? ds.fieldCountHist.slice() : new Uint32Array(0),
        rowCount: ds.rowCount, columnCount: cols,
      });
    } finally {
      this.profiling = false;
    }
  }

  // ---------- 검색 ----------
  cancel({ id }) {
    if (!id || this.activeSearch === id) this.activeSearch = 0;
    if (!id || this.activeGroup === id) this.activeGroup = 0;
  }

  async search({ query }) {
    const ds = this.need();
    const id = query.id;
    const gen = this.gen;
    this.activeSearch = id;
    this.beginPriority();
    const t0 = Date.now();
    try {
      if (query.kind === 'bytes') { await this.searchBytes(query, gen); return; }
      const cols = ds.columnCount;
      const D = ds.delimiter.charCodeAt(0);
      const matcher = compileCellMatcher(query, { columnCount: cols, hexLike: ds.hexLike, padNibbles: ds.padNibbles, header: ds.header });
      const filterFn = compileFilter(query.filter, { hexLike: ds.hexLike });
      const fi = new FieldIndex(1 << 16, 1 << 12);
      const B = 1024;
      const rowCount = ds.rowCount;
      const rowHist = new Uint32Array(B);
      const colCounts = new Uint32Array(cols);
      const rowColHist = cols <= 64 ? new Uint32Array(B * cols) : null;
      const CAP = 100000;
      let cap = 4096;
      let rows = new Uint32Array(cap), c0 = new Uint16Array(cap), c1 = new Uint16Array(cap), aa = new Uint16Array(cap), bb = new Uint16Array(cap);
      let n = 0, total = 0, sent = 0, passed = 0, scannedRows = 0;
      const scale = rowCount > 0 ? B / rowCount : 0;
      const sink = {
        push(row, cs, ce, a, b) {
          total++;
          const bucket = Math.min(B - 1, Math.floor(row * scale));
          rowHist[bucket]++;
          for (let c = cs; c <= ce; c++) colCounts[c]++;
          if (rowColHist) rowColHist[bucket * cols + cs]++;
          if (n >= CAP) return;
          if (n === cap) {
            cap *= 2;
            const r2 = new Uint32Array(cap); r2.set(rows); rows = r2;
            const s2 = new Uint16Array(cap); s2.set(c0); c0 = s2;
            const e2 = new Uint16Array(cap); e2.set(c1); c1 = e2;
            const a2 = new Uint16Array(cap); a2.set(aa); aa = a2;
            const b2 = new Uint16Array(cap); b2.set(bb); bb = b2;
          }
          rows[n] = row; c0[n] = cs; c1[n] = ce; aa[n] = a > 65535 ? 65535 : a; bb[n] = b > 65535 ? 65535 : b; n++;
        },
      };
      const flush = (done) => {
        this.post({
          type: MSG.SEARCH_BATCH, id, done,
          rows: rows.slice(sent, n), colStart: c0.slice(sent, n), colEnd: c1.slice(sent, n), a: aa.slice(sent, n), b: bb.slice(sent, n),
          rowHist: rowHist.slice(), colCounts: colCounts.slice(), rowColHist: rowColHist ? rowColHist.slice() : null,
          matchesTotal: total, stored: n, rowsScanned: scannedRows, rowsPassed: passed, rowCount,
        });
        sent = n;
      };
      let lastBatch = Date.now();
      for await (const blk of this.rowBlocks(0, rowCount)) {
        if (this.activeSearch !== id || gen !== this.gen) {
          this.post({ type: MSG.SEARCH_DONE, id, cancelled: true, matchesTotal: total, stored: n });
          return;
        }
        const text = ds.decoder.decode(blk.u8);
        scanFieldsString(text, D, 34, fi);
        matcher.prepare(text);
        passed += searchBlock(text, fi, blk.rowStart, matcher, filterFn, sink, blk.rowEnd - blk.rowStart);
        scannedRows = blk.rowEnd;
        const now = Date.now();
        if (now - lastBatch >= 250) {
          lastBatch = now;
          flush(false);
          this.post({ type: MSG.SEARCH_PROGRESS, id, done: blk.rowEnd, total: rowCount, matchesTotal: total });
        }
      }
      if (this.activeSearch !== id || gen !== this.gen) { this.post({ type: MSG.SEARCH_DONE, id, cancelled: true, matchesTotal: total, stored: n }); return; }
      flush(true);
      this.post({
        type: MSG.SEARCH_DONE, id, cancelled: false, matchesTotal: total, stored: n, rowsPassed: passed, rowsScanned: scannedRows,
        elapsed: Date.now() - t0, scope: matcher.scope ? Array.from(matcher.scope) : null, kind: matcher.kind,
      });
    } catch (e) {
      this.post({ type: MSG.SEARCH_ERROR, id, message: (e && e.message) || String(e) });
    } finally {
      if (this.activeSearch === id) this.activeSearch = 0;
      this.endPriority();
    }
  }

  async searchBytes(query, gen) {
    const ds = this.need();
    const id = query.id;
    const { bytes, mask, anchor } = parseByteNeedle(query.pattern);
    const L = bytes.length;
    const C = 8 << 20;
    const size = ds.size, B = 1024;
    const byteHist = new Uint32Array(B), rowHist = new Uint32Array(B);
    const CAP = 100000;
    let cap = 4096, offsets = new Uint32Array(cap), n = 0, total = 0, sent = 0;
    const bScale = size > 0 ? B / size : 0, rScale = ds.rowCount > 0 ? B / ds.rowCount : 0;
    const t0 = Date.now();
    let lastBatch = t0;
    const flush = (done, bytesDone) => {
      this.post({
        type: MSG.SEARCH_BATCH, id, kind: 'bytes', done, offsets: offsets.slice(sent, n),
        byteHist: byteHist.slice(), rowHist: rowHist.slice(), matchesTotal: total, stored: n, bytesDone, size, needleLength: L, rowCount: ds.rowCount,
      });
      sent = n;
    };
    let pos = 0;
    let pending = size > 0 ? ds.blob.slice(0, Math.min(size, C + L - 1)).arrayBuffer() : null;
    while (pos < size) {
      if (this.activeSearch !== id || gen !== this.gen) { this.post({ type: MSG.SEARCH_DONE, id, kind: 'bytes', cancelled: true, matchesTotal: total, stored: n }); return; }
      const buf = await pending;
      const nextPos = pos + C;
      pending = nextPos < size ? ds.blob.slice(nextPos, Math.min(size, nextPos + C + L - 1)).arrayBuffer() : null;
      const hay = new Uint8Array(buf);
      const limit = Math.min(hay.length, C); // 이 청크에서 시작하는 매치만
      findMasked(hay, bytes, mask, anchor, 0, hay.length, (k) => {
        if (k >= limit) return;
        const off = pos + k;
        total++;
        byteHist[Math.min(B - 1, Math.floor(off * bScale))]++;
        const rec = rowOfOffset(ds.recordOffsets, ds.recordCount, off);
        if (rec >= ds.dataStart) rowHist[Math.min(B - 1, Math.floor((rec - ds.dataStart) * rScale))]++;
        if (n >= CAP) return;
        if (n === cap) { cap *= 2; const o2 = new Uint32Array(cap); o2.set(offsets); offsets = o2; }
        offsets[n++] = off;
      });
      pos = nextPos;
      const now = Date.now();
      if (now - lastBatch >= 250) {
        lastBatch = now;
        flush(false, Math.min(pos, size));
        this.post({ type: MSG.SEARCH_PROGRESS, id, done: Math.min(pos, size), total: size, matchesTotal: total });
      }
    }
    if (this.activeSearch !== id || gen !== this.gen) { this.post({ type: MSG.SEARCH_DONE, id, kind: 'bytes', cancelled: true, matchesTotal: total, stored: n }); return; }
    flush(true, size);
    this.post({ type: MSG.SEARCH_DONE, id, kind: 'bytes', cancelled: false, matchesTotal: total, stored: n, elapsed: Date.now() - t0, needleLength: L });
  }

  /** 여러 오프셋을 한 번에 행/열로. items: [{ offset, record, row, col, colName, cellStart, cellEnd, preview }] */
  async locateMany({ reqId, offsets, previewLength = 16 }) {
    const ds = this.need();
    const items = [];
    let curRec = -2, fields = null, recStart = 0;
    for (const offset of offsets) {
      const rec = rowOfOffset(ds.recordOffsets, ds.recordCount, offset);
      if (rec !== curRec) {
        curRec = rec; fields = null;
        if (rec >= 0 && ds.recordOffsets[rec + 1] - ds.recordOffsets[rec] <= MAX_ANNOTATED_RECORD) {
          recStart = ds.recordOffsets[rec];
          fields = scanRecordFieldsBytes(await this.recordBytes(rec), ds.delimiter, ds.quote, ds.unitSize, ds.littleEndian);
        }
      }
      const col = fields ? fieldAtByte(fields, offset - recStart) : -1;
      const row = rec >= ds.dataStart ? rec - ds.dataStart : -1;
      const pv = new Uint8Array(await ds.blob.slice(offset, Math.min(ds.size, offset + previewLength)).arrayBuffer());
      let preview = '';
      for (let i = 0; i < pv.length; i++) preview += (i ? ' ' : '') + pv[i].toString(16).toUpperCase().padStart(2, '0');
      items.push({
        offset, record: rec, row, col, colName: col >= 0 ? ds.header[col] : null,
        cellStart: col >= 0 ? recStart + fields.starts[col] : -1, cellEnd: col >= 0 ? recStart + fields.ends[col] : -1,
        isHeader: rec >= 0 && rec < ds.dataStart, preview,
      });
    }
    this.post({ type: MSG.LOCATE_MANY_RESULT, reqId, items });
  }

  /** items: [{ row, cols: number[] }] → texts: [string[] | null] */
  async cells({ reqId, items }) {
    const ds = this.need();
    const D = ds.delimiter.charCodeAt(0);
    const fi = this.fi;
    const out = [];
    for (const it of items) {
      if (it.row < 0 || it.row >= ds.rowCount) { out.push(null); continue; }
      const text = ds.decoder.decode(await this.recordBytes(it.row + ds.dataStart));
      scanFieldsString(text, D, 34, fi);
      const fc = fi.nRec > 0 ? fi.recCount[0] : 0, f0 = fi.nRec > 0 ? fi.recFirst[0] : 0;
      out.push(it.cols.map((c) => (c < fc ? fieldText(text, fi, f0 + c) : undefined)));
    }
    this.post({ type: MSG.CELLS_RESULT, reqId, texts: out });
  }

  // ---------- 그룹 집계 ----------
  async groupBy({ reqId, id, cols, filter }) {
    const ds = this.need();
    cols = (cols || []).map(Number).filter((c) => c >= 0 && c < ds.columnCount).slice(0, 3);
    if (!cols.length) throw new Error('집계할 열을 선택하세요');
    const gen = this.gen;
    this.activeGroup = id || reqId;
    const myId = this.activeGroup;
    this.beginPriority();
    const t0 = Date.now();
    try {
      const D = ds.delimiter.charCodeAt(0);
      const filterFn = compileFilter(filter, { hexLike: ds.hexLike });
      const counter = createGroupCounter(10000);
      const fi = new FieldIndex(1 << 16, 1 << 12);
      const parts = new Array(cols.length);
      let lastReport = Date.now(), passed = 0;
      for await (const blk of this.rowBlocks(0, ds.rowCount)) {
        if (gen !== this.gen || this.activeGroup !== myId) { this.post({ type: MSG.GROUP_BY_RESULT, reqId, id: myId, cancelled: true }); return; }
        const text = ds.decoder.decode(blk.u8);
        scanFieldsString(text, D, 34, fi);
        const nRec = Math.min(fi.nRec, blk.rowEnd - blk.rowStart);
        for (let k = 0; k < nRec; k++) {
          if (filterFn && !filterFn(text, fi, k)) continue;
          passed++;
          const f0 = fi.recFirst[k], fc = fi.recCount[k];
          for (let j = 0; j < cols.length; j++) {
            const c = cols[j];
            if (c >= fc) { parts[j] = '(없음)'; continue; }
            const [s, e] = trimSpan(text, fi.fieldStart[f0 + c], fi.fieldEnd[f0 + c]);
            parts[j] = e > s ? text.slice(s, e) : '(빈 값)';
          }
          counter.add(parts);
        }
        const now = Date.now();
        if (now - lastReport >= 250) { lastReport = now; this.post({ type: MSG.GROUP_BY_PROGRESS, reqId, id: myId, done: blk.rowEnd, total: ds.rowCount }); }
      }
      if (gen !== this.gen) return;
      const r = counter.result();
      this.post({ type: MSG.GROUP_BY_RESULT, reqId, id: myId, cols, header: cols.map((c) => ds.header[c]), groups: r.groups, total: r.total, otherCount: r.otherCount, capped: r.capped, distinct: r.distinct, rowsPassed: passed, elapsed: Date.now() - t0 });
    } finally {
      if (this.activeGroup === myId) this.activeGroup = 0;
      this.endPriority();
    }
  }
}
return { Engine };
})();

// ===== src/main/worker-client.js =====
const M_main_worker_client = (() => {
const { Engine } = M_worker_engine;
const { transferablesOf, MSG } = M_shared_protocol;
// Blob 워커 생성 + 요청/응답 상관. 워커 생성이 실패하면 같은 Engine 을 메인 스레드에서 실행한다.



function createWorkerClient(onEvent, { forceFallback = false, handshakeMs = 3000 } = {}) {
  const pending = new Map();
  let nextId = 1;
  let worker = null;
  let engine = null;
  let dead = false;

  function dispatch(msg) {
    if (!msg || dead) return;
    if (msg.reqId != null && pending.has(msg.reqId)) {
      const p = pending.get(msg.reqId);
      pending.delete(msg.reqId);
      if (msg.type === MSG.ERROR) p.reject(new Error(msg.message || '오류'));
      else p.resolve(msg);
      return;
    }
    onEvent(msg);
  }
  function useFallback() {
    if (worker) { try { worker.terminate(); } catch { /* ignore */ } worker = null; }
    engine = new Engine((m) => queueMicrotask(() => dispatch(m)));
  }
  function post(msg) {
    if (engine) engine.handle(msg);
    else worker.postMessage(msg, transferablesOf(msg));
  }

  const ready = new Promise((resolve) => {
    if (forceFallback || typeof Worker === 'undefined') { useFallback(); resolve(); return; }
    let settled = false;
    const settle = (fn) => { if (settled) return; settled = true; fn(); resolve(); };
    try {
      const src = document.getElementById('worker-src').textContent;
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      worker = new Worker(url);
      URL.revokeObjectURL(url);
      const timer = setTimeout(() => settle(useFallback), handshakeMs);
      worker.onmessage = (ev) => {
        if (!settled) {
          if (ev.data && ev.data.type === MSG.PONG) { clearTimeout(timer); settle(() => {}); return; }
        }
        dispatch(ev.data);
      };
      worker.onerror = (e) => {
        if (!settled) { clearTimeout(timer); settle(useFallback); return; }
        onEvent({ type: MSG.ERROR, message: '워커 오류: ' + (e && e.message ? e.message : '') });
      };
      worker.postMessage({ type: MSG.PING });
    } catch {
      settle(useFallback);
    }
  });

  return {
    ready,
    get isFallback() { return engine !== null; },
    async request(type, payload = {}) {
      await ready;
      if (dead) throw new Error('클라이언트가 종료되었습니다');
      const reqId = nextId++;
      return new Promise((resolve, reject) => {
        pending.set(reqId, { resolve, reject });
        post({ ...payload, type, reqId });
      });
    },
    async send(type, payload = {}) {
      await ready;
      if (dead) return;
      post({ ...payload, type });
    },
    terminate() {
      dead = true;
      if (worker) { try { worker.terminate(); } catch { /* ignore */ } worker = null; }
      if (engine) { engine.clear(); engine = null; }
      for (const p of pending.values()) p.reject(new Error('종료됨'));
      pending.clear();
    },
  };
}
return { createWorkerClient };
})();

// ===== src/main/row-cache.js =====
const M_main_row_cache = (() => {
const { MSG } = M_shared_protocol;
// rows 요청 위의 페이지 LRU 캐시.


function createRowCache(client, { pageSize = 128, maxPages = 64 } = {}) {
  const pages = new Map();     // pageNo -> string[][]
  const inflight = new Set();
  const listeners = new Set();
  let gen = 0;

  function fetchPage(p) {
    if (inflight.has(p)) return;
    inflight.add(p);
    const myGen = gen;
    const from = p * pageSize;
    client.request(MSG.ROWS, { from, to: from + pageSize }).then((msg) => {
      inflight.delete(p);
      if (myGen !== gen) return;
      pages.set(p, msg.rows);
      while (pages.size > maxPages) pages.delete(pages.keys().next().value);
      for (const fn of listeners) fn(p);
    }).catch(() => { inflight.delete(p); });
  }

  return {
    pageSize,
    /** 동기 조회. 없으면 undefined 를 돌려주고 페이지를 요청한다. */
    getRow(r) {
      const p = Math.floor(r / pageSize);
      const page = pages.get(p);
      if (page) {
        pages.delete(p); pages.set(p, page); // LRU 갱신
        return page[r - p * pageSize];
      }
      fetchPage(p);
      return undefined;
    },
    has(r) { return pages.has(Math.floor(r / pageSize)); },
    prefetch(r) { const p = Math.floor(r / pageSize); if (!pages.has(p)) fetchPage(p); },
    onPage(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    invalidate() { gen++; pages.clear(); inflight.clear(); },
  };
}
return { createRowCache };
})();

const M_main_store = (() => {
function createStore(initial) {
  let state = { ...initial };
  const subs = new Set();
  return {
    get: () => state,
    set(patch) {
      state = { ...state, ...patch };
      for (const fn of subs) fn(state, patch);
    },
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    reset() { state = { ...initial }; for (const fn of subs) fn(state, state); },
  };
}
return { createStore };
})();

// ===== src/main/ui/dom.js =====
const M_main_ui_dom = (() => {
// 작은 DOM 헬퍼. style 속성 문자열은 쓰지 않는다 (해시 CSP). style 은 객체로 받아 CSSOM 으로 적용.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { append(el, c); continue; }
    el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

function select(options, value) {
  const el = h('select', { class: 'select' });
  for (const [v, label] of options) el.appendChild(h('option', { value: v, text: label }));
  if (value != null) el.value = value;
  return el;
}

/** 세그먼트 버튼 그룹. onChange(value) */
function segmented(options, value, onChange) {
  const el = h('div', { class: 'seg' });
  const btns = options.map(([v, label, title]) => {
    const b = h('button', { type: 'button', text: label, title, dataset: { value: v } });
    b.addEventListener('click', () => { set(v); onChange && onChange(v); });
    el.appendChild(b);
    return b;
  });
  let cur = value;
  function set(v) { cur = v; for (const b of btns) b.classList.toggle('is-active', b.dataset.value === String(v)); }
  set(value);
  return { el, get value() { return cur; }, set };
}

function mark(text, start, end) {
  if (start == null || end == null || start < 0 || end <= start || end > text.length) return [text];
  return [text.slice(0, start), h('mark', { text: text.slice(start, end) }), text.slice(end)];
}
return { h, append, clear, $, $$, select, segmented, mark };
})();

// ===== src/main/ui/virtual-list.js =====
const M_main_ui_virtual_list = (() => {
const { h } = M_main_ui_dom;
// 가상 스크롤 리스트. 스페이서 높이 상한 + 비례 매핑으로 수백만 행을 지원한다.


const MAX_SPACER = 8000000;

function createVirtualList({ container, rowHeight, overscan = 6, render, onRangeChange, rowClass = 'vlist__row' }) {
  container.classList.add('vlist');
  const spacer = h('div', { class: 'vlist__spacer' });
  const body = h('div', { class: 'vlist__body' });
  container.appendChild(spacer);
  container.appendChild(body);
  let count = 0, rowWidth = 0;
  const pool = [];
  let first = 0, last = -1, raf = 0;

  const spacerHeight = () => Math.min(count * rowHeight, MAX_SPACER);
  const capped = () => count * rowHeight > MAX_SPACER;

  function layout() {
    raf = 0;
    const vh = container.clientHeight;
    const st = container.scrollTop;
    const visible = Math.max(1, Math.ceil(vh / rowHeight) + 1);
    let f, sub;
    if (!capped()) {
      f = Math.floor(st / rowHeight);
      sub = st - f * rowHeight;
    } else {
      const maxScroll = Math.max(1, spacerHeight() - vh);
      const ratio = Math.min(1, st / maxScroll);
      f = Math.round(ratio * Math.max(0, count - visible + 1));
      sub = 0;
    }
    f = Math.max(0, Math.min(f, Math.max(0, count - 1)));
    const start = Math.max(0, f - overscan);
    const end = Math.min(count, f + visible + overscan);
    body.style.transform = `translateY(${st}px)`;
    const need = Math.max(0, end - start);
    while (pool.length < need) {
      const el = h('div', { class: rowClass });
      body.appendChild(el);
      pool.push(el);
    }
    for (let i = 0; i < pool.length; i++) {
      const el = pool[i];
      if (i < need) {
        const idx = start + i;
        el.style.display = '';
        el.style.top = `${(idx - f) * rowHeight - sub}px`;
        if (rowWidth) el.style.width = rowWidth + 'px';
        el.dataset.idx = idx;
        render(idx, el);
      } else {
        el.style.display = 'none';
      }
    }
    const newLast = Math.min(count - 1, f + visible - 1);
    const changed = f !== first || newLast !== last;
    first = f; last = newLast;
    if (changed && onRangeChange) onRangeChange(first, last);
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(layout); }
  container.addEventListener('scroll', schedule);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(schedule).observe(container);

  return {
    element: container,
    body,
    get count() { return count; },
    setCount(n) {
      count = Math.max(0, n | 0);
      spacer.style.height = spacerHeight() + 'px';
      if (container.scrollTop > spacerHeight()) container.scrollTop = 0;
      schedule();
    },
    setRowWidth(w) {
      rowWidth = w || 0;
      body.style.width = w ? w + 'px' : '';
      spacer.style.width = w ? w + 'px' : '1px';
      schedule();
    },
    refresh: schedule,
    layoutNow: layout,
    /** 풀에 남은 행 요소(이전 데이터 텍스트 포함)를 제거 */
    clearPool() { for (const el of pool) el.remove(); pool.length = 0; first = 0; last = -1; },
    scrollToIndex(i, align = 'center') {
      i = Math.max(0, Math.min(count - 1, i | 0));
      const vh = container.clientHeight;
      const visible = Math.max(1, Math.ceil(vh / rowHeight));
      let target;
      if (!capped()) {
        target = i * rowHeight - (align === 'center' ? Math.max(0, (vh - rowHeight) / 2) : 0);
      } else {
        const maxScroll = spacerHeight() - vh;
        const f = align === 'center' ? i - Math.floor(visible / 2) : i;
        const denom = Math.max(1, count - visible + 1);
        target = (Math.max(0, Math.min(f, denom)) / denom) * maxScroll;
      }
      container.scrollTop = Math.max(0, target);
      layout();

    visibleRange() { return { first, last }; },
    isVisible(i) { return i >= first && i <= last; },
  };

})();

// ===== src/main/ui/table.js =====
const M_main_ui_table = (() => {
const { h, clear } = M_main_ui_dom;
const { createVirtualList } = M_main_ui_virtual_list;
// 가상 스크롤 표. 행은 지연 로딩(getRow 가 undefined 를 돌려주면 로딩 중).



const ROW_H = 28, IDX_W = 72, MIN_W = 56, MAX_W = 360;

function displayText(v) {
  return v.indexOf('\n') >= 0 || v.indexOf('\r') >= 0 ? v.replace(/\r\n|\r|\n/g, '⏎') : v;
}

function createTable({ container, onCellClick, onHeaderClick, onRangeChange }) {
  const headInner = h('div', { class: 'table__headrow' });
  const head = h('div', { class: 'table__head' }, headInner);
  const bodyWrap = h('div', { class: 'table__body' });
  const empty = h('div', { class: 'table__empty', text: '왼쪽에서 CSV 파일을 열거나 내용을 붙여넣으세요.' });
  const root = h('div', { class: 'table' }, head, bodyWrap, empty);
  container.appendChild(root);

  let ds = null, widths = [], totalWidth = 0, getRow = () => undefined;
  let highlightFn = null, selected = null, headCells = [];

  const vl = createVirtualList({ container: bodyWrap, rowHeight: ROW_H, render: renderRow, onRangeChange });
  bodyWrap.addEventListener('scroll', () => { head.scrollLeft = bodyWrap.scrollLeft; });
  bodyWrap.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell || !ds) return;
    const row = Number(cell.parentElement.dataset.idx), col = Number(cell.dataset.col);
    if (Number.isNaN(row) || col < 0) return;
    if (onCellClick) onCellClick(row, col);
  });
  head.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell || !ds) return;
    const col = Number(cell.dataset.col);
    if (col >= 0 && onHeaderClick) onHeaderClick(col);
  });

  function computeWidths(header, sampleRows, cols) {
    const w = new Array(cols);
    for (let c = 0; c < cols; c++) {
      let m = (header[c] || '').length;
      for (const r of sampleRows) { const v = r[c]; if (v != null && v.length > m) m = Math.min(v.length, 60); }
      w[c] = Math.max(MIN_W, Math.min(MAX_W, Math.round(m * 7.4 + 18)));
    }
    return w;
  }

  function buildCells(el, cols) {
    clear(el);
    const idx = h('div', { class: 'cell cell--idx', dataset: { col: -1 } });
    idx.style.width = IDX_W + 'px';
    el.appendChild(idx);
    for (let c = 0; c < cols; c++) {
      const cell = h('div', { class: 'cell', dataset: { col: c } });
      cell.style.width = widths[c] + 'px';
      el.appendChild(cell);
    }
  }

  function renderRow(idx, el) {
    const cols = ds.columnCount;
    if (el.childElementCount !== cols + 1) buildCells(el, cols);
    const row = getRow(idx);
    const hl = highlightFn ? highlightFn(idx) : null;
    const children = el.children;
    children[0].textContent = String(idx + 1);
    el.classList.toggle('is-selected', !!selected && selected.row === idx);
    for (let c = 0; c < cols; c++) {
      const cell = children[c + 1];
      const v = row ? row[c] : undefined;
      let cls = 'cell';
      if (c >= ds.schemaCount) cls += ' col--extra';
      if (row && v === undefined) cls += ' cell--missing';
      if (hl && hl.has(c)) cls += ' cell--hl';
      if (selected && selected.row === idx && selected.col === c) cls += ' cell--sel';
      if (cell.className !== cls) cell.className = cls;
      const text = row ? (v === undefined ? '' : displayText(v)) : '…';
      if (cell.textContent !== text) cell.textContent = text;
      if (v !== undefined && v.length > 20) cell.title = v;
      else if (cell.hasAttribute('title')) cell.removeAttribute('title');
    }
  }

  function buildHead() {
    clear(headInner);
    headCells = [];
    const idx = h('div', { class: 'cell cell--idx', text: '#', dataset: { col: -1 } });
    idx.style.width = IDX_W + 'px';
    headInner.appendChild(idx);
    for (let c = 0; c < ds.columnCount; c++) {
      const bar = h('div', { class: 'bar' });
      bar.style.display = 'none';
      const cell = h('div', { class: 'cell' + (c >= ds.schemaCount ? ' col--extra' : ''), dataset: { col: c }, title: ds.header[c] },
        h('span', { class: 'name', text: ds.header[c] }), bar);
      cell.style.width = widths[c] + 'px';
      headInner.appendChild(cell);
      headCells.push(cell);
    }
    headInner.style.width = totalWidth + 'px';
  }

  return {
    setDataset({ header, columnCount, schemaCount, rowCount, getRow: g, sampleRows = [] }) {
      ds = { header, columnCount, schemaCount, rowCount };
      getRow = g;
      widths = computeWidths(header, sampleRows, columnCount);
      totalWidth = IDX_W + widths.reduce((a, b) => a + b, 0);
      highlightFn = null; selected = null;
      buildHead();
      empty.classList.add('is-hidden');
      vl.setRowWidth(totalWidth);
      vl.setCount(rowCount);
      bodyWrap.scrollTop = 0;
      vl.layoutNow();
    },
    clear() {
      ds = null; getRow = () => undefined; highlightFn = null; selected = null;
      clear(headInner); headCells = [];
      vl.setCount(0);
      vl.clearPool();
      empty.classList.remove('is-hidden');
    },
    refresh() { vl.refresh(); },
    get dataset() { return ds; },
    scrollToRow(r, align = 'center') { vl.scrollToIndex(r, align); },
    scrollToCol(c) {
      if (!ds || c < 0 || c >= widths.length) return;
      let x = IDX_W;
      for (let i = 0; i < c; i++) x += widths[i];
      const vw = bodyWrap.clientWidth;
      if (x < bodyWrap.scrollLeft + IDX_W || x + widths[c] > bodyWrap.scrollLeft + vw) bodyWrap.scrollLeft = Math.max(0, x - vw / 2 + widths[c] / 2);
    },
    setHighlights(fn) { highlightFn = fn; vl.refresh(); },
    select(row, col) { selected = row == null ? null : { row, col }; vl.refresh(); },
    setColCounts(arr) {
      if (!ds) return;
      let max = 0;
      if (arr) for (let c = 0; c < arr.length; c++) if (arr[c] > max) max = arr[c];
      for (let c = 0; c < headCells.length; c++) {
        const bar = headCells[c].lastChild;
        const v = arr && c < arr.length ? arr[c] : 0;
        if (!v) { bar.style.display = 'none'; headCells[c].title = ds.header[c]; continue; }
        bar.style.display = '';
        bar.style.transform = `scaleX(${(v / max).toFixed(3)})`;
        headCells[c].title = `${ds.header[c]} — 매치 ${v.toLocaleString('ko-KR')}건`;
      }
    },
    visibleRange() { return vl.visibleRange(); },
  };
}
return { createTable };
})();

// ===== src/main/format.js =====
const M_main_format = (() => {
function fmtInt(n) {
  return Number(n).toLocaleString('ko-KR');
}
function fmtBytes(n) {
  if (n < 1024) return fmtInt(n) + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  let v = n;
  do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
  return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + ' ' + units[i];
}
function fmtNum(x, digits = 4) {
  if (x == null || Number.isNaN(x)) return '-';
  if (Number.isInteger(x) && Math.abs(x) < 1e15) return fmtInt(x);
  const a = Math.abs(x);
  if (a !== 0 && (a < 1e-4 || a >= 1e15)) return x.toExponential(3);
  return Number(x.toFixed(digits)).toLocaleString('ko-KR', { maximumFractionDigits: digits });
}
function fmtPct(frac, digits = 1) {
  if (frac == null || Number.isNaN(frac)) return '-';
  return (frac * 100).toFixed(digits) + '%';
}
function hex2(b) { return b.toString(16).toUpperCase().padStart(2, '0'); }
function hexOffset(n) { return n.toString(16).toUpperCase().padStart(8, '0'); }
function fmtDuration(ms) { return ms < 1000 ? Math.round(ms) + 'ms' : (ms / 1000).toFixed(1) + 's'; }
return { fmtInt, fmtBytes, fmtNum, fmtPct, hex2, hexOffset, fmtDuration };
})();

// ===== src/main/ui/charts.js =====
const M_main_ui_charts = (() => {
const { h } = M_main_ui_dom;
const { fmtInt, fmtNum } = M_main_format;
// 캔버스 차트 헬퍼. 색은 CSS 토큰에서 읽는다 (라이트/다크 모두 선택된 값).



function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function setupCanvas(canvas, w, h2) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h2 * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h2);
  return ctx;
}

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex.trim());
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128];
}
/** 순차 램프 (한 색상, 밝음→어두움; 다크 모드에서는 표면→밝음). t∈[0,1] */
function seqColor(t) {
  const stops = [cssVar('--viz-seq-lo'), cssVar('--viz-seq-mid'), cssVar('--viz-seq-hi')].map(hexToRgb);
  t = Math.max(0, Math.min(1, t));
  const x = t * 2, i = Math.min(1, Math.floor(x)), f = x - i;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
}

function roundTopRect(ctx, x, y, w, hh, r) {
  r = Math.min(r, w / 2, hh);
  ctx.beginPath();
  ctx.moveTo(x, y + hh);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + hh);
  ctx.closePath();
  ctx.fill();
}

/**
 * 기준선에서 자라는 세로 막대. counts: 배열, 2px 표면 간격, 4px 둥근 데이터 끝, 막대 두께 ≤ 24px.
 * 반환: 막대 x 범위 (hover 용).
 */
function drawColumns(ctx, counts, { x0, y0, width, height, color, gap = 2, maxBarW = 24, radius = 4, baseline = true, highlight = -1, highlightColor }) {
  const n = counts.length;
  if (!n) return [];
  let max = 0;
  for (let i = 0; i < n; i++) if (counts[i] > max) max = counts[i];
  const slot = width / n;
  const barW = Math.max(1, Math.min(maxBarW, slot - gap));
  const pad = (slot - barW) / 2;
  const rects = [];
  if (baseline) {
    ctx.strokeStyle = cssVar('--viz-axis');
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + height + 0.5); ctx.lineTo(x0 + width, y0 + height + 0.5); ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const v = counts[i];
    const x = x0 + i * slot + pad;
    const hh = max ? Math.max(v > 0 ? 1 : 0, (v / max) * height) : 0;
    rects.push([x, x + barW]);
    if (!hh) continue;
    ctx.fillStyle = i === highlight && highlightColor ? highlightColor : color;
    roundTopRect(ctx, x, y0 + height - hh, barW, hh, radius);
  }
  return rects;
}

/** 작은 스파크라인 히스토그램 (카드). hover 시 title 로 범위/건수 */
function sparkline(canvas, hist, { width = 200, height = 32 } = {}) {
  const ctx = setupCanvas(canvas, width, height);
  const rects = drawColumns(ctx, Array.from(hist.counts), { x0: 0, y0: 2, width, height: height - 4, color: cssVar('--viz-seq-hi'), gap: 2, radius: 2, baseline: true });
  canvas.onmousemove = (e) => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (width / r.width);
    const i = rects.findIndex(([a, b]) => x >= a - 1 && x <= b + 1);
    canvas.title = i >= 0 ? `${fmtNum(hist.edges[i])} ~ ${fmtNum(hist.edges[i + 1])}: ${fmtInt(hist.counts[i])}건` : '';
  };
}

/**
 * 히스토그램 + 축 라벨 + hover 툴팁. wrapper 에 canvas 와 tooltip 을 넣는다.
 * labelFor(i) → 툴팁 텍스트, axisLabels: [left, right]
 */
function histogramChart(wrapper, counts, { height = 160, labelFor, axisLabels = [], color, highlight = -1 }) {
  wrapper.classList.add('chart');
  const canvas = h('canvas', { class: 'hist' });
  const tip = h('div', { class: 'chart__tip is-hidden' });
  wrapper.replaceChildren(canvas, tip);
  const draw = () => {
    const width = Math.max(120, wrapper.clientWidth || 300);
    const ctx = setupCanvas(canvas, width, height);
    canvas.style.height = height + 'px';
    const padB = axisLabels.length ? 16 : 4;
    const rects = drawColumns(ctx, counts, { x0: 0, y0: 4, width, height: height - padB - 4, color: color || cssVar('--viz-seq-hi'), highlight, highlightColor: cssVar('--viz-2') });
    if (axisLabels.length) {
      ctx.fillStyle = cssVar('--fg-muted');
      ctx.font = '11px ' + cssVar('--sans');
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'left'; ctx.fillText(String(axisLabels[0]), 0, height);
      ctx.textAlign = 'right'; ctx.fillText(String(axisLabels[1]), width, height);
    }
    canvas.onmousemove = (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * (width / r.width);
      const i = rects.findIndex(([a, b]) => x >= a - 2 && x <= b + 2);
      if (i < 0 || !labelFor) { tip.classList.add('is-hidden'); return; }
      tip.textContent = labelFor(i);
      tip.classList.remove('is-hidden');
      const tx = Math.min(Math.max(0, x - 40), width - tip.offsetWidth);
      tip.style.left = tx + 'px';
    };
    canvas.onmouseleave = () => tip.classList.add('is-hidden');
  };
  draw();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(draw).observe(wrapper);
  return { canvas, redraw: draw };
}
return { cssVar, setupCanvas, seqColor, drawColumns, sparkline, histogramChart };
})();

const M_main_ui_profile = (() => {
const { h, clear } = M_main_ui_dom;
const { fmtInt, fmtBytes, fmtNum, fmtPct } = M_main_format;
const { TYPE_LABEL, encodingLabel, delimLabel } = M_main_i18n;
const { histogram } = M_shared_profiler;
const { sparkline, histogramChart } = M_main_ui_charts;
// 프로파일 탭: 요약 카드, 전체 워드 빈도, 열 카드 그리드.






const TYPE_ORDER = ['int', 'float', 'hex', 'bool', 'date', 'text'];

function typeBadge(st) {
  if (!st || st.count === 0) return h('span', { class: 'badge', text: TYPE_LABEL.empty });
  if (st.hexLike) return h('span', { class: 'badge badge--hex', text: `${TYPE_LABEL.hex} · ${st.widthBits}bit` });
  if (st.mixed) return h('span', { class: 'badge badge--warn', text: `${TYPE_LABEL.mixed} (${TYPE_LABEL[st.dominant]} ${fmtPct(st.dominantShare, 0)})` });
  return h('span', { class: 'badge', text: TYPE_LABEL[st.dominant] });
}

/** 타입 분포 스택 막대 (2px 표면 간격) */
function typeBar(st) {
  const bar = h('div', { class: 'typebar', title: typeTitle(st) });
  const total = st.count || 1;
  TYPE_ORDER.forEach((name, i) => {
    const n = st.types[i];
    if (!n) return;
    const seg = h('span', { class: 't-' + name });
    seg.style.flexBasis = (n / total * 100) + '%';
    bar.appendChild(seg);
  });
  if (!st.count) bar.appendChild(h('span', { class: 't-empty', style: { flexBasis: '100%' } }));
  return bar;
}
function typeTitle(st) {
  const parts = TYPE_ORDER.map((name, i) => st.types[i] ? `${TYPE_LABEL[name]} ${fmtInt(st.types[i])}` : null).filter(Boolean);
  if (st.empty) parts.push(`빈 값 ${fmtInt(st.empty)}`);
  if (st.missing) parts.push(`없음 ${fmtInt(st.missing)}`);
  return parts.join(' · ');
}

function typeLegend() {
  return h('div', { class: 'legend' }, TYPE_ORDER.map((name) => h('span', { class: 'legend__item' }, h('i', { class: 'swatch t-' + name }), TYPE_LABEL[name])), h('span', { class: 'legend__item faint', text: '열 카드의 막대는 타입 비율, 클릭하면 상세' }));
}

function tile(label, value, cls) {
  return h('div', { class: 'tile' + (cls ? ' ' + cls : '') }, h('div', { class: 'tile__label', text: label }), h('div', { class: 'tile__value', text: value }));
}

function createProfileView({ container, onColumnClick, onWordClick, onRowClick, renderGroupBy }) {
  const root = h('div', { class: 'profile' });
  container.appendChild(root);
  let ds = null, prof = null, activeCol = -1;
  const cardEls = new Map();

  function renderPending(frac) {
    clear(root);
    if (!ds) { root.appendChild(h('div', { class: 'muted', text: '데이터를 열면 프로파일이 계산됩니다.' })); return; }
    root.appendChild(h('div', { class: 'card card--wide' },
      h('div', { class: 'card__title' }, h('span', { text: '프로파일 계산 중…' })),
      h('div', { class: 'progress', style: { width: '100%' } }, h('div', { style: { width: Math.round((frac || 0) * 100) + '%' } }))));
  }

  function renderSummary() {
    const hist = Array.from(prof.fieldCountHist);
    let minK = hist.findIndex((v) => v > 0); if (minK < 0) minK = 0;
    const maxK = hist.length - 1;
    const tiles = h('div', { class: 'tiles' },
      tile('행', fmtInt(ds.rowCount)),
      tile('열', ds.extraCount ? `${ds.schemaCount} + ${ds.extraCount}` : String(ds.schemaCount)),
      tile('크기', fmtBytes(ds.size)),
      tile('인코딩', encodingLabel(ds.encoding)),
      tile('구분자', delimLabel(ds.delimiter)),
      tile('헤더', ds.hasHeader ? '있음' : '없음'),
      tile('초과 필드 행', fmtInt(ds.overflowTotal), ds.overflowTotal ? 'tile--warn' : ''),
    );
    const fcWrap = h('div', { class: 'fc-hist' });
    const card = h('div', { class: 'card card--wide' },

      h('div', { class: 'row', style: { marginTop: '8px', alignItems: 'flex-start', gap: '16px' } },
        h('div', { style: { flex: '1', minWidth: '0' } },

          fcWrap),
        ds.overflowTotal ? h('div', { style: { flex: '0 0 220px' } },
          h('div', { class: 'muted', style: { fontSize: '11px', marginBottom: '2px' }, text: `초과 필드 행 (앞 ${Math.min(20, ds.overflowRows.length)}건, 클릭 → 표)` }),
          h('div', { class: 'chips' }, Array.from(ds.overflowRows).slice(0, 20).map((r) => h('span', { class: 'chip', text: fmtInt(r + 1), onClick: () => onRowClick && onRowClick(r) })))) : null,
      ));
    root.appendChild(card);
    const counts = hist.slice(minK, maxK + 1);
    histogramChart(fcWrap, counts, {
      height: 70, axisLabels: [`${minK}개`, `${maxK}개`],
      labelFor: (i) => `필드 ${minK + i}개: ${fmtInt(counts[i])}행`,
      highlight: ds.schemaCount - minK,
    });
  }

  function renderWords() {
    if (!prof.wordTop || !prof.wordTop.length) return;
    root.appendChild(h('div', { class: 'card card--wide' },
      h('div', { class: 'card__title' }, h('span', { text: '전체 워드 빈도 (16진수 열 통합, 상위 50)' }), h('span', { class: 'faint', text: '클릭 → 헥사 검색' })),
      h('div', { class: 'chips' }, prof.wordTop.map((w) => h('span', { class: 'chip', title: `${fmtInt(w.count)}회`, onClick: () => onWordClick && onWordClick(w.value) }, w.value, h('span', { class: 'faint', text: ' ' + fmtInt(w.count) }))))));
  }

  function statRow(label, value) { return [h('span', { text: label }), h('b', { text: value })]; }

  function renderCards() {
    root.appendChild(typeLegend());
    const grid = h('div', { class: 'cards' });
    cardEls.clear();
    prof.stats.forEach((st, c) => {
      const stats = [];
      stats.push(...statRow('채움률', fmtPct(st.fillRate)));
      stats.push(...statRow('고유값', st.distinctExact ? fmtInt(st.distinct) : fmtInt(st.distinct) + '+ (근사)'));
      if (st.numCount) {
        const isHex = st.hexLike;
        const f = (v) => (isHex ? '0x' + Math.round(v).toString(16).toUpperCase().padStart(st.hexNibblesMax || 1, '0') : fmtNum(v));
        stats.push(...statRow('범위', `${f(st.numMin)} ~ ${f(st.numMax)}`));
        if (!isHex) stats.push(...statRow('평균', fmtNum(st.numMean)));
      } else if (st.count) {
        stats.push(...statRow('길이', `${st.lenMin} ~ ${st.lenMax}`));
      }
      if (st.top && st.top.length) stats.push(...statRow('최빈', `${st.top[0][0]} ×${fmtInt(st.top[0][1])}`));
      const card = h('div', { class: 'card is-clickable' + (c >= ds.schemaCount ? ' card--extra' : ''), dataset: { col: c } },
        h('div', { class: 'card__title' }, h('span', { class: 'name', text: st.name, title: st.name }), typeBadge(st)),
        typeBar(st),
        h('div', { class: 'card__stats' }, stats));
      if (st.numCount > 1 && st.sample && st.sample.length > 1) {
        const canvas = h('canvas', { class: 'spark' });
        card.appendChild(canvas);
        requestAnimationFrame(() => sparkline(canvas, histogram(st.sample, st.sample.length, 20), { width: canvas.clientWidth || 200, height: 32 }));
      }
      card.addEventListener('click', () => { setActive(c); onColumnClick && onColumnClick(c); });
      cardEls.set(c, card);
      grid.appendChild(card);
    });
    root.appendChild(grid);
  }

  function setActive(c) {
    activeCol = c;
    for (const [col, el] of cardEls) el.classList.toggle('is-active', col === c);
  }

  function render() {
    clear(root);
    if (!ds || !prof) { renderPending(0); return; }
    renderSummary();
    renderWords();
    renderCards();
    const gbHost = h('div', { class: 'card card--wide groupby' });
    root.appendChild(gbHost);
    if (renderGroupBy) renderGroupBy(gbHost);
    if (activeCol >= 0) setActive(activeCol);
  }

  renderPending();
  return {
    setDataset(d) { ds = d; prof = null; activeCol = -1; renderPending(0); },
    setProgress(frac) { if (!prof) renderPending(frac); },
    setProfile(p) { prof = p; render(); },
    setActive,
    clear() { ds = null; prof = null; activeCol = -1; renderPending(); },
    get profile() { return prof; },
  };
}
return { typeBadge, typeBar, typeLegend, createProfileView };
})();

    const f = (v) => (isHex ? `0x${Math.round(v).toString(16).toUpperCase().padStart(st.hexNibblesMax || 1, '0')} (${fmtInt(Math.round(v))})` : fmtNum(v));

const M_main_ui_minimap = (() => {
const { h, segmented } = M_main_ui_dom;
const { setupCanvas, seqColor, cssVar } = M_main_ui_charts;
const { fmtInt } = M_main_format;
// 미니맵: 전체 행을 세로로 1024 버킷에 담아 매치 밀도를 그린다. 1D / 열별(2D) 토글.




function createMinimap({ container, onJump }) {
  container.classList.add('minimap');
  const canvas = h('canvas');
  const seg = segmented([['1d', '전체'], ['2d', '열별']], '1d', () => draw());
  const toggle = h('div', { class: 'minimap__toggle' }, seg.el);
  container.append(toggle, canvas);
  let data = null; // { rowCount, rowHist, rowColHist, cols, header }
  let view = { first: 0, last: -1 };
  let raf = 0;

  function mode() { return seg.value === '2d' && data && data.rowColHist && data.cols <= 64 ? '2d' : '1d'; }

  function draw() {
    raf = 0;
    const m = mode();
    const cols = m === '2d' ? data.cols : 1;
    const w = m === '2d' ? Math.max(56, cols * 3) : 56;
    container.style.width = w + 'px';
    const H = Math.max(10, canvas.clientHeight || container.clientHeight - toggle.offsetHeight);
    const ctx = setupCanvas(canvas, w, H);
    ctx.fillStyle = cssVar('--bg-panel');
    ctx.fillRect(0, 0, w, H);
    if (!data || !data.rowHist) { drawViewport(ctx, w, H); return; }
    const B = data.rowHist.length;
    const colW = w / cols;
    // 픽셀 행마다 버킷 합산
    const arr = m === '2d' ? data.rowColHist : data.rowHist;
    let max = 0;
    const agg = new Float64Array(H * cols);
    for (let y = 0; y < H; y++) {
      const b0 = Math.floor(y * B / H), b1 = Math.max(b0 + 1, Math.floor((y + 1) * B / H));
      for (let c = 0; c < cols; c++) {
        let s = 0;
        for (let b = b0; b < b1; b++) s += m === '2d' ? arr[b * cols + c] : arr[b];
        agg[y * cols + c] = s;
        if (s > max) max = s;
      }
    }
    if (max > 0) {
      const lmax = Math.log1p(max);
      for (let y = 0; y < H; y++) {
        for (let c = 0; c < cols; c++) {
          const v = agg[y * cols + c];
          if (!v) continue;
          ctx.fillStyle = seqColor(0.45 + 0.55 * (Math.log1p(v) / lmax));
          ctx.fillRect(c * colW, y, Math.max(1, colW - (cols > 1 ? 0.5 : 0)), 2);
        }

    }
    drawViewport(ctx, w, H);
  }
  function drawViewport(ctx, w, H) {
    if (!data || !data.rowCount || view.last < view.first) return;
    const y0 = view.first / data.rowCount * H, y1 = Math.max(y0 + 2, (view.last + 1) / data.rowCount * H);
    ctx.strokeStyle = cssVar('--accent');
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, y0 + 0.5, w - 1, y1 - y0 - 1);
  }

  canvas.addEventListener('click', (e) => {
    if (!data || !data.rowCount) return;
    const r = canvas.getBoundingClientRect();
    const row = Math.floor((e.clientY - r.top) / r.height * data.rowCount);
    onJump && onJump(Math.max(0, Math.min(data.rowCount - 1, row)));
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!data || !data.rowCount) { canvas.title = ''; return; }
    const r = canvas.getBoundingClientRect();
    const row = Math.floor((e.clientY - r.top) / r.height * data.rowCount);
    let t = `행 ${fmtInt(row + 1)} 부근`;
    if (mode() === '2d') { const c = Math.floor((e.clientX - r.left) / r.width * data.cols); if (c >= 0 && c < data.cols) t += ` · ${data.header[c] || c}`; }
    canvas.title = t + ' (클릭 → 이동)';
  });

  return {
    setData(d) { data = d; toggle.classList.toggle('is-hidden', !(d && d.rowColHist && d.cols <= 64)); schedule(); },
    setViewport(first, last) { view = { first, last }; schedule(); },
    clear() { data = data ? { rowCount: data.rowCount, rowHist: null, rowColHist: null, cols: data.cols, header: data.header } : null; schedule(); },
    setRowCount(rowCount, cols, header) { data = { rowCount, rowHist: null, rowColHist: null, cols, header }; schedule(); },
  };
}

})();

  const bytesBE = new Uint8Array(nBytes);
  for (let i = 0; i < nBytes; i++) bytesBE[i] = Number((u >> BigInt(8 * (nBytes - 1 - i))) & 0xffn);
  return { ok: true, width: widthBits, hex: '0x' + u.toString(16).toUpperCase().padStart(widthBits / 4, '0'), unsigned: u, signed, bits: bitArr, bytesBE };
}

/** 두 16비트 워드를 32비트로 (hi 가 상위 워드) */
function pair32(hi, lo) {
  const u32 = ((hi & 0xffff) * 65536 + (lo & 0xffff)) >>> 0;
  const dv = new DataView(new ArrayBuffer(4));
  dv.setUint32(0, u32, false);
  return { u32, i32: dv.getInt32(0, false), f32: dv.getFloat32(0, false) };
}

/** 셀 텍스트 → 16비트 워드 숫자 (불가하면 null) */
function wordValue(text, { bareHex = false } = {}) {
  const r = parseNumber(String(text), 0, String(text).length, { bareHex });
  if (!r || r.i === undefined || r.i < 0n || r.i > 0xffffn) return null;
  return Number(r.i);
}

})();

const M_main_ui_word_inspector = (() => {

function renderWordInspector({ text, widthBits = 16, bareHex = false, prev = null, next = null, onWidthChange }) {
  const root = h('div', { class: 'inspector' });

    root.appendChild(h('div', { class: 'faint', text: `${JSON.stringify(text)} — ${w.reason}` }));
    return root;
  }
  const kv = h('table', { class: 'kv' });
  const row = (k, v) => kv.appendChild(h('tr', {}, h('th', { text: k }), h('td', { text: v })));
  row('16진수', w.hex);
  row('부호 없음', fmtInt(w.unsigned));
  row('부호 있음', fmtInt(w.signed));
  row('바이트 (BE)', Array.from(w.bytesBE).map((b) => b.toString(16).toUpperCase().padStart(2, '0')).join(' '));
  if (widthBits === 32 || widthBits === 64) {
    const dv = new DataView(w.bytesBE.buffer, w.bytesBE.byteOffset, w.bytesBE.byteLength);
    row(widthBits === 32 ? 'float32 (BE)' : 'float64 (BE)', String(widthBits === 32 ? dv.getFloat32(0, false) : dv.getFloat64(0, false)));
  }

  // 비트 그리드 (MSB 우선, 니블 단위 묶음)

  for (let i = 0; i < widthBits; i++) {

  }

  // 32비트 쌍 (16비트 워드 열에서 이웃이 있을 때)
  if (widthBits === 16) {
    const cur = wordValue(text, { bareHex });
    const nxt = next != null ? wordValue(next, { bareHex }) : null;
    const prv = prev != null ? wordValue(prev, { bareHex }) : null;
    if (cur != null && (nxt != null || prv != null)) {

          h('div', {}, h('span', { class: 'faint', text: 'uint32 ' }), fmtInt(p.u32)),
          h('div', {}, h('span', { class: 'faint', text: 'int32 ' }), fmtInt(p.i32)),
          h('div', {}, h('span', { class: 'faint', text: 'float32 ' }), Number.isFinite(p.f32) ? p.f32.toPrecision(7) : String(p.f32)))));
      };
      if (nxt != null) { add('이 셀 ‖ 다음 셀 (빅 엔디안 워드 순서)', cur, nxt); add('다음 셀 ‖ 이 셀 (리틀)', nxt, cur); }
      if (prv != null) { add('이전 셀 ‖ 이 셀 (빅)', prv, cur); add('이 셀 ‖ 이전 셀 (리틀)', cur, prv); }

}

})();

const M_main_ui_filter_bar = (() => {
const { h, select } = M_main_ui_dom;
const { FILTER_OPS } = M_shared_filter;
// 행 필터 바: 최대 4개 조건 (열, 연산, 값 | 최소~최대), AND.



function createFilterBar({ container, onChange }) {
  let columns = [];
  const rows = [];
  const list = h('div', { class: 'filter__list' });
  const addBtn = h('button', { class: 'btn btn--sm', type: 'button', text: '+ 조건' });
  const clearBtn = h('button', { class: 'btn btn--sm', type: 'button', text: '모두 제거' });
  const hint = h('span', { class: 'faint', text: '조건은 AND 로 결합되어 검색·그룹 집계에 적용됩니다. 값은 5 = 05 = 0x05 처럼 수치로도 비교합니다.' });
  container.append(list, h('div', { class: 'row' }, addBtn, clearBtn, hint));
  let timer = 0;
  const fire = () => { clearTimeout(timer); timer = setTimeout(() => onChange && onChange(getConditions()), 300); };

  function colSelect(value) {
    const s = h('select', { class: 'select' });
    columns.forEach((name, i) => s.appendChild(h('option', { value: String(i), text: name })));
    if (value != null) s.value = String(value);
    return s;
  }
  function addRow(cond = {}) {
    if (rows.length >= 4) return null;
    const colSel = colSelect(cond.col);
    const opSel = select(FILTER_OPS, cond.op || 'eq');
    const val = h('input', { class: 'input', type: 'text', placeholder: '값', spellcheck: 'false', autocomplete: 'off', value: cond.value || '' });
    const min = h('input', { class: 'input', type: 'text', placeholder: '최소', spellcheck: 'false', autocomplete: 'off', value: cond.min || '' });
    const max = h('input', { class: 'input', type: 'text', placeholder: '최대', spellcheck: 'false', autocomplete: 'off', value: cond.max || '' });
    const tilde = h('span', { text: '~' });
    const del = h('button', { class: 'btn btn--sm', type: 'button', text: '×', title: '조건 제거' });
    const row = h('div', { class: 'filter__cond' }, colSel, opSel, val, min, tilde, max, del);
    const sync = () => { const range = opSel.value === 'range'; val.classList.toggle('is-hidden', range); min.classList.toggle('is-hidden', !range); max.classList.toggle('is-hidden', !range); tilde.classList.toggle('is-hidden', !range); };
    sync();
    opSel.addEventListener('change', () => { sync(); fire(); });
    for (const el of [colSel, val, min, max]) { el.addEventListener('input', fire); el.addEventListener('change', fire); }
    for (const el of [val, min, max]) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(timer); onChange && onChange(getConditions()); } });
    del.addEventListener('click', () => { const i = rows.indexOf(entry); if (i >= 0) rows.splice(i, 1); row.remove(); fire(); });
    const entry = { row, colSel, opSel, val, min, max };
    rows.push(entry);
    list.appendChild(row);
    return entry;
  }
  function getConditions() {
    const out = [];
    for (const r of rows) {
      const op = r.opSel.value, col = Number(r.colSel.value);
      if (Number.isNaN(col)) continue;
      if (op === 'range') { if (r.min.value.trim() === '' && r.max.value.trim() === '') continue; out.push({ col, op, min: r.min.value, max: r.max.value }); }
      else { if (r.val.value.trim() === '' && op !== 'neq') continue; out.push({ col, op, value: r.val.value }); }
    }
    return out;
  }
  addBtn.addEventListener('click', () => { addRow(); });
  clearBtn.addEventListener('click', () => { for (const r of rows) r.row.remove(); rows.length = 0; fire(); });

  return {
    setColumns(header) {
      columns = header || [];
      for (const r of rows) { const v = r.colSel.value; const s = colSelect(v); r.colSel.replaceWith(s); r.colSel = s; s.addEventListener('change', fire); }
    },
    getConditions,
    setConditions(conds) {
      for (const r of rows) r.row.remove();
      rows.length = 0;
      for (const c of (conds || []).slice(0, 4)) addRow(c);
      clearTimeout(timer);
      onChange && onChange(getConditions());
    },
    get count() { return getConditions().length; },
    clear() { for (const r of rows) r.row.remove(); rows.length = 0; columns = []; },
  };
}
return { createFilterBar };
})();

const M_main_ui_offset_bar = (() => {
const { h } = M_main_ui_dom;
const { setupCanvas, seqColor, cssVar } = M_main_ui_charts;
const { fmtBytes } = M_main_format;
// 오프셋 바: 파일 전체 바이트 범위를 가로로, 바이트 검색 매치 밀도와 현재 뷰포트를 그린다.




function createOffsetBar({ container, onJump }) {
  const canvas = h('canvas');
  container.appendChild(canvas);
  let size = 0, hist = null, view = [0, 0], raf = 0;
  function draw() {
    raf = 0;
    const w = container.clientWidth || 300, hh = container.clientHeight || 28;
    const ctx = setupCanvas(canvas, w, hh);
    ctx.fillStyle = cssVar('--bg-elev');
    ctx.fillRect(0, 0, w, hh);
    if (hist && size > 0) {
      const B = hist.length;
      let max = 0;
      const agg = new Float64Array(w);
      for (let x = 0; x < w; x++) {
        const b0 = Math.floor(x * B / w), b1 = Math.max(b0 + 1, Math.floor((x + 1) * B / w));
        let s = 0; for (let b = b0; b < b1; b++) s += hist[b];
        agg[x] = s; if (s > max) max = s;
      }
      if (max > 0) {
        const lmax = Math.log1p(max);
        for (let x = 0; x < w; x++) { if (!agg[x]) continue; ctx.fillStyle = seqColor(0.45 + 0.55 * Math.log1p(agg[x]) / lmax); ctx.fillRect(x, 2, 1, hh - 4); }
      }
    }
    if (size > 0 && view[1] > view[0]) {
      const x0 = view[0] / size * w, x1 = Math.max(x0 + 2, view[1] / size * w);
      ctx.strokeStyle = cssVar('--accent'); ctx.lineWidth = 1.5;
      ctx.strokeRect(x0 + 0.5, 1, x1 - x0 - 1, hh - 2);
    }
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(draw); };
  canvas.addEventListener('click', (e) => {
    if (!size) return;
    const r = canvas.getBoundingClientRect();
    onJump && onJump(Math.floor((e.clientX - r.left) / r.width * size));
  });
  canvas.addEventListener('mousemove', (e) => {
    if (!size) { canvas.title = ''; return; }
    const r = canvas.getBoundingClientRect();
    const off = Math.floor((e.clientX - r.left) / r.width * size);
    canvas.title = `오프셋 0x${off.toString(16).toUpperCase()} (${fmtBytes(off)}) — 클릭 → 이동`;
  });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(schedule).observe(container);
  return {
    setSize(s) { size = s; schedule(); },
    setHist(hh) { hist = hh; schedule(); },
    setView(a, b) { view = [a, b]; schedule(); },
    clear() { hist = null; schedule(); },
  };
}
return { createOffsetBar };
})();
