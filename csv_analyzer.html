  let hits = null;        // { offsets: Uint32Array-like getter, count, length(L) }
  let seq = 0;

  const vl = createVirtualList({ container: dumpHost, rowHeight: 28, overscan: 8, render: renderLine, onRangeChange: onRange, rowClass: 'vlist__row hex__line' });
  dumpHost.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-row]');
    if (btn) { onGotoCell && onGotoCell(Number(btn.dataset.row), Number(btn.dataset.col)); return; }
    const span = e.target.closest('.hex__bytes span[data-off]');
    if (span) { const off = Number(span.dataset.off); offIn.value = '0x' + off.toString(16).toUpperCase(); describe(off); }
  });
  goBtn.addEventListener('click', () => jumpInput());
  offIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpInput(); });
  function jumpInput() {
    const t = offIn.value.trim();
    if (!t) return;
    const v = /^0x/i.test(t) ? parseInt(t, 16) : parseInt(t, 10);
    if (Number.isNaN(v)) return;
    showOffset(v);
  }

  function lineCount() { return ds ? Math.ceil(ds.size / LINE) : 0; }

  async function onRange(first, last) {
    if (!ds) return;
    bar.setView(first * LINE, Math.min(ds.size, (last + 1) * LINE));
    const need0 = Math.max(0, first - 8) * LINE, need1 = Math.min(ds.size, (last + 9) * LINE);
    if (win && win.offset <= need0 && win.offset + win.bytes.length >= need1) return;
    const off = Math.max(0, (first - 24) * LINE), len = Math.min(ds.size - off, (last - first + 49) * LINE);
    if (pendingWin && pendingWin.off === off && pendingWin.len === len) return;
    const my = ++seq;
    pendingWin = { off, len };
    try {
      const r = await requestBytes(off, len);
      if (my !== seq) return;
      win = { offset: r.offset, bytes: r.bytes, records: r.records, cols: r.cols };
      pendingWin = null;
      vl.refresh();
    } catch { pendingWin = null; }
  }

  function annotation(rec, col) {
    if (!ds) return '';
    if (rec < 0) return ds.bomLength ? 'BOM / 범위 밖' : '';
    if (rec < ds.dataStart) return col >= 0 ? `헤더 · ${ds.header[col] || ''}` : '헤더';
    const row = rec - ds.dataStart;
    return col >= 0 ? `행 ${fmtInt(row + 1)} · ${ds.header[col] || `열${col + 1}`}` : `행 ${fmtInt(row + 1)} · 구분자/줄끝`;
  }

  function hitRangesIn(a, b) {
    // hits.offsets 는 오름차순
    const out = [];
    if (!hits || !hits.count) return out;
    const L = hits.length;
    let lo = 0, hi = hits.count;
    while (lo < hi) { const mid = (lo + hi) >>> 1; if (hits.get(mid) + L <= a) lo = mid + 1; else hi = mid; }
    for (let i = lo; i < hits.count; i++) { const o = hits.get(i); if (o >= b) break; out.push([o, o + L]); }
    return out;
  }

  function renderLine(idx, el) {
    if (el.childElementCount !== 4) {
      clear(el);
      el.append(h('span', { class: 'hex__off' }), h('span', { class: 'hex__bytes' }), h('span', { class: 'hex__ascii' }), h('span', { class: 'hex__ann' }));
    }
    const [offEl, bytesEl, asciiEl, annEl] = el.children;
    const lineOff = idx * LINE;
    offEl.textContent = lineOff.toString(16).toUpperCase().padStart(8, '0');
    if (!win || lineOff < win.offset || lineOff >= win.offset + win.bytes.length) {
      bytesEl.textContent = '…'; asciiEl.textContent = ''; annEl.textContent = '';
      return;
    }
    const rel = lineOff - win.offset;
    const slice = win.bytes.subarray(rel, Math.min(win.bytes.length, rel + LINE));
    const line = hexLine(lineOff, slice, LINE);
    const ranges = hitRangesIn(lineOff, lineOff + LINE);
    clear(bytesEl); clear(asciiEl);
    for (let i = 0; i < LINE; i++) {
      const off = lineOff + i;
      let cls = '';
      if (i < slice.length) {
        if (highlight && off >= highlight.start && off < highlight.end) cls = highlight.kind === 'cell' ? 'cell' : 'hl';
        else if (ranges.some(([a, b]) => off >= a && off < b)) cls = 'hl';
      }
      bytesEl.appendChild(h('span', { class: cls || null, dataset: i < slice.length ? { off } : null, text: line.hex[i] }));
      asciiEl.appendChild(h('span', { class: cls || null, text: line.ascii[i] }));
    }
    const li = Math.floor(rel / LINE);
    const rec = win.records[li], col = win.cols[li];
    clear(annEl);
    annEl.appendChild(h('span', { text: annotation(rec, col) }));
    if (rec >= ds.dataStart) annEl.appendChild(h('button', { class: 'btn--link', type: 'button', text: ' 표에서 보기', dataset: { row: rec - ds.dataStart, col: Math.max(0, col) } }));
  }

  function describe(off) { posEl.textContent = `0x${off.toString(16).toUpperCase()} = ${fmtInt(off)}`; }

  function showOffset(off, hl) {
    if (!ds) return;
    off = Math.max(0, Math.min(ds.size - 1, off));
    highlight = hl || null;
    vl.scrollToIndex(Math.floor(off / LINE), 'center');
    describe(off);
    vl.refresh();
  }

  return {
    setDataset(d) {
      ds = d ? { size: d.size, dataStart: d.dataStart, header: d.header, bomLength: d.bomLength } : null;
      win = null; pendingWin = null; highlight = null; hits = null;
      bar.setSize(ds ? ds.size : 0); bar.clear();
      empty.classList.toggle('is-hidden', !!ds);
      vl.setCount(lineCount());
      if (!ds) { vl.clearPool(); posEl.textContent = ''; }
      hitInfo.textContent = '';
      if (ds) vl.layoutNow();
    },
    /** 셀/행 바이트 범위를 강조하며 이동 */
    showRange(start, end, kind = 'cell') { showOffset(start, { start, end, kind }); },
    showOffset,
    setHits(h2) { hits = h2; hitInfo.textContent = h2 && h2.count ? `바이트 검색 매치 ${fmtInt(h2.total)}건 (니들 ${h2.length}B)` : ''; vl.refresh(); },
    setHist(hist) { bar.setHist(hist); },
    clearHits() { hits = null; hitInfo.textContent = ''; bar.clear(); vl.refresh(); },
    refresh() { vl.refresh(); },
    clear() { this.setDataset(null); },
  };
}
return { createHexView };
})();

// ===== src/main/leave-guard.js =====
const M_main_leave_guard = (() => {
// 데이터가 열려 있을 때 페이지를 떠나면(「홈」, 새로고침, 탭 닫기) 브라우저 확인창을 띄운다.
// 데이터는 이 탭 메모리에만 있어서 한 번 떠나면 되돌릴 수 없다. hasData 는 떠나는 시점에 읽는다.
function installLeaveGuard(target, hasData) {
  const onBeforeUnload = (e) => {
    if (!hasData()) return;
    e.preventDefault();
    e.returnValue = true; // preventDefault 만으로는 확인창을 띄우지 않는 구형 브라우저용
  };
  target.addEventListener('beforeunload', onBeforeUnload);
  return () => target.removeEventListener('beforeunload', onBeforeUnload);
}
return { installLeaveGuard };
})();

// ===== src/main/app.js =====
const M_main_app = (() => {
const { createWorkerClient } = M_main_worker_client;
const { createRowCache } = M_main_row_cache;
const { createStore } = M_main_store;
const { createTable } = M_main_ui_table;
const { createInputPanel } = M_main_ui_input_panel;
const { createStatusBar } = M_main_ui_status_bar;
const { createProfileView } = M_main_ui_profile;
const { renderColumnDetail } = M_main_ui_column_detail;
const { createSearchBar } = M_main_ui_search_bar;
const { createResultsView } = M_main_ui_results;
const { createMinimap } = M_main_ui_minimap;
const { renderRowDetail } = M_main_ui_row_detail;
const { createFilterBar } = M_main_ui_filter_bar;
const { createGroupByView } = M_main_ui_groupby;
const { createHexView } = M_main_ui_hex_view;
const { h, clear, $, $$ } = M_main_ui_dom;
const { fmtInt, fmtBytes } = M_main_format;
const { encodingLabel, delimLabel } = M_main_i18n;
const { MSG } = M_shared_protocol;
const { installLeaveGuard } = M_main_leave_guard;
// 메인 엔트리: 워커 클라이언트, 뷰, 입력 패널, 검색을 배선한다.





















const store = createStore({ ds: null, profile: null });
let client = null;
let rowCache = null;
let currentBlob = null;
installLeaveGuard(window, () => currentBlob !== null); // 「홈」·새로고침으로 열린 데이터를 잃기 전에 확인
let openSeq = 0;
let selected = null;     // { row, col }
let lastDetail = null;   // rowDetail 메시지
let widthOverride = null;
let activeQuery = null;

// ---------- 뷰 구성 ----------
const statusBar = createStatusBar($('#status-bar'));
const tableHost = $('#view-table');
const table = createTable({ container: tableHost, onCellClick: selectCell, onHeaderClick, onRangeChange: (a, b) => minimap.setViewport(a, b) });
const minimapHost = h('div');
tableHost.appendChild(minimapHost);
const minimap = createMinimap({ container: minimapHost, onJump: (row) => { table.scrollToRow(row, 'start'); } });
const inputPanel = createInputPanel({ container: $('#input-panel'), onOpen, onReopen });
let groupBy = null;
let groupSeq = 0;
const profileView = createProfileView({
  container: $('#view-profile'), onColumnClick: showColumnDetail, onWordClick: (w) => actions.searchHex(w), onRowClick: (r) => gotoRow(r),
  renderGroupBy: (host) => {
    groupBy = createGroupByView({ host, onRun: runGroupBy, onPick: (conds) => { filterBar.setConditions(conds); searchBar.filterHost.classList.remove('is-hidden'); statusBar.setMessage('그룹 조건을 필터에 적용했습니다. 검색/집계에 반영됩니다.'); } });
    const ds = store.get().ds;
    if (ds) { groupBy.setColumns(ds.header); if (ds.schemaCount >= 4 && /RT_Address/i.test(ds.header[1] || '')) groupBy.preset([1, 2, 3]); }
  },
});
const detailPanel = $('#detail-panel');
const searchBar = createSearchBar({ container: $('#search-bar'), onSearch: runSearch, onClear: clearSearch });
const filterBar = createFilterBar({ container: searchBar.filterHost, onChange: () => { searchBar.rerun(); updateFilterBadge(); } });
searchBar.setFilterGetter(() => { const c = filterBar.getConditions(); return c.length ? c : null; });
function updateFilterBadge() {
  const n = filterBar.count;
  const btn = Array.from($('#search-bar').querySelectorAll('button')).find((b) => b.textContent.startsWith('필터'));
  if (btn) { btn.textContent = n ? `필터 ${n} ▾` : '필터 ▾'; btn.classList.toggle('has-filter', n > 0); }
}
function runGroupBy({ cols, useFilter }) {
  const ds = store.get().ds;
  if (!ds || !groupBy) return;
  const id = ++groupSeq;
  const filter = useFilter ? filterBar.getConditions() : [];
  client.request(MSG.GROUP_BY, { id, cols, filter: filter.length ? filter : null }).then((msg) => { if (id === groupSeq) groupBy.setResult(msg); }).catch((e) => groupBy.setError(e.message));
}
const results = createResultsView({
  container: $('#results'),
  onPick: (r) => {
    if (r.kind === 'bytes') { showTab('hex'); hexView.showRange(r.offset, r.offset + r.length, 'hit'); if (r.row >= 0) { table.scrollToRow(r.row); if (r.col >= 0) table.select(r.row, r.col); } return; }
    gotoRow(r.row, r.colStart); selectCell(r.row, r.colStart);
  },
  requestCells: async (items) => (await client.request(MSG.CELLS, { items })).texts,
  requestLocate: async (offsets) => (await client.request(MSG.LOCATE_MANY, { offsets })).items,
  onColumnPick: (col) => searchBar.setScopeColumn(col),
});
const hexView = createHexView({
  container: $('#view-hex'),
  requestBytes: async (offset, length) => client.request(MSG.BYTES, { offset, length }),
  onGotoCell: (row, col) => { gotoRow(row, col); selectCell(row, col); },
});
const engineMode = $('#engine-mode');

// 다른 단계(M3b/M4)에서 채우는 동작 훅
const actions = {
  searchHex(word, col) { searchBar.setPattern('hex', word, { whole: true, column: col == null ? null : col }); },
  searchValue(col, value) {
    const prof = store.get().profile;
    const st = prof && prof.stats[col];
    if (st && st.hexLike && /^(0[xX])?[0-9A-Fa-f: _-]+$/.test(value)) searchBar.setPattern('hex', value, { whole: true, column: col });
    else searchBar.setPattern('text', value, { column: col, textMode: 'whole' });
  },
  hexView(start, end, row, col) { showTab('hex'); hexView.showRange(start, end, 'cell'); statusBar.setMessage(`바이트 ${fmtInt(start)}~${fmtInt(end)}${row != null ? ` · 행 ${fmtInt(row + 1)}` : ''}${col != null && col >= 0 ? ` · ${store.get().ds.header[col]}` : ''}`); },
};

function showDetail(el) {
  clear(detailPanel);
  detailPanel.appendChild(el || h('div', { class: 'detail__empty', text: '표에서 셀을 클릭하거나 프로파일에서 열을 선택하면 상세가 표시됩니다.' }));
}
showDetail(null);

// ---------- 탭 ----------
const tabs = $$('#tabs .tab');
const views = $$('.view');
function showTab(name) {
  for (const t of tabs) t.classList.toggle('is-active', t.dataset.tab === name);
  for (const v of views) v.classList.toggle('is-hidden', v.dataset.view !== name);
  if (name === 'table') table.refresh();
  if (name === 'hex') hexView.refresh();
}
for (const tab of tabs) tab.addEventListener('click', () => showTab(tab.dataset.tab));

// ---------- 이동 / 선택 ----------
function gotoRow(row, col) {
  showTab('table');
  table.scrollToRow(row);
  if (col != null) { table.scrollToCol(col); table.select(row, col); }
}
async function selectCell(row, col) {
  const ds = store.get().ds;
  if (!ds) return;
  selected = { row, col };
  table.select(row, col);
  const myClient = client;
  try {
    const d = await myClient.request(MSG.ROW_DETAIL, { row });
    if (!selected || selected.row !== row || store.get().ds !== ds) return;
    lastDetail = d;
    renderDetail();
  } catch (e) { if (client === myClient && store.get().ds === ds) statusBar.setMessage('행 상세 실패: ' + e.message, 'error'); }
}
function renderDetail() {
  const ds = store.get().ds;
  if (!ds || !lastDetail || !selected) return;
  const prof = store.get().profile;
  showDetail(renderRowDetail(lastDetail, ds, {
    selectedCol: selected.col, stats: prof ? prof.stats : null,
    onSelectCol: (c) => { selected.col = c; table.select(selected.row, c); table.scrollToCol(c); renderDetail(); },
    onHexView: (start, end, row, col) => actions.hexView(start, end, row, col),
    widthOverride, onWidthChange: (w) => { widthOverride = w; renderDetail(); },
  }));
}
function showColumnDetail(col) {
  const prof = store.get().profile;
  if (!prof || !prof.stats[col]) { statusBar.setMessage('프로파일이 아직 계산 중입니다.'); return; }
  profileView.setActive(col);
  showDetail(renderColumnDetail(prof.stats[col], store.get().ds, { onValueClick: (c, v) => actions.searchValue(c, v), onRowClick: (r) => gotoRow(r, col) }));
}
function onHeaderClick(col) {
  searchBar.setScopeColumn(col);
  const ds = store.get().ds;
  statusBar.setMessage(`검색 범위를 "${ds.header[col]}" 열로 한정했습니다.`);
  if (store.get().profile) showColumnDetail(col);
}

// ---------- 검색 ----------
function runSearch(q) {
  const ds = store.get().ds;
  if (!ds) { searchBar.showError('먼저 CSV 파일을 열거나 내용을 붙여넣으세요.'); return; }
  activeQuery = q;
  results.reset(q, ds.header);
  minimap.clear();
  hexView.clearHits();
  table.setColCounts(null);
  table.setHighlights((row) => results.colsForRow(row));
  if (q.kind === 'bytes') showTab('hex');
  client.send(MSG.SEARCH, { query: q });
}
function clearSearch() {
  activeQuery = null;
  if (client) client.send(MSG.CANCEL, { id: 0 });
  results.clear();
  minimap.clear();
  hexView.clearHits();
  table.setColCounts(null);
  table.setHighlights(null);
}

// ---------- 클라이언트 생명주기 ----------
function bootClient() {
  client = createWorkerClient(onEvent, { forceFallback: window.__csvForceFallback === true });
  rowCache = createRowCache(client);
  rowCache.onPage(() => table.refresh());
  client.ready.then(() => { engineMode.textContent = client.isFallback ? '메인 스레드 모드' : '워커 모드'; });
}
function teardown() {
  if (client) client.terminate();
  client = null;
  if (rowCache) rowCache.invalidate();
  rowCache = null;
  selected = null; lastDetail = null; activeQuery = null;
  table.clear();
  profileView.clear();
  results.clear();
  hexView.clear();
  minimap.setRowCount(0, 0, []);
  showDetail(null);
  statusBar.reset();
  store.reset();
}
function clearAll() {
  teardown();
  currentBlob = null;
  inputPanel.clear();
  searchBar.clear();
  filterBar.clear();
  updateFilterBadge();
  bootClient();
  statusBar.setMessage('모두 지웠습니다. 데이터는 메모리에서 해제되었습니다.');
}
$('#btn-clear-all').addEventListener('click', clearAll);

async function onOpen(blob, options) {
  const seq = ++openSeq;
  teardown();
  bootClient();
  currentBlob = blob;
  statusBar.setProgress('열기', null);
  statusBar.setMessage('');
  try {
    const opened = await client.request(MSG.OPEN, { blob, options });
    if (seq !== openSeq) return;
    inputPanel.setDetected(opened);
  } catch (e) {
    if (seq !== openSeq) return;
    statusBar.setProgress(null);
    statusBar.setMessage('열기 실패: ' + e.message, 'error');
  }
}
function onReopen(options) { if (currentBlob) onOpen(currentBlob, options); }

function onEvent(msg) {
  const ds = store.get().ds;
  switch (msg.type) {
    case MSG.INDEX_PROGRESS:
      statusBar.setProgress('인덱싱', msg.total ? msg.done / msg.total : null);
      statusBar.setInfo([fmtInt(msg.records) + '행 발견']);
      break;
    case MSG.INDEXED:
      onIndexed(msg);
      break;
    case MSG.PROFILE_PROGRESS:
      statusBar.setProgress('프로파일', msg.total ? msg.done / msg.total : null);
      profileView.setProgress(msg.total ? msg.done / msg.total : 0);
      break;
    case MSG.PROFILED:
      statusBar.setProgress(null);
      store.set({ profile: msg });
      profileView.setProfile(msg);
      if (ds) searchBar.setColumns(ds.header, msg.hexLike);
      if (lastDetail && selected) renderDetail();
      statusBar.setMessage('프로파일 완료');
      break;
    case MSG.SEARCH_BATCH:
      if (!activeQuery || msg.id !== activeQuery.id || !ds) break;
      results.append(msg);
      if (msg.kind === 'bytes') {
        hexView.setHits(results.hits);
        hexView.setHist(msg.byteHist);
        minimap.setData({ rowCount: msg.rowCount, rowHist: msg.rowHist, rowColHist: null, cols: ds.columnCount, header: ds.header });
        break;
      }
      minimap.setData({ rowCount: msg.rowCount, rowHist: msg.rowHist, rowColHist: msg.rowColHist, cols: ds.columnCount, header: ds.header });
      table.setColCounts(msg.colCounts);
      table.refresh();
      break;
    case MSG.SEARCH_PROGRESS:
      results.setProgress(msg);
      break;
    case MSG.SEARCH_DONE:
      results.done(msg);
      break;
    case MSG.GROUP_BY_PROGRESS:
      if (groupBy && msg.id === groupSeq) groupBy.setProgress(msg);
      break;
    case MSG.SEARCH_ERROR:
      results.setError(msg);
      if (activeQuery && msg.id === activeQuery.id) searchBar.showError(msg.message);
      break;
    case MSG.ERROR:
      statusBar.setMessage(msg.message || '오류', 'error');
      break;
    default:
      break;
  }
}

async function onIndexed(ds) {
  store.set({ ds, profile: null });
  statusBar.setProgress(null);
  statusBar.setInfo([
    fmtInt(ds.rowCount) + '행', ds.extraCount ? `${ds.schemaCount}열 (+${ds.extraCount})` : `${ds.schemaCount}열`,
    fmtBytes(ds.size), encodingLabel(ds.encoding), delimLabel(ds.delimiter),
    ds.overflowTotal ? `초과 필드 행 ${fmtInt(ds.overflowTotal)}` : '',
  ]);
  inputPanel.setSummary(ds, currentBlob);
  profileView.setDataset(ds);
  searchBar.setColumns(ds.header, null);
  filterBar.setColumns(ds.header);
  minimap.setRowCount(ds.rowCount, ds.columnCount, ds.header);
  hexView.setDataset(ds);
  statusBar.setProgress('프로파일', 0);
  let sample;
  try { sample = await client.request(MSG.ROWS, { from: 0, to: Math.min(ds.rowCount, 60) }); } catch { return; } // 파일 전환 중이면 조용히 중단
  if (store.get().ds !== ds) return;
  table.setDataset({
    header: ds.header, columnCount: ds.columnCount, schemaCount: ds.schemaCount, rowCount: ds.rowCount,
    getRow: (r) => (rowCache ? rowCache.getRow(r) : undefined), sampleRows: sample.rows,
  });
  showTab('table');
  searchBar.rerun();
}

// ---------- 전역 단축키 / 드롭 ----------
window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); searchBar.focus(); return; }
  if (e.key === 'F3') { e.preventDefault(); results.step(e.shiftKey ? -1 : 1); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); searchBar.focus(); }
});
window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && !(e.target.closest && e.target.closest('.drop'))) onOpen(f, inputPanel.options);
});

bootClient();
return {  };
})();
</script>
