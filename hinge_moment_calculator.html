<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>힌지모멘트 계산기</title>
  <link href="[https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap](https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap)" rel="stylesheet">
  <script src="[https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js](https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js)"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #f5f5f7;
      --surface3: #e8e8ed;
      --border: rgba(0, 0, 0, 0.07);
      --border2: rgba(0, 0, 0, 0.12);
      --accent: #0071e3;
      --accent2: #bf5af2;
      --text: #1d1d1f;
      --text2: #6e6e73;
      --text3: #aeaeb2;
      --r: 8px;
      --rl: 12px;
      --rx: 16px;
      --sh: 0 1px 2px rgba(0, 0, 0, 0.05), 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, 'Noto Sans KR', BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px 28px;
      min-height: 100vh;
    }

    /* ── Titlebar ── */
    .titlebar {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 44px;
      background: rgba(242, 242, 247, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      margin: 0 -20px 16px;
    }

    .t-divider {
      width: 1px;
      height: 14px;
      background: var(--border2)
    }

    .t-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(150deg, #9b5de5 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
    }

    .t-icon svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .t-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -.3px;
      color: var(--text)
    }

    .t-home {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 500;
      text-decoration: none;
      padding: 3px 8px 3px 4px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: background .15s;
    }

    .t-home:hover {
      background: rgba(0, 113, 227, .08)
    }

    .t-home svg {
      width: 14px;
      height: 14px
    }

    /* ── Header ── */
    .page-header {
      margin-bottom: 14px
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 2px
    }

    .page-header h1 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -.02em
    }

    .page-header p {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px
    }

    /* ── AC type bar ── */
    .ac-bar {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--surface);
      border-radius: var(--rx);
      padding: 8px 12px;
      box-shadow: var(--sh);
      margin-bottom: 8px;
    }

    .ac-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-right: 4px
    }

    .ac-btn {
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 7px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }

    .ac-btn:hover {
      background: var(--surface3);
      color: var(--text)
    }

    .ac-btn.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    /* ── Surface tabs ── */
    .surf-bar {
      display: flex;
      gap: 3px;
      background: var(--surface);
      border-radius: var(--rl);
      padding: 3px;
      box-shadow: var(--sh);
      margin-bottom: 10px;
    }

    .surf-btn {
      flex: 1;
      min-width: 80px;
      padding: 7px 8px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      transition: all .15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: relative;
    }

    .surf-btn:hover {
      background: var(--surface2)
    }

    .surf-btn.on {
      background: var(--surface2);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06)
    }

    .surf-h {
      font-size: 13px;
      font-weight: 700;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      line-height: 1;
    }

    .surf-btn.on .surf-h {
      color: var(--accent)
    }
