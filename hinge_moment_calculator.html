<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>힌지모멘트 분석기</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #f5f5f7;
      --border: rgba(0, 0, 0, 0.1);
      --accent: #0071e3;
      --text: #1d1d1f;
      --text2: #6e6e73;
      --rx: 12px;
      --sh: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 상단 타이틀 섹션 */
    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
    }

    /* 메인 레이아웃 (좌우 2칸) */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--rx);
      box-shadow: var(--sh);
      border: 1px solid var(--border);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--bg);
    }

    /* 입력 폼 스타일 */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      outline: none;
      font-size: 14px;
      text-align: right;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    /* 결과 텍스트 스타일 */
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--surface2);
    }

    .result-label {
      color: var(--text2);
      font-size: 14px;
    }

    .result-value {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
    }

    .highlight-box {
      background: #eef7ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    /* 차트 크기 조정 */
    .chart-container {
      height: 250px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Hinge Moment Analyzer</h1>
      <p style="color: var(--text2);">조종면의 공력적 균형과 힌지 토크 계산</p>
    </div>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-title">비행 및 기하학적 데이터</div>

        <div class="input-group">
          <label>에어스피드 (V) : <span id="v_text">50</span> m/s</label>
          <div class="input-row">
            <input type="range" id="v_range" min="1" max="300" value="50" oninput="calculate()">
            <input type="number" id="v_num" value="50" oninput="sync('v')">
          </div>
        </div>

        <div class="input-group">
          <label>편향각 (δ) : deg</label>
          <div class="input-row">
            <input type="range" id="d_range" min="-30" max="30" value="15" oninput="calculate()">
            <input type="number" id="d_num" value="15" oninput="sync('d')">
          </div>
        </div>

        <div class="input-group">
          <label>조종면 면적 (S_f) : m²</label>
          <input type="number" id="area" value="0.1" step="0.01" oninput="calculate()">
        </div>

        <div class="input-group">
          <label>평균 시위 (c_bar) : m</label>
          <input type="number" id="chord" value="0.2" step="0.01" oninput="calculate()">
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">계산 분석 결과</div>

        <div class="result-row">
          <span class="result-label">동압 (Dynamic Pressure, q)</span>
          <span class="result-value"><span id="q_res">0</span> Pa</span>
        </div>

        <div class="highlight-box">
          <div class="result-row" style="border:none;">
            <span class="result-label" style="font-weight:600;">최종 힌지 모멘트 (H)</span>
            <span class="result-value" style="font-size:22px;"><span id="h_res">0.000</span> N·m</span>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="hmChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    let myChart = null;

    // 슬라이더와 숫자 입력칸 동기화
    function sync(type) {
      const num = document.getElementById(type + '_num');
      const range = document.getElementById(type + '_range');
      range.value = num.value;
      calculate();
    }

    function calculate() {
      // 값 가져오기
      const v = parseFloat(document.getElementById('v_range').value);
      const delta = parseFloat(document.getElementById('d_range').value);
      const Sf = parseFloat(document.getElementById('area').value);
      const c = parseFloat(document.getElementById('chord').value);

      // 텍스트 업데이트
      document.getElementById('v_text').innerText = v;
      document.getElementById('v_num').value = v;
      document.getElementById('d_num').value = delta;

      // 공력 계산 (표준 대기 밀도 1.225)
      const rho = 1.225;
      const q = 0.5 * rho * v * v;
      const ch_delta = -0.006; // 일반적인 에어포일 계수 가정
      const ch_alpha = -0.003;
      const alpha = 3; // 받음각 3도 가정

      const CH = (ch_delta * delta) + (ch_alpha * alpha);
      const H = Math.abs(CH * q * Sf * c);

      // UI 업데이트
      document.getElementById('q_res').innerText = Math.round(q).toLocaleString();
      document.getElementById('h_res').innerText = H.toFixed(3);

      updateChart(Sf, c, delta, ch_delta, ch_alpha, alpha, rho);
    }

    function updateChart(Sf, c, delta, chd, cha, a, rho) {
      const labels = [];
      const data = [];
      for (let speed = 0; speed <= 200; speed += 20) {
        labels.push(speed);
        const q_v = 0.5 * rho * speed * speed;
        const h_v = Math.abs(((chd * delta) + (cha * a)) * q_v * Sf * c);
        data.push(h_v);
      }

      const ctx = document.getElementById('hmChart').getContext('2d');
      if (myChart) {
        myChart.destroy();
      }

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '속도별 모멘트 (N·m)',
            data: data,
            borderColor: '#0071e3',
            backgroundColor: 'rgba(0, 113, 227, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    // 초기 실행
    window.onload = calculate;
  </script>
</body>

</html>
